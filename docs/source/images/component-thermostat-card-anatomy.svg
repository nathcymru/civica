<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a thermostat card</title>
  <desc id="description">A thermostat card from top to bottom. 1 marks the name with a round information button at the top right. 2 marks a circular dial with an arc for the target temperature. 3 marks two labelled values side by side, the target and the current temperature. 4 marks the minus and plus buttons. 5 marks a row of optional card features at the foot. The drawing is a schematic, every shape is non-interactive and no real device state is shown.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
