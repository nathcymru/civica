  <rect x="224" y="356" width="130" height="40" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/><rect x="366" y="356" width="130" height="40" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/>
