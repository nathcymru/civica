<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a map card</title>
  <desc id="description">A map card from the top. 1, an optional title. 2, the map, with a zoom control at the edge, round markers and a ringed circle for a zone. 3, two buttons below the map. 4, an overview in a panel view, with three tabs and a line of content. The drawing is a schematic and every shape is non-interactive.</desc>
