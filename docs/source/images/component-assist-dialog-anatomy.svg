<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of the Assist dialog</title>
  <desc id="description">A narrow dialog. From the top: 1, a header with a close button, a title and a menu button; 2, a message from the person, set to the right; 3, a reply from Assist, set to the left; 4, a text field at the foot; 5, a send button beside the field. The drawing is a schematic, every shape is non-interactive and no real device state is shown.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
  <rect width="960" height="560" fill="#F3F6F9"/>
  <g transform="translate(180 0)">
    <rect x="120" y="32" width="320" height="496" fill="#FFFFFF"/>
    <!-- 1: header -->
    <rect x="136" y="48" width="28" height="28" fill="#103E65"/>
    <rect x="184" y="54" width="120" height="16" fill="#103E65"/>
    <rect x="396" y="48" width="28" height="28" fill="#1D70B8"/>
    <rect x="120" y="92" width="320" height="4" fill="#BFD9ED"/>
    <!-- 2: person message -->
    <rect x="252" y="124" width="170" height="44" fill="#1D70B8"/>
    <rect x="268" y="141" width="138" height="10" fill="#FFFFFF"/>
    <!-- 3: Assist reply -->
    <rect x="138" y="190" width="200" height="72" fill="#BFD9ED"/>
    <rect x="154" y="206" width="168" height="10" fill="#FFFFFF"/>
    <rect x="154" y="228" width="120" height="10" fill="#FFFFFF"/>
    <!-- 4 and 5: input -->
    <rect x="120" y="436" width="320" height="4" fill="#BFD9ED"/>
    <rect x="136" y="456" width="216" height="48" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/>
    <rect x="364" y="456" width="60" height="48" fill="#1D70B8"/>
    <rect x="120" y="32" width="320" height="496" fill="none" stroke="#0B0C0C" stroke-width="4"/>
    <path d="M440 62H596" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="620" cy="62" r="26" fill="#103E65"/><text x="620" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">1</text>
    <path d="M422 146H596" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="620" cy="146" r="26" fill="#103E65"/><text x="620" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">2</text>
    <path d="M338 226H596" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="620" cy="226" r="26" fill="#103E65"/><text x="620" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">3</text>
    <path d="M424 480H596" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="620" cy="480" r="26" fill="#103E65"/><text x="620" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">5</text>
    <path d="M136 480H44" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="20" cy="480" r="26" fill="#103E65"/><text x="20" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">4</text>
  </g>
</svg>
