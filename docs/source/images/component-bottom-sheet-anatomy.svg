<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a bottom sheet</title>
  <desc id="description">A narrow screen with a bottom sheet open over a dimmed dashboard. From the top of the sheet downwards: 1, a short handle bar; 2, a header with a title; 3, the body with lines of content; 4, a footer with two buttons at the end of the row, Close first and the main action last. 5 marks the scrim, the dimmed page behind the sheet. The drawing is a schematic, every shape is non-interactive and no real device state is shown.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
  <rect width="960" height="560" fill="#F3F6F9"/>
  <g transform="translate(180 0)">
    <rect x="120" y="32" width="320" height="496" fill="#FFFFFF"/>
    <!-- 5: scrim over the page -->
    <rect x="120" y="32" width="320" height="200" fill="#103E65"/>
    <rect x="144" y="56" width="128" height="56" fill="#1D70B8"/>
    <rect x="288" y="56" width="128" height="56" fill="#1D70B8"/>
    <rect x="144" y="128" width="272" height="56" fill="#1D70B8"/>
    <!-- 1: handle -->
    <rect x="250" y="246" width="60" height="8" fill="#1D70B8"/>
    <!-- 2: header -->
    <rect x="152" y="276" width="180" height="20" fill="#103E65"/>
    <rect x="120" y="312" width="320" height="4" fill="#BFD9ED"/>
    <!-- 3: body -->
    <rect x="152" y="336" width="256" height="14" fill="#BFD9ED"/>
    <rect x="152" y="366" width="256" height="14" fill="#BFD9ED"/>
    <rect x="152" y="396" width="176" height="14" fill="#BFD9ED"/>
    <!-- 4: footer, aligned to the end -->
    <rect x="120" y="436" width="320" height="4" fill="#BFD9ED"/>
    <rect x="198" y="462" width="100" height="44" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/>
    <rect x="312" y="462" width="100" height="44" fill="#1D70B8"/>
    <rect x="120" y="32" width="320" height="496" fill="none" stroke="#0B0C0C" stroke-width="4"/>
    <path d="M310 250H596" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="620" cy="250" r="26" fill="#103E65"/><text x="620" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">1</text>
    <path d="M332 286H596" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="620" cy="286" r="26" fill="#103E65"/><text x="620" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">2</text>
    <path d="M408 373H596" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="620" cy="373" r="26" fill="#103E65"/><text x="620" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">3</text>
    <path d="M424 484H596" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="620" cy="484" r="26" fill="#103E65"/><text x="620" y="497" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">4</text>
    <path d="M416 132H596" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="620" cy="132" r="26" fill="#103E65"/><text x="620" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">5</text>
  </g>
</svg>
