<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a tooltip</title>
  <desc id="description">A button with a tooltip open above it. 1 marks the box of text. 2 marks the small arrow that points from the box to the button. 3 marks the button the tooltip is attached to, called the anchor. Faint lines of page content sit above and below. The drawing is a schematic, every shape is non-interactive and no real device state is shown.</desc>
