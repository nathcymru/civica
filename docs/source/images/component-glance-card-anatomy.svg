<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a glance card</title>
  <desc id="description">A card with a title and three equal cells. In the last cell, numbered from the top: 2, the name; 3, the icon; 4, the state. 1 marks the card title. 5 marks the first cell, drawn with a dashed outline, which shows a warning in place of a state because its entity cannot be found. The drawing is a schematic and every shape is non-interactive.</desc>
