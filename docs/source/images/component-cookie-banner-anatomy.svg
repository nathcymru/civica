<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a cookie notice</title>
  <desc id="description">A page with a notice across the top. Numbered from the top: 1, the heading of the notice; 2, the short statement of what is stored; 3, the link to the full cookies page; 4, the two buttons, accept first and reject second; 5, the main content of the page below, where focus moves after a choice. The drawing is a schematic and every shape is non-interactive.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
