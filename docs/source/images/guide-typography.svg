<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="guide-typography-title guide-typography-description">
  <title id="guide-typography-title">Typography: one typeface at clear sizes</title>
  <desc id="guide-typography-description">A large capital A and a small a in three tones, above a reading and its unit, show one typeface used at different sizes.</desc>
  <rect x="0" y="0" width="640" height="480" fill="#F3F6F9" />
  <text x="60" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="320" fill="#103E65">A</text>
  <text x="330" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="220" fill="#1D70B8">a</text>
  <rect x="330" y="370" width="230" height="22" fill="#8EB8DC" />
  <rect x="330" y="410" width="150" height="15" fill="#103E65" />
</svg>
