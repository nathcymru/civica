<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a more-info dialog</title>
  <desc id="description">A dialog with a header and a scrolling content area. 1, the header, with a close button at the start, the entity name and its area, and two small buttons at the end. 2, the state and control, shown first in the content area. 3, the lower part of the content area, with lines for history and the logbook. The drawing is a schematic and every shape is non-interactive.</desc>
