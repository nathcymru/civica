<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a dialog</title>
  <desc id="description">A dialog open over a dimmed page. Numbered from the top: 1, the dimmed backdrop behind the dialog; 2, the close button at the top corner; 3, the title; 4, the subtitle under the title; 5, the content, which is lines of text; 6, the footer with a secondary button first and the main button last. The drawing is a schematic and every shape is non-interactive.</desc>
