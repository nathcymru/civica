<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of an area card</title>
  <desc id="description">Two area cards side by side. The larger card shows, from the top: 1, a picture; 2, alert icons on the picture; 3, a tile with a round icon, the area name and a line of readings; 4, a row of card features. The smaller compact card has no picture, and 5 marks a single alert badge on its tile icon. The drawing is a schematic, every shape is non-interactive and no real device state is shown.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
  <rect width="960" height="560" fill="#F3F6F9"/>
  <rect x="100" y="40" width="320" height="480" fill="#FFFFFF"/>
  <!-- 1: picture -->
  <rect x="100" y="40" width="320" height="200" fill="#BFD9ED"/>
  <path d="M100 240L200 150L260 200L330 120L420 240Z" fill="#1D70B8"/>
  <!-- 2: alert icons -->
  <rect x="116" y="56" width="36" height="36" fill="#103E65"/>
  <rect x="162" y="56" width="36" height="36" fill="#103E65"/>
  <!-- 3: tile -->
  <circle cx="144" cy="310" r="26" fill="#103E65"/>
  <rect x="188" y="292" width="160" height="18" fill="#103E65"/>
  <rect x="188" y="322" width="200" height="12" fill="#BFD9ED"/>
  <!-- 4: features -->
  <rect x="100" y="380" width="320" height="4" fill="#BFD9ED"/>
  <rect x="116" y="408" width="140" height="44" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/>
  <rect x="268" y="408" width="136" height="44" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/>
  <rect x="100" y="40" width="320" height="480" fill="none" stroke="#0B0C0C" stroke-width="4"/>
  <!-- compact card -->
  <rect x="540" y="200" width="320" height="120" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/>
  <circle cx="584" cy="260" r="26" fill="#103E65"/>
  <rect x="602" y="228" width="24" height="24" fill="#1D70B8"/>
  <rect x="628" y="240" width="160" height="18" fill="#103E65"/>
  <rect x="628" y="270" width="200" height="12" fill="#BFD9ED"/>
    <path d="M420 140H444" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="470" cy="140" r="26" fill="#103E65"/><text x="470" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">1</text>
    <path d="M198 74H444" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="470" cy="74" r="26" fill="#103E65"/><text x="470" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">2</text>
    <path d="M388 312H444" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="470" cy="312" r="26" fill="#103E65"/><text x="470" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">3</text>
    <path d="M420 430H444" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="470" cy="430" r="26" fill="#103E65"/><text x="470" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">4</text>
    <path d="M614 146V228" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="614" cy="120" r="26" fill="#103E65"/><text x="614" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">5</text>
</svg>
