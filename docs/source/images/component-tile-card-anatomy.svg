<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a tile card</title>
  <desc id="description">A tile card drawn as a wide panel. 1, on the left, marks a round icon in the state colour with a small badge at its top right corner. 2, above, marks the information: the name on the first line and the state on the second. 3, on the left of the lower band, marks the optional card features, a row of three controls below the information. The drawing is a schematic, every shape is non-interactive and no real device state is shown.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
  <rect width="960" height="560" fill="#F3F6F9"/>
  <rect x="200" y="140" width="560" height="280" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/><circle cx="280" cy="210" r="44" fill="#1D70B8"/><circle cx="316" cy="174" r="14" fill="#103E65" stroke="#FFFFFF" stroke-width="3"/><rect x="350" y="192" width="220" height="20" fill="#103E65"/><rect x="350" y="228" width="140" height="14" fill="#BFD9ED"/><rect x="200" y="290" width="560" height="4" fill="#BFD9ED"/><rect x="232" y="314" width="152" height="72" fill="#BFD9ED"/><rect x="404" y="314" width="152" height="72" fill="#BFD9ED"/><rect x="576" y="314" width="152" height="72" fill="#BFD9ED"/><path d="M450 140L450 100" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="450" cy="74" r="26" fill="#103E65"/><text x="450" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">2</text><path d="M130 210L236 210" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="104" cy="210" r="26" fill="#103E65"/><text x="104" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">1</text><path d="M130 350L232 350" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="104" cy="350" r="26" fill="#103E65"/><text x="104" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">3</text>
</svg>
