<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">Three ways to arrange cards</title>
  <desc id="description">Three outlined card areas side by side. A, a grid with two columns and three rows holding six cards numbered 1 to 6 in rows from left to right. B, a horizontal stack with three cards numbered 1 to 3 in one row. C, a vertical stack with three cards numbered 1 to 3 one above another. Each area has a short title bar at the top. The drawing is a schematic and every shape is non-interactive.</desc>
