<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The four view layouts</title>
  <desc id="description">Four screens side by side, each with a row of badges across the top. 1, Sections: three columns of cards, each column a section. 2, Masonry: three columns of cards of different heights. 3, Panel: one card filling the whole view. 4, Sidebar: a wide main column of cards with a narrow sidebar column beside it. The drawing is a schematic, every shape is non-interactive and no real dashboard is shown.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
