<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a QR code</title>
  <desc id="description">A square pattern of dark and light squares inside a plain light margin. 1 marks one small dark square, called a module. 2 marks one of the three larger nested squares in the corners, which help a camera find and orient the code. 3 marks the plain light margin around the pattern, called the quiet area. The drawing is a schematic, it is not a working code and no real data is encoded.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
