<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">A picture with elements placed over it</title>
  <desc id="description">On the left, a picture drawn as a floor plan with a dashed centre cross and three round elements placed on it at chosen points, numbered 1 to 3 by their position on the picture. On the right, a column showing the order a keyboard user reaches the same elements, which follows the order in the configuration and is here 3, then 1, then 2. The drawing is a schematic and every shape is non-interactive.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
  <rect width="960" height="560" fill="#F3F6F9"/>
  <rect x="120" y="40" width="440" height="400" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/>
  <rect x="144" y="64" width="392" height="352" fill="#BFD9ED"/>
  <path d="M144 240H536M300 64V416" fill="none" stroke="#1D70B8" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="180" y="100" width="150" height="110" fill="#FFFFFF"/><rect x="350" y="100" width="150" height="110" fill="#FFFFFF"/><rect x="180" y="260" width="320" height="120" fill="#FFFFFF"/>
  <circle cx="255" cy="155" r="26" fill="#1D70B8" stroke="#0B0C0C" stroke-width="4"/><text x="255" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="425" cy="155" r="26" fill="#1D70B8" stroke="#0B0C0C" stroke-width="4"/><text x="425" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="340" cy="320" r="26" fill="#1D70B8" stroke="#0B0C0C" stroke-width="4"/><text x="340" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">3</text>
  <rect x="640" y="40" width="200" height="400" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/>
  <rect x="660" y="92" width="160" height="16" fill="#BFD9ED"/>
  <circle cx="710" cy="140" r="26" fill="#103E65"/><text x="710" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">3</text>
  <rect x="660" y="202" width="160" height="16" fill="#BFD9ED"/>
  <circle cx="710" cy="250" r="26" fill="#103E65"/><text x="710" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">1</text>
  <rect x="660" y="312" width="160" height="16" fill="#BFD9ED"/>
  <circle cx="710" cy="360" r="26" fill="#103E65"/><text x="710" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">2</text>
  <path d="M560 240H640" fill="none" stroke="#0B0C0C" stroke-width="3"/>
</svg>
