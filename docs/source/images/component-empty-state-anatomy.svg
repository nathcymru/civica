  <title id="title">The parts of an empty state card</title>
  <desc id="description">A single card with its content centred. Numbered from the top: 1, a large icon; 2, the title; 3, the sentence of content; 4, a row of buttons at the foot. The drawing is a schematic and every shape is non-interactive.</desc>
