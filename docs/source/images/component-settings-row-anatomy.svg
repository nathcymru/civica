<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">The parts of a settings row</title>
  <desc id="description">Two drawings of a settings row. At the top, a wide row from left to right: 1 marks a round prefix icon, 2 marks the heading, 3 marks the description under the heading, and 4 marks the control at the far end. Below, the same row on a narrow screen: a thin line above, then the prefix and heading, the description, and the control stacked underneath. The drawing is a schematic, every shape is non-interactive and no real device state is shown.</desc>
  <!-- Original Civica explanatory artwork. MIT. Schematic only: not a screenshot or device-state evidence. -->
  <rect width="960" height="560" fill="#F3F6F9"/>
  <rect x="60" y="100" width="840" height="110" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/><circle cx="124" cy="155" r="24" fill="#1D70B8"/><rect x="180" y="128" width="220" height="18" fill="#103E65"/><rect x="180" y="164" width="360" height="12" fill="#BFD9ED"/><rect x="780" y="138" width="84" height="36" fill="#1D70B8"/><rect x="830" y="142" width="28" height="28" fill="#FFFFFF"/><path d="M124 100L124 66" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="124" cy="40" r="26" fill="#103E65"/><text x="124" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">1</text><path d="M260 100L260 66" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="260" cy="40" r="26" fill="#103E65"/><text x="260" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">2</text><path d="M822 100L822 66" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="822" cy="40" r="26" fill="#103E65"/><text x="822" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">4</text><path d="M360 176L360 250" fill="none" stroke="#0B0C0C" stroke-width="3"/><circle cx="360" cy="276" r="26" fill="#103E65"/><text x="360" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">3</text><rect x="330" y="330" width="300" height="200" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/><rect x="330" y="330" width="300" height="4" fill="#BFD9ED"/><circle cx="372" cy="376" r="18" fill="#1D70B8"/><rect x="406" y="368" width="150" height="16" fill="#103E65"/><rect x="358" y="412" width="230" height="12" fill="#BFD9ED"/><rect x="358" y="456" width="84" height="36" fill="#1D70B8"/><rect x="408" y="460" width="28" height="28" fill="#FFFFFF"/>
