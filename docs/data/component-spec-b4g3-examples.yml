# data. Component specification examples for Subheader, Summary List, SVG Vector Graphic, Switch / Toggle, Tabs, Tag and Target Picker. No live actions.
examples:
  spec-subheader-picker-groups:
    title: The open list of a picker, with group labels
    description: "A stand-in for the list that opens under a Home Assistant picker. Each group label is a bold line on a tinted band, followed by the items in that group. The labels are plain text, not headings. Nothing here can be chosen."
    height: 520
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-sh-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-sh-title">Choose an entity</h2>
      <div style="border:1px solid #cecece">
      <div id="spec-sh-lights" style="background:#f8f8f8;color:#484949;font-weight:700;min-height:2rem;padding:6px 12px">Lights</div>
      <ul style="margin:0;padding:0;list-style:none" aria-labelledby="spec-sh-lights">
      <li style="padding:8px 12px;margin:0;border-top:1px solid #cecece">Porch light<br><span style="margin:0;color:#484949">Hall</span></li>
      <li style="padding:8px 12px;margin:0;border-top:1px solid #cecece">Living-room lamp<br><span style="margin:0;color:#484949">Living room</span></li>
      </ul>
      <div id="spec-sh-sensors" style="background:#f8f8f8;color:#484949;font-weight:700;min-height:2rem;padding:6px 12px;border-top:1px solid #cecece">Sensors</div>
      <ul style="margin:0;padding:0;list-style:none" aria-labelledby="spec-sh-sensors">
      <li style="padding:8px 12px;margin:0;border-top:1px solid #cecece">Garden temperature<br><span style="margin:0;color:#484949">Garden</span></li>
      </ul>
      </div>
      </div></article>
  spec-summary-list-device:
    title: Read-only details of one device
    description: "A summary list for one device. Each row is a label and its value, and nothing on the card can be changed."
    height: 380
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-sl-device-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-sl-device-title">Living-room lamp</h2>
      <dl style="margin:0">
      <div style="display:flex;flex-wrap:wrap;gap:4px 20px;padding:10px 0;border-bottom:1px solid #cecece">
      <dt style="flex:0 1 10rem;min-width:0;font-weight:700;margin:0">Name</dt>
      <dd style="flex:1 1 10rem;min-width:0;margin:0">Living-room lamp</dd>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px 20px;padding:10px 0;border-bottom:1px solid #cecece">
      <dt style="flex:0 1 10rem;min-width:0;font-weight:700;margin:0">Room</dt>
      <dd style="flex:1 1 10rem;min-width:0;margin:0">Living room</dd>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px 20px;padding:10px 0;border-bottom:1px solid #cecece">
      <dt style="flex:0 1 10rem;min-width:0;font-weight:700;margin:0">Connection</dt>
      <dd style="flex:1 1 10rem;min-width:0;margin:0">Available</dd>
      </div>
      </dl>
      </div></article>
  spec-summary-list-change:
    title: A summary row with a Change link
    description: "A summary list with one row and a Change link whose purpose is clear in context, followed by the field that the link leads to. Nothing is saved."
    height: 480
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-sl-change-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-sl-change-title">Dashboard settings</h2>
      <dl style="margin:0">
      <div style="display:flex;flex-wrap:wrap;gap:4px 20px;padding:10px 0;border-bottom:1px solid #cecece">
      <dt style="flex:0 1 10rem;min-width:0;font-weight:700;margin:0">Dashboard name</dt>
      <dd style="flex:1 1 10rem;min-width:0;margin:0">Shared rooms</dd>
      <dd style="flex:0 0 auto;margin:0">
      <a href="#spec-sl-change-name" style="color:#1d70b8">Change<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"> dashboard name</span></a>
      </dd>
      </div>
      </dl>
      <form data-demo-form style="margin-top:20px">
      <div>
      <label for="spec-sl-change-name" style="display:block;margin:0 0 5px;font-weight:700">Dashboard name</label>
      <input id="spec-sl-change-name" name="spec-sl-change-name" type="text" value="Shared rooms" style="box-sizing:border-box;width:100%;max-width:20rem;min-height:44px;padding:5px 8px;border:2px solid #0b0c0c;font:inherit">
      </div>
      </form>
      </div></article>
  spec-svg-sensor-diagram:
    title: A diagram of two sensors
    description: "A card holding one inline SVG diagram of a house and garden with two sensors marked on it. The diagram has a title and a description for assistive technology, and the text beside it says the same thing in words. It is a drawing, not live data."
    height: 640
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-svg-card-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-svg-card-title">Where the sensors are</h2>
      <svg role="img" aria-labelledby="spec-svg-t spec-svg-d" viewBox="0 0 320 200" width="100%" style="max-width:480px;height:auto;display:block">
      <title id="spec-svg-t">Position of the two sensors</title>
      <desc id="spec-svg-d">A house with a garden below it. The hall sensor is inside the house, on the left. The garden sensor is on the lawn, on the right. A cable joins them.</desc>
      <defs>
      <linearGradient id="spec-svg-lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF4EF"/><stop offset="1" stop-color="#BCDACF"/></linearGradient>
      <radialGradient id="spec-svg-glow"><stop offset="0" stop-color="#1D70B8" stop-opacity="0.35"/><stop offset="1" stop-color="#1D70B8" stop-opacity="0"/></radialGradient>
      <clipPath id="spec-svg-clip"><rect x="10" y="140" width="300" height="50"/></clipPath>
      <symbol id="spec-svg-sensor" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="2"/><circle cx="12" cy="16.5" r="2" fill="#0B0C0C"/><path d="M7 7a7 7 0 0 1 10 0M9.5 9.2a3.6 3.6 0 0 1 5 0" fill="none" stroke="#0B0C0C" stroke-width="1.6" stroke-linecap="round"/></symbol>
      </defs>
      <rect x="0" y="0" width="320" height="200" fill="#FFFFFF"/>
      <g clip-path="url(#spec-svg-clip)"><ellipse cx="160" cy="180" rx="200" ry="60" fill="url(#spec-svg-lawn)"/></g>
      <g stroke="#0B0C0C" stroke-width="2">
      <rect x="40" y="70" width="140" height="70" fill="#F3F2F1"/>
      <polygon points="30,70 110,25 190,70" fill="#CECECE"/>
      <line x1="150" y1="140" x2="150" y2="100"/>
      </g>
      <polyline points="75,122 75,155 230,155" fill="none" stroke="#1D70B8" stroke-width="2" stroke-dasharray="6 4"/>
      <circle cx="230" cy="155" r="24" fill="url(#spec-svg-glow)"/>
      <use href="#spec-svg-sensor" x="63" y="98" width="24" height="24"/>
      <use href="#spec-svg-sensor" x="218" y="143" width="24" height="24"/>
      <text x="75" y="92" font-size="12" text-anchor="middle" fill="#0B0C0C"><tspan x="75" dy="0">Hall sensor</tspan></text>
      <text x="260" y="160" font-size="12" fill="#0B0C0C"><tspan x="256" dy="0">Garden</tspan><tspan x="256" dy="14">sensor</tspan></text>
      </svg>
      <p style="margin:0 0 15px">The hall sensor is inside the house. The garden sensor is on the lawn, joined to the hall sensor by a cable.</p>
      </div></article>
  spec-switch-toggle-rows:
    title: An Entities card with three toggle rows
    description: "A stand-in for an Entities card with three toggle rows. The first is on, the second is off and the third is unavailable, so its switch is dimmed. The state is also written in words under each name, so it does not rely on the position of the switch alone. The switches do nothing."
    height: 420
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-sw-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-sw-title">Hall and garden</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #cecece"><span id="spec-sw-porch"><strong>Porch light</strong><br><span style="margin:0;color:#484949">On</span></span><button type="button" role="switch" aria-checked="true" aria-labelledby="spec-sw-porch" style="width:38px;height:20px;border:2px solid #1d70b8;background:#1d70b8;border-radius:10px;padding:0;position:relative;cursor:pointer"><span style="position:absolute;top:2px;left:20px;width:14px;height:14px;border-radius:50%;background:#fff"></span></button></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #cecece"><span id="spec-sw-lamp"><strong>Hall lamp</strong><br><span style="margin:0;color:#484949">Off</span></span><button type="button" role="switch" aria-checked="false" aria-labelledby="spec-sw-lamp" style="width:38px;height:20px;border:2px solid #0b0c0c;background:#fff;border-radius:10px;padding:0;position:relative;cursor:pointer"><span style="position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#0b0c0c"></span></button></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #cecece;border-bottom:1px solid #cecece"><span id="spec-sw-pump"><strong>Garden pump</strong><br><span style="margin:0;color:#484949">Unavailable</span></span><button type="button" role="switch" aria-checked="false" aria-labelledby="spec-sw-pump" disabled style="width:38px;height:20px;border:2px solid #0b0c0c;background:#fff;border-radius:10px;padding:0;position:relative;opacity:0.35;cursor:not-allowed"><span style="position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#0b0c0c"></span></button></div>
      </div></article>
  spec-tabs-device:
    title: A device section with Details and History tabs
    description: "A static picture of a section with two tabs. Details is the current tab, marked in bold with a border, and its panel shows the lamp’s state. History is the other tab. Nothing switches in this example. A Home Assistant card cannot hold tabs, and its own tab bar switches dashboard views instead."
    height: 420
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-tabs-device-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-tabs-device-title">Living-room lamp</h2>
      <nav aria-label="Device sections">
      <ul style="display:flex;flex-wrap:wrap;gap:0 4px;list-style:none;margin:0;padding:0;border-bottom:1px solid #cecece">
      <li style="margin:0 0 -1px;padding:10px 16px;font-weight:700;border:1px solid #cecece;border-bottom:1px solid #fff;background:#fff" aria-current="true">Details</li>
      <li style="margin:0;padding:10px 16px;color:#1d70b8;text-decoration:underline">History</li>
      </ul>
      </nav>
      <div style="padding:20px;border:1px solid #cecece;border-top:0">
      <h3 style="margin:0 0 10px;font-size:1.1875rem;font-weight:700">Details</h3>
      <p style="margin:0">Living-room lamp, in the living room. It is available and switched on.</p>
      </div>
      </div></article>
  spec-tabs-empty:
    title: A History tab with nothing to show
    description: "A static picture of a section with two tabs. History is the current tab. It is still there when it has no values, and its panel says why it is empty. Nothing switches in this example."
    height: 420
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-tabs-empty-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-tabs-empty-title">Garden sensor</h2>
      <nav aria-label="Sensor sections">
      <ul style="display:flex;flex-wrap:wrap;gap:0 4px;list-style:none;margin:0;padding:0;border-bottom:1px solid #cecece">
      <li style="margin:0;padding:10px 16px;color:#1d70b8;text-decoration:underline">Overview</li>
      <li style="margin:0 0 -1px;padding:10px 16px;font-weight:700;border:1px solid #cecece;border-bottom:1px solid #fff;background:#fff" aria-current="true">History</li>
      </ul>
      </nav>
      <div style="padding:20px;border:1px solid #cecece;border-top:0">
      <h3 style="margin:0 0 10px;font-size:1.1875rem;font-weight:700">History</h3>
      <p style="margin:0">No history is available for the selected period. The sensor has only just been added.</p>
      </div>
      </div></article>
  spec-tag-connection:
    title: Connection tags beside two devices
    description: "A card listing two devices, each followed by a tag that says in words whether it is available. The tags are text, not buttons."
    height: 360
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-tag-conn-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-tag-conn-title">Device connections</h2>
      <ul style="margin:0;padding:0;list-style:none">
      <li style="margin:0 0 10px">Living-room lamp: <strong style="display:inline-block;padding:2px 8px;font-size:1rem;font-weight:700;line-height:1.25;text-transform:uppercase;color:#005a30;background:#cce2d8">Available</strong></li>
      <li style="margin:0 0 10px">Garden sensor: <strong style="display:inline-block;padding:2px 8px;font-size:1rem;font-weight:700;line-height:1.25;text-transform:uppercase;color:#282d30;background:#e5e6e7">Unavailable</strong></li>
      </ul>
      </div></article>
  spec-tag-task:
    title: Progress tags beside two setup tasks
    description: "A card listing two setup tasks, each followed by a tag for its progress. A tag describes the task and cannot be pressed."
    height: 360
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-tag-task-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-tag-task-title">Dashboard setup</h2>
      <ul style="margin:0;padding:0;list-style:none">
      <li style="margin:0 0 10px">Choose rooms: <strong style="display:inline-block;padding:2px 8px;font-size:1rem;font-weight:700;line-height:1.25;text-transform:uppercase;color:#1d70b8;background:#e8f1f8">Completed</strong></li>
      <li style="margin:0 0 10px">Check dashboard: <strong style="display:inline-block;padding:2px 8px;font-size:1rem;font-weight:700;line-height:1.25;text-transform:uppercase;color:#144e81;background:#d2e2f1">In progress</strong></li>
      </ul>
      </div></article>
  spec-target-picker-chosen:
    title: A form with a target picker holding three chosen items
    description: "A stand-in for the closed target picker in a form. It shows the kitchen area, a saved entity that can no longer be found, and one exclusion, with the Add target and Exclude target buttons below. Home Assistant draws its own rows, so the look differs. Each Remove button here names its target. Nothing can be changed."
    height: 900
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-tp-title"><div class="civica-card-demo__body">
      <h2 style="margin:0 0 15px;font-size:1.5rem;line-height:1.25;font-weight:700" id="spec-tp-title">Switch off at bedtime</h2>
      <div><span id="spec-tp-label" style="display:block;margin:0 0 5px;font-weight:700">What should the automation switch off?</span><div id="spec-tp-hint" style="margin:0 0 15px;color:#484949">Everything chosen here switches off at 22:30, except the exclusions.</div>
      <div role="group" aria-labelledby="spec-tp-label" aria-describedby="spec-tp-hint" style="border:1px solid #cecece">
      <div id="spec-tp-areas" style="background:#fff;color:#484949;font-weight:700;padding:6px 12px">Areas</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:8px 12px;border-top:1px solid #cecece"><span style="flex:1 1 9rem;min-width:9rem">Kitchen<br><span style="margin:0;color:#484949">4 entities</span></span><button type="button" style="flex:none;margin:0;min-height:44px;padding:6px 12px;border:2px solid #0b0c0c;background:#fff;color:#0b0c0c;font:inherit;cursor:pointer" aria-label="Remove Kitchen">Remove</button></div>
      <div id="spec-tp-entities" style="background:#fff;color:#484949;font-weight:700;padding:6px 12px;border-top:1px solid #cecece">Entities</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:8px 12px;border-top:1px solid #cecece"><span style="flex:1 1 9rem;min-width:9rem">Spare lamp<br><span style="margin:0;color:#484949">Entity not found</span></span><button type="button" style="flex:none;margin:0;min-height:44px;padding:6px 12px;border:2px solid #0b0c0c;background:#fff;color:#0b0c0c;font:inherit;cursor:pointer" aria-label="Remove Spare lamp">Remove</button></div>
      <div id="spec-tp-excl" style="background:#fff;color:#484949;font-weight:700;padding:6px 12px;border-top:1px solid #cecece">Exclusions</div>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:8px 12px;border-top:1px solid #cecece"><span style="flex:1 1 9rem;min-width:9rem">Extractor fan<br><span style="margin:0;color:#484949">Excluded</span></span><button type="button" style="flex:none;margin:0;min-height:44px;padding:6px 12px;border:2px solid #0b0c0c;background:#fff;color:#0b0c0c;font:inherit;cursor:pointer" aria-label="Remove exclusion for Extractor fan">Remove exclusion</button></div>
      </div></div>
      <p class="civica-card-demo__actions"><button type="button" style="margin:0;min-height:44px;padding:6px 12px;border:2px solid #0b0c0c;background:#fff;color:#0b0c0c;font:inherit;cursor:pointer">Add target</button><button type="button" style="margin:0;min-height:44px;padding:6px 12px;border:2px solid #0b0c0c;background:#fff;color:#0b0c0c;font:inherit;cursor:pointer">Exclude target</button></p>
      </div></article>
