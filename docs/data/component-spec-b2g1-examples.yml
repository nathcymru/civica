# data. Simulated cards, tables and dialogs; no live actions.
examples:
  spec-table-readings:
    title: Compare room temperatures
    description: "A card holding a real table. The caption says what the table shows, when it was read and where, and the unit is in the column heading, so every cell is only a number."
    height: 360
    html: |
      <article class="civica-card-demo" aria-label="Room temperatures"><div class="civica-card-demo__body">
      <table class="govuk-table">
      <caption class="govuk-table__caption govuk-table__caption--m">Example room temperatures reported on 11 November 2026 at 09:00 GMT (Europe/London)</caption>
      <thead class="govuk-table__head">
      <tr class="govuk-table__row">
      <th scope="col" class="govuk-table__header">Room</th>
      <th scope="col" class="govuk-table__header govuk-table__header--numeric">Temperature (°C)</th>
      </tr>
      </thead>
      <tbody class="govuk-table__body">
      <tr class="govuk-table__row">
      <th scope="row" class="govuk-table__header">Kitchen</th>
      <td class="govuk-table__cell govuk-table__cell--numeric">19.8</td>
      </tr>
      <tr class="govuk-table__row">
      <th scope="row" class="govuk-table__header">Living room</th>
      <td class="govuk-table__cell govuk-table__cell--numeric">20.5</td>
      </tr>
      <tr class="govuk-table__row">
      <th scope="row" class="govuk-table__header">Bedroom</th>
      <td class="govuk-table__cell govuk-table__cell--numeric">18.2</td>
      </tr>
      </tbody>
      </table>
      </div></article>
  spec-table-missing:
    title: Distinguish zero from missing data
    description: "A card holding an hourly electricity table. The 09:00 row records zero. The 10:00 row says Not available because no reading arrived, and a sentence under the table explains that it is not zero."
    height: 420
    html: |
      <article class="civica-card-demo" aria-label="Hourly electricity"><div class="civica-card-demo__body">
      <table class="govuk-table">
      <caption class="govuk-table__caption govuk-table__caption--m">Example hourly electricity on 11 November 2026, Europe/London (GMT)</caption>
      <thead class="govuk-table__head">
      <tr class="govuk-table__row">
      <th scope="col" class="govuk-table__header">Period start (GMT)</th>
      <th scope="col" class="govuk-table__header govuk-table__header--numeric">Energy (kWh)</th>
      </tr>
      </thead>
      <tbody class="govuk-table__body">
      <tr class="govuk-table__row">
      <th scope="row" class="govuk-table__header">09:00</th>
      <td class="govuk-table__cell govuk-table__cell--numeric">0.00</td>
      </tr>
      <tr class="govuk-table__row">
      <th scope="row" class="govuk-table__header">10:00</th>
      <td class="govuk-table__cell govuk-table__cell--numeric">Not available</td>
      </tr>
      <tr class="govuk-table__row">
      <th scope="row" class="govuk-table__header">11:00</th>
      <td class="govuk-table__cell govuk-table__cell--numeric">0.42</td>
      </tr>
      </tbody>
      </table>
      <p class="govuk-body">Each row starts a one-hour interval. The 10:00 interval has no reading; it is not zero, so these rows do not form a complete total.</p>
      </div></article>
  spec-table-scroll:
    title: A wide comparison
    description: "A card holding a table with four day columns. The table sits in a labelled region that scrolls sideways when the card is narrow, so no column is hidden."
    height: 380
    html: |
      <article class="civica-card-demo" aria-label="Weekly room temperatures"><div class="civica-card-demo__body">
      <div class="civica-table-scroll" role="region" aria-label="Weekly room-temperature comparison" tabindex="0">
      <table class="govuk-table">
      <caption class="govuk-table__caption govuk-table__caption--m">Example room temperatures at 09:00 GMT (Europe/London), 9 to 12 November 2026</caption>
      <thead class="govuk-table__head">
      <tr class="govuk-table__row">
      <th scope="col" class="govuk-table__header">Room</th>
      <th scope="col" class="govuk-table__header govuk-table__header--numeric">Monday 9 November (°C)</th>
      <th scope="col" class="govuk-table__header govuk-table__header--numeric">Tuesday 10 November (°C)</th>
      <th scope="col" class="govuk-table__header govuk-table__header--numeric">Wednesday 11 November (°C)</th>
      <th scope="col" class="govuk-table__header govuk-table__header--numeric">Thursday 12 November (°C)</th>
      </tr>
      </thead>
      <tbody class="govuk-table__body">
      <tr class="govuk-table__row">
      <th scope="row" class="govuk-table__header">Kitchen</th>
      <td class="govuk-table__cell govuk-table__cell--numeric">19.2</td>
      <td class="govuk-table__cell govuk-table__cell--numeric">19.7</td>
      <td class="govuk-table__cell govuk-table__cell--numeric">19.4</td>
      <td class="govuk-table__cell govuk-table__cell--numeric">19.5</td>
      </tr>
      <tr class="govuk-table__row">
      <th scope="row" class="govuk-table__header">Living room</th>
      <td class="govuk-table__cell govuk-table__cell--numeric">20.1</td>
      <td class="govuk-table__cell govuk-table__cell--numeric">20.3</td>
      <td class="govuk-table__cell govuk-table__cell--numeric">20.0</td>
      <td class="govuk-table__cell govuk-table__cell--numeric">20.2</td>
      </tr>
      </tbody>
      </table>
      </div>
      </div></article>
  spec-date-maintenance:
    title: Record a known maintenance date
    description: "A form card that asks when a filter was replaced. The question is the group label, the format is shown as a hint, and the date is typed into three labelled fields because the person already knows it. Nothing is saved."
    height: 460
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-date-m-title"><div class="civica-card-demo__body">
      <h2 class="govuk-heading-m" id="spec-date-m-title">Water filter</h2>
      <div class="govuk-form-group">
      <fieldset class="govuk-fieldset" aria-describedby="spec-date-m-hint">
      <legend class="govuk-fieldset__legend govuk-fieldset__legend--s">When was the filter replaced?</legend>
      <div class="govuk-hint" id="spec-date-m-hint">For example, 11 11 2026</div>
      <div class="govuk-date-input">
      <div class="govuk-date-input__item"><div class="govuk-form-group"><label class="govuk-label govuk-date-input__label" for="spec-date-m-day">Day</label><input class="govuk-input govuk-date-input__input govuk-input--width-2" id="spec-date-m-day" type="text" inputmode="numeric" value="11"></div></div>
      <div class="govuk-date-input__item"><div class="govuk-form-group"><label class="govuk-label govuk-date-input__label" for="spec-date-m-month">Month</label><input class="govuk-input govuk-date-input__input govuk-input--width-2" id="spec-date-m-month" type="text" inputmode="numeric" value="11"></div></div>
      <div class="govuk-date-input__item"><div class="govuk-form-group"><label class="govuk-label govuk-date-input__label" for="spec-date-m-year">Year</label><input class="govuk-input govuk-date-input__input govuk-input--width-4" id="spec-date-m-year" type="text" inputmode="numeric" value="2026"></div></div>
      </div>
      </fieldset>
      </div>
      <p class="civica-card-demo__actions"><button type="button" class="govuk-button">Save date</button></p>
      </div></article>
  spec-date-error:
    title: Correct one part of a date
    description: "A form card after a failed save. The message says the month must be between 1 and 12, only the month box is marked, and the day and year the person typed are still there."
    height: 520
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-date-e-title"><div class="civica-card-demo__body">
      <h2 class="govuk-heading-m" id="spec-date-e-title">New thermostat</h2>
      <div class="govuk-form-group govuk-form-group--error">
      <fieldset class="govuk-fieldset" aria-describedby="spec-date-e-hint spec-date-e-error">
      <legend class="govuk-fieldset__legend govuk-fieldset__legend--s">When was the device installed?</legend>
      <div class="govuk-hint" id="spec-date-e-hint">For example, 11 11 2026</div>
      <p class="govuk-error-message" id="spec-date-e-error"><span class="govuk-visually-hidden">Error:</span> Month must be between 1 and 12</p>
      <div class="govuk-date-input">
      <div class="govuk-date-input__item"><div class="govuk-form-group"><label class="govuk-label govuk-date-input__label" for="spec-date-e-day">Day</label><input class="govuk-input govuk-date-input__input govuk-input--width-2" id="spec-date-e-day" type="text" inputmode="numeric" value="11"></div></div>
      <div class="govuk-date-input__item"><div class="govuk-form-group"><label class="govuk-label govuk-date-input__label" for="spec-date-e-month">Month</label><input class="govuk-input govuk-date-input__input govuk-input--width-2 govuk-input--error" id="spec-date-e-month" type="text" inputmode="numeric" value="13" aria-invalid="true"></div></div>
      <div class="govuk-date-input__item"><div class="govuk-form-group"><label class="govuk-label govuk-date-input__label" for="spec-date-e-year">Year</label><input class="govuk-input govuk-date-input__input govuk-input--width-4" id="spec-date-e-year" type="text" inputmode="numeric" value="2026"></div></div>
      </div>
      </fieldset>
      </div>
      <p class="civica-card-demo__actions"><button type="button" class="govuk-button">Save date</button></p>
      </div></article>
  spec-description-list-device:
    title: Facts about one device
    description: "A card with a description list: each term names a fact about the kitchen light and its description gives the value, with the unit and the time of the reading. Home Assistant has no card like this, so the card is a stand-in. Nothing here is live."
    height: 440
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-dl-title"><div class="civica-card-demo__body">
      <h2 class="govuk-heading-m" id="spec-dl-title">Kitchen light</h2>
      <dl class="govuk-summary-list">
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Area</dt><dd class="govuk-summary-list__value">Kitchen</dd></div>
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">State</dt><dd class="govuk-summary-list__value">On</dd></div>
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Brightness</dt><dd class="govuk-summary-list__value">80%</dd></div>
      <div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Last reported</dt><dd class="govuk-summary-list__value"><time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time></dd></div>
      </dl>
      </div></article>
  spec-device-picker-automation:
    title: A form that asks which device an automation uses
    description: "A stand-in for the closed device picker: the label asks in terms of the task, the helper text says what the choice changes, and the chosen device shows its area beneath its name. Home Assistant draws its own field and searchable list, so the look differs. Nothing here can be changed, and the open list is not shown."
    height: 480
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-dp-title"><div class="civica-card-demo__body">
      <h2 class="govuk-heading-m" id="spec-dp-title">Add a sunset automation</h2>
      <div class="govuk-form-group"><span class="govuk-label" id="spec-dp-label">Which device should switch on at sunset?</span><div class="govuk-hint" id="spec-dp-hint">The automation will switch this device on every day at sunset.</div><div role="group" aria-labelledby="spec-dp-label" aria-describedby="spec-dp-hint" style="border-bottom:1px solid #0b0c0c;background:#fff;padding:8px 12px;display:flex;justify-content:space-between"><span><strong>Porch light</strong><br><span class="govuk-hint" style="margin:0">Hall</span></span><span aria-hidden="true">&#9662;</span></div></div>
      <p class="civica-card-demo__actions"><button type="button" class="govuk-button">Save automation</button></p>
      </div></article>
  spec-dialog-confirm-delete:
    title: A confirmation that names its consequence
    description: "A confirmation dialog drawn on a dimmed page. The title names the action, the text says what will be lost, the main button says Delete automation, and Cancel sits beside it. The buttons do nothing, and Home Assistant draws its own dialog."
    height: 380
    html: |
      <div style="background:#505a5f;padding:24px 12px">
      <div class="civica-card-demo" role="group" aria-labelledby="spec-dc-title" aria-describedby="spec-dc-text" style="max-width:420px;margin:0 auto;background:#fff"><div class="civica-card-demo__body">
      <h2 class="govuk-heading-m" id="spec-dc-title">Delete “Evening lights”?</h2>
      <p class="govuk-body" id="spec-dc-text">This automation will be removed and the lights will no longer switch on at sunset. You cannot undo this.</p>
      <p class="civica-card-demo__actions"><button type="button" class="govuk-button govuk-button--secondary">Cancel</button><button type="button" class="govuk-button govuk-button--warning">Delete automation</button></p>
      </div></div>
      </div>
  spec-dialog-device-details:
    title: A dialog for device details
    description: "A stand-in for a device details dialog, drawn on a dimmed page: a title with the device name, the current state and area, and a Close button. Home Assistant’s own More info dialog has more in it. The button does nothing."
    height: 360
    html: |
      <div style="background:#505a5f;padding:24px 12px">
      <div class="civica-card-demo" role="group" aria-labelledby="spec-dd-title" style="max-width:420px;margin:0 auto;background:#fff"><div class="civica-card-demo__body">
      <h2 class="govuk-heading-m" id="spec-dd-title">Kitchen light</h2>
      <p class="govuk-body"><strong>On</strong>, 80% brightness</p>
      <p class="govuk-body">Area: Kitchen</p>
      <p class="civica-card-demo__actions"><button type="button" class="govuk-button govuk-button--secondary">Close</button></p>
      </div></div>
      </div>
  spec-admin-tiles:
    title: Three admin tiles on a maintenance view
    description: "A maintenance view with the three cards in their default look: Devices discovered with 2 devices to add, Repairs with 1 issue, and Updates with 3 updates available. The count is written in words beside each icon. The tiles do nothing here."
    height: 420
    html: |
      <div style="display:grid;gap:12px">
      <article class="civica-card-demo" aria-labelledby="spec-at-d"><div class="civica-card-demo__body" style="display:flex;align-items:center;gap:16px"><svg aria-hidden="true" focusable="false" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#1d70b8"></circle><rect x="11" y="13" width="18" height="12" fill="none" stroke="#fff" stroke-width="2"></rect><path d="M15 29h10" stroke="#fff" stroke-width="2"></path></svg><div><h2 class="govuk-heading-s" id="spec-at-d" style="margin:0">Devices discovered</h2><p class="govuk-body" style="margin:0">2 devices to add</p></div></div></article>
      <article class="civica-card-demo" aria-labelledby="spec-at-r"><div class="civica-card-demo__body" style="display:flex;align-items:center;gap:16px"><svg aria-hidden="true" focusable="false" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#8a6100"></circle><path d="M13 27l10-10m-3-4l6 0 1 6" fill="none" stroke="#fff" stroke-width="2.5"></path></svg><div><h2 class="govuk-heading-s" id="spec-at-r" style="margin:0">Repairs</h2><p class="govuk-body" style="margin:0">1 issue</p></div></div></article>
      <article class="civica-card-demo" aria-labelledby="spec-at-u"><div class="civica-card-demo__body" style="display:flex;align-items:center;gap:16px"><svg aria-hidden="true" focusable="false" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#1d70b8"></circle><path d="M20 28V13m-6 6l6-6 6 6" fill="none" stroke="#fff" stroke-width="2.5"></path></svg><div><h2 class="govuk-heading-s" id="spec-at-u" style="margin:0">Updates</h2><p class="govuk-body" style="margin:0">3 updates available</p></div></div></article>
      </div>
  spec-divider-entities:
    title: An entities card with a divider between groups
    description: "An entities card for the kitchen. A thin line separates the two lights from the two sensors, and every row is labelled in words, so the line is not the only cue. The line is drawn like a divider row. Nothing here is live."
    height: 420
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-dv-title"><div class="civica-card-demo__body">
      <h2 class="govuk-heading-m" id="spec-dv-title">Kitchen</h2>
      <div style="display:flex;justify-content:space-between;padding:8px 0"><span>Ceiling light</span><strong>On</strong></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0"><span>Counter lights</span><strong>Off</strong></div>
      <div aria-hidden="true" style="height:1px;background:#cecece;margin:8px 0"></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0"><span>Temperature</span><strong>19.8°C</strong></div>
      <div style="display:flex;justify-content:space-between;padding:8px 0"><span>Humidity</span><strong>48%</strong></div>
      </div></article>
