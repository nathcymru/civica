# Synthetic data; simulated cards and forms with no live actions.
examples:
  spec-image-glance-living-room:
    title: A picture glance card for the living room, simulated
    description: "A simulated stand-in for a picture glance card: a picture of the room with the name and state of one lamp written below it as text. The real card draws small icon buttons over the picture instead. Nothing here is live."
    height: 440
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-glance-title"><div class="civica-card-demo__body">
      <h2 id="spec-glance-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">Living room</h2>
      <svg role="img" aria-label="Drawing of a living room with a sofa and a lamp beside it." viewBox="0 0 480 220" width="480" height="220" style="display:block;width:100%;height:auto"><rect width="480" height="220" fill="#f3f2f1"></rect><rect x="40" y="110" width="220" height="70" fill="none" stroke="#0b0c0c" stroke-width="4"></rect><rect x="40" y="80" width="220" height="30" fill="none" stroke="#0b0c0c" stroke-width="4"></rect><path d="M340 180V100" stroke="#0b0c0c" stroke-width="4"></path><path d="M315 100h50l-12-34h-26z" fill="#ffc107" stroke="#0b0c0c" stroke-width="4"></path></svg>
      <p style="margin:12px 0 4px"><strong>Lamp</strong>: on</p>
      <p style="margin:0 0 4px"><strong>Ceiling light</strong>: off</p>
      </div></article>
  spec-image-room-diagram:
    title: An informative room diagram
    description: "The text alternative describes the highlighted location; the caption explains the task."
    height: 350
    html: |
      <figure class="civica-image">
      <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20480%20220%22%3E%3Crect%20width%3D%22480%22%20height%3D%22220%22%20fill%3D%22%23f3f2f1%22%2F%3E%3Cpath%20d%3D%22M20%2020H460V200H20ZM240%2020V200M20%20120H240%22%20fill%3D%22none%22%20stroke%3D%22%230b0c0c%22%20stroke-width%3D%224%22%2F%3E%3Ccircle%20cx%3D%22345%22%20cy%3D%22100%22%20r%3D%2218%22%20fill%3D%22%231d70b8%22%2F%3E%3Ctext%20x%3D%2255%22%20y%3D%2270%22%20font-family%3D%22Arial%22%20font-size%3D%2222%22%3EHall%3C%2Ftext%3E%3Ctext%20x%3D%2245%22%20y%3D%22165%22%20font-family%3D%22Arial%22%20font-size%3D%2222%22%3EKitchen%3C%2Ftext%3E%3Ctext%20x%3D%22290%22%20y%3D%22160%22%20font-family%3D%22Arial%22%20font-size%3D%2222%22%3ELiving%20room%3C%2Ftext%3E%3C%2Fsvg%3E" width="480" height="220" alt="Example floor plan: the living room is to the right of the hall and kitchen. A blue dot marks the living-room sensor.">
      <figcaption class="civica-image__caption">Invented schematic, not a surveyed plan. The living room is to the right of the hall and kitchen; its marker identifies the living-room sensor. Use the room name when selecting a real entity.</figcaption>
      </figure>
    artwork:
      creator: Civica project contributors; Claude-assisted original SVG markup
      licence: GPL-3.0-or-later (code), CC BY-SA 4.0 (documentation)
      source: docs/data/component-spec-b3g2-examples.yml#spec-image-room-diagram
      provenance: Original simple geometry retained from the existing documentation example; no official identity paths or third-party artwork imported.
      purpose: Show an invented room relationship and sensor location, not a surveyed floor plan or live map.
      intended_background: "#F3F2F1 embedded schematic canvas on the light documentation surface"
      alternative_text_decision: Informative img alternative describes the relative room positions and sensor marker; caption identifies the selection task.
      review_status: Static source/provenance recorded; rendered verification is tracked separately in the change acceptance.
  spec-image-decorative-mark:
    title: A picture card with a decorative picture
    description: "A simulated picture card for the garden: the picture only decorates the card, so it has an empty alt, and the card beside it gives the garden’s name and state as text. Nothing here is live."
    height: 480
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-decor-title"><div class="civica-card-demo__body">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 480 160" width="480" height="160" style="display:block;width:100%;height:auto;margin:0 0 12px"><rect width="480" height="160" fill="#f3f2f1"></rect><path d="M0 120h480" stroke="#0b0c0c" stroke-width="4"></path><circle cx="90" cy="60" r="26" fill="#ffc107" stroke="#0b0c0c" stroke-width="3"></circle><path d="M300 120V70M300 90l-24-20M300 80l24-22" fill="none" stroke="#0b0c0c" stroke-width="4"></path></svg>
      <h2 id="spec-decor-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">Garden</h2>
      <p style="margin:0 0 4px"><strong>Gate</strong>: closed</p>
      <p style="margin:0">Soil moisture: 38%, reported at 18:42.</p>
      </div></article>
  spec-image-entity-front-door:
    title: A picture entity card for the front door, simulated
    description: "A simulated picture entity card: a picture of the front door with the name and state in a bar along its bottom edge, and the same name and state written as text below it, because the bar sits over a picture whose contrast cannot be known. The real card draws the bar itself. Nothing here is live."
    height: 460
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-entity-title"><div class="civica-card-demo__body">
      <div style="position:relative">
      <svg role="img" aria-label="Drawing of a front door with a round handle." viewBox="0 0 480 200" width="480" height="200" style="display:block;width:100%;height:auto"><rect width="480" height="200" fill="#f3f2f1"></rect><rect x="190" y="20" width="100" height="180" fill="none" stroke="#0b0c0c" stroke-width="4"></rect><circle cx="270" cy="115" r="6" fill="#0b0c0c"></circle></svg>
      <p style="position:absolute;left:0;right:0;bottom:0;margin:0;padding:8px 12px;background:#0b0c0c;color:#fff;display:flex;justify-content:space-between"><span>Front door</span><span>Locked</span></p>
      </div>
      <h2 id="spec-entity-title" style="margin:12px 0 4px;font-size:1.5rem;line-height:1.25">Front door</h2>
      <p style="margin:0">Locked at 17:52.</p>
      </div></article>
  spec-inset-estimate:
    title: Explain an estimated cost
    description: "A simulated Markdown card in the Civica inset style: a note under the heading About energy costs says the cost shown is an estimate from the configured tariff. It is not a live reading."
    height: 340
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-inset-energy-title"><div class="civica-card-demo__body">
      <h2 id="spec-inset-energy-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">About energy costs</h2>
      <div style="border-left:10px solid #cecece;padding:15px"><strong>Note:</strong> The cost shown here is an estimate based on the configured tariff. Your supplier’s bill may include other charges.</div>
      </div></article>
  spec-inset-display:
    title: Clarify a display-only change
    description: "A simulated Markdown card in the Civica inset style: a note under the heading Name a dashboard says that changing a dashboard’s display name does not rename the devices shown on it."
    height: 340
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-inset-name-title"><div class="civica-card-demo__body">
      <h2 id="spec-inset-name-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">Name a dashboard</h2>
      <div style="border-left:10px solid #cecece;padding:15px"><strong>Note:</strong> Changing a dashboard’s display name does not rename the devices shown on it.</div>
      </div></article>
  spec-label-field:
    title: A settings form with visible field names
    description: "Plain HTML in a simulated settings card: each field has a visible label tied to it, a hint and a text box, and the checkbox is wrapped in its label so the words are part of the target. Home Assistant draws its own fields, so a real form looks different. Nothing here is saved."
    height: 560
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-label-title"><div class="civica-card-demo__body">
      <h2 id="spec-label-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">Rename a device</h2>
      <div style="margin:0 0 20px">
      <label for="spec-label-name" style="display:block;font-weight:700;margin:0 0 4px">Device name</label>
      <div id="spec-label-hint" style="color:#484949;margin:0 0 8px">The name shown on dashboards, for example Hall thermostat.</div>
      <input id="spec-label-name" type="text" value="Hall thermostat" aria-describedby="spec-label-hint" style="width:100%;max-width:20rem;box-sizing:border-box;padding:8px;border:2px solid #0b0c0c;font:inherit">
      </div>
      <div style="margin:0 0 20px">
      <label style="display:flex;gap:12px;align-items:center;min-height:44px"><input type="checkbox" checked style="width:24px;height:24px;margin:0"> Show this device on the overview</label>
      </div>
      <p class="civica-card-demo__actions"><button type="button" style="padding:8px 16px;font:inherit">Save</button></p>
      </div></article>
  spec-label-picker-device:
    title: A form that asks which labels apply to a device
    description: "A simulated stand-in for the labels picker: the question asks in terms of the task, the helper text says what labels are for, the chosen labels are written as text and an Add label button follows. Home Assistant draws its own field, chips and list, so the look differs. The button does nothing and the open list is not shown."
    height: 480
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-labels-title"><div class="civica-card-demo__body">
      <h2 id="spec-labels-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">Hall thermostat</h2>
      <span id="spec-labels-label" style="display:block;font-weight:700;margin:0 0 4px">Which labels apply to this device?</span>
      <div id="spec-labels-hint" style="color:#484949;margin:0 0 8px">Labels help you find and group devices.</div>
      <div role="group" aria-labelledby="spec-labels-label" aria-describedby="spec-labels-hint" style="border-bottom:1px solid #6f777b;background:#fff;padding:12px">
      <ul style="list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:8px"><li style="border:1px solid #484949;padding:4px 12px">Heating</li><li style="border:1px solid #484949;padding:4px 12px">Guest room</li></ul>
      <button type="button" style="padding:6px 12px;font:inherit">Add label</button>
      </div>
      </div></article>
  spec-language-navigation-pair:
    title: A heating note in English and in Welsh
    description: "Two simulated pages side by side in the page. Each shows its language links, names every language in that language, and marks the current one. The links jump between the two cards."
    height: 620
    html: |
      <article class="civica-card-demo" id="spec-lang-en" aria-labelledby="spec-lang-en-title"><div class="civica-card-demo__body">
      <nav aria-label="Language"><ul style="list-style:none;margin:0 0 16px;padding:0;display:flex;gap:20px"><li><span aria-current="true" lang="en" style="font-weight:700">English</span></li><li><a href="#spec-lang-cy" rel="alternate" lang="cy" hreflang="cy">Cymraeg</a></li></ul></nav>
      <section lang="en"><h2 id="spec-lang-en-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">Heating</h2><p style="margin:0">The heating is on until 10pm.</p></section>
      </div></article>
      <article class="civica-card-demo" id="spec-lang-cy" aria-labelledby="spec-lang-cy-title"><div class="civica-card-demo__body">
      <nav aria-label="Language"><ul style="list-style:none;margin:0 0 16px;padding:0;display:flex;gap:20px"><li><a href="#spec-lang-en" rel="alternate" lang="en" hreflang="en">English</a></li><li><span aria-current="true" lang="cy" style="font-weight:700">Cymraeg</span></li></ul></nav>
      <section lang="cy"><h2 id="spec-lang-cy-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">Gwres</h2><p style="margin:0">Mae’r gwres ymlaen tan 10pm.</p></section>
      </div></article>
  spec-light-card-lounge:
    title: A light card for the lounge lamp, simulated
    description: "A simulated stand-in for a light card: a dial around a lamp icon, with the name, the state and the brightness written as text beside it. The real card shows no state or brightness text while it is at rest; it shows the brightness only while the dial is dragged. Nothing here is live."
    height: 420
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-light-title"><div class="civica-card-demo__body">
      <h2 id="spec-light-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">Lounge lamp</h2>
      <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 160 160" width="160" height="160"><circle cx="80" cy="80" r="60" fill="none" stroke="#6f777b" stroke-width="12" stroke-dasharray="283 377" transform="rotate(135 80 80)"></circle><circle cx="80" cy="80" r="60" fill="none" stroke="#1d70b8" stroke-width="12" stroke-dasharray="170 377" transform="rotate(135 80 80)"></circle><circle cx="80" cy="76" r="22" fill="#ffc107" stroke="#0b0c0c" stroke-width="3"></circle><path d="M70 104h20" stroke="#0b0c0c" stroke-width="4"></path></svg>
      <div><p style="margin:0 0 4px"><strong>State:</strong> On</p><p style="margin:0 0 12px"><strong>Brightness:</strong> 60%</p><button type="button" style="padding:8px 16px;font:inherit">More information</button></div>
      </div>
      </div></article>
  spec-link-descriptive:
    title: A help card with links, and a button for an action
    description: "A simulated help card. The first link names its destination, the second says it is a file and opens in a new tab, and the lamp control is a button because it acts instead of going somewhere. The links go nowhere real and the button does nothing."
    height: 520
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-link-title"><div class="civica-card-demo__body">
      <h2 id="spec-link-title" style="margin:0 0 12px;font-size:1.5rem;line-height:1.25">Heating help</h2>
      <p>To change when the heating comes on, <a href="#spec-link-title">read the heating schedule guide</a>.</p>
      <p><a href="#spec-link-title" target="_blank" rel="noopener">Boiler manual (PDF, 2 MB, opens in a new tab)</a></p>
      <p class="civica-card-demo__actions"><button type="button" style="padding:8px 16px;font:inherit">Turn on the lamp</button></p>
      </div></article>
