# Synthetic data and no live actions.
examples:
  spec-media-control-playing:
    title: A media control card playing a track
    description: "A stand-in for the Home Assistant media control card on a speaker with no artwork: the card falls back to the theme’s primary colour, with the speaker name, the title and artist, the state written as “Playing”, three playback buttons and the elapsed time in words. A real card also shows the artwork and takes its colours from it. The buttons do nothing here."
    height: 520
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-media-title"><div style="background:#1D70B8;color:#FFFFFF;padding:16px"><p style="margin:0 0 12px;font-size:16px"><span aria-hidden="true">&#9835; </span><span id="spec-media-title">Kitchen speaker</span></p><p style="margin:0;font-size:22px;font-weight:700">Morning Light</p><p style="margin:0 0 12px;font-size:16px">Coastline Quartet</p><p style="margin:0 0 12px;font-size:16px"><strong>Playing</strong>, 1:42 of 3:30</p><div aria-hidden="true" style="height:8px;background:rgba(255,255,255,0.4);margin-bottom:16px"><div style="width:49%;height:8px;background:#FFFFFF"></div></div><div style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" style="min-height:44px;min-width:44px;padding:0 12px;background:transparent;color:#FFFFFF;border:2px solid #FFFFFF;font:inherit">Previous track</button><button type="button" style="min-height:44px;min-width:44px;padding:0 12px;background:#FFFFFF;color:#0B0C0C;border:2px solid #FFFFFF;font:inherit">Pause</button><button type="button" style="min-height:44px;min-width:44px;padding:0 12px;background:transparent;color:#FFFFFF;border:2px solid #FFFFFF;font:inherit">Next track</button></div></div></article>
  spec-metric-system-rows:
    title: Processor and memory rows with a percentage and a bar
    description: "A stand-in for the system information rows that use the Home Assistant metric display: a heading, the percentage in text and a 12 pixel bar beneath it. The bar changes colour above 50 per cent and above 85 per cent, so the percentage is the reading. Home Assistant shows these rows only in its system information dialog, not on a dashboard."
    height: 560
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-metric-title"><div class="civica-card-demo__body"><h2 id="spec-metric-title" style="font-size:1.25rem;line-height:1.3;font-weight:700;margin:0 0 16px">Home Assistant Core</h2><div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between"><span>Processor</span><strong>12 %</strong></div><div aria-hidden="true" style="height:12px;background:#F3F2F1;margin-top:4px"><div style="width:12%;height:12px;background:#0F7A52"></div></div></div><div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between"><span>Memory</span><strong>62 %</strong></div><div aria-hidden="true" style="height:12px;background:#F3F2F1;margin-top:4px"><div style="width:62%;height:12px;background:#8A6100"></div></div></div><h2 style="font-size:1.25rem;line-height:1.3;font-weight:700;margin:24px 0 16px">Supervisor</h2><div><div style="display:flex;justify-content:space-between"><span>Memory</span><strong>88 %</strong></div><div aria-hidden="true" style="height:12px;background:#F3F2F1;margin-top:4px"><div style="width:88%;height:12px;background:#CA3535"></div></div></div></div></article>
  spec-more-info-light:
    title: A light’s more-info dialog with its brightness control
    description: "A stand-in for the content of the Home Assistant more-info dialog for a ceiling light: the room above the light name, a close button, the state in words, a vertical brightness control and a button to turn the light off. Home Assistant draws its own dialog, and its brightness control is dragged; this picture cannot be moved. The buttons do nothing here."
    height: 640
    html: |
      <article style="border:1px solid #CECECE;background:#FFFFFF;padding:16px" aria-labelledby="spec-moreinfo-title"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px"><div><p style="margin:0;font-size:14px;color:#484949">Living room</p><h2 id="spec-moreinfo-title" style="font-size:1.25rem;line-height:1.3;font-weight:700;margin:0">Ceiling light</h2></div><button type="button" style="min-height:44px;min-width:44px;padding:0 12px;background:#FFFFFF;color:#0B0C0C;border:2px solid #0B0C0C;font:inherit">Close</button></div><p style="margin:0 0 12px"><strong>On</strong>, brightness 70 %</p><div style="display:flex;justify-content:center;margin-bottom:12px"><svg role="img" aria-label="Brightness control filled to 70 per cent" width="130" height="200" viewBox="0 0 130 200"><rect x="0" y="0" width="130" height="200" rx="16" fill="#6F777B" fill-opacity="0.2"></rect><rect x="0" y="60" width="130" height="140" rx="16" fill="#F5B93B"></rect></svg></div><button type="button" style="min-height:44px;padding:0 16px;background:#FFFFFF;color:#0B0C0C;border:2px solid #0B0C0C;font:inherit">Turn off</button></article>
  spec-banner-maintenance:
    title: A planned interruption
    description: "A notice banner for a planned interruption, shown as a Civica pattern in the near-black notice colour with white text. It says what is affected and when, and it is plain text on the page. Home Assistant has no banner element, so this is not a Home Assistant screen."
    height: 330
    html: |
      <section aria-labelledby="spec-banner-maint-title" style="border:5px solid #0B0C0C;margin-bottom:16px"><div style="background:#0B0C0C;color:#FFFFFF;padding:4px 20px 8px"><h2 id="spec-banner-maint-title" style="font-size:1.125rem;line-height:1.3;font-weight:700;margin:4px 0 0">Scheduled maintenance</h2></div><div style="padding:20px"><p style="margin:0 0 12px;font-size:1.25rem;font-weight:700">Energy history may be delayed on 3 December 2026.</p><p style="margin:0">Between <time datetime="2026-12-03T02:00:00+00:00">02:00</time> and <time datetime="2026-12-03T02:30:00+00:00">02:30 GMT</time> the home server restarts for an update. The dashboard may show older energy readings until it finishes.</p></div></section>
  spec-banner-success:
    title: A confirmed save from the previous step
    description: "A success banner in the Civica green with white text, shown after a settings page has saved. The message says what was saved and what happens next. It is a Civica pattern, not a Home Assistant screen."
    height: 340
    html: |
      <section aria-labelledby="spec-banner-saved-title" style="border:5px solid #0F7A52;margin-bottom:16px"><div style="background:#0F7A52;color:#FFFFFF;padding:4px 20px 8px"><h2 id="spec-banner-saved-title" style="font-size:1.125rem;line-height:1.3;font-weight:700;margin:4px 0 0">Success</h2></div><div style="padding:20px"><p style="margin:0 0 12px;font-size:1.25rem;font-weight:700">Dashboard preferences saved</p><p style="margin:0">Your selected rooms will appear the next time you open the dashboard.</p></div></section>
  spec-navigation-rooms:
    title: Room links with the current room marked
    description: "A stand-in for navigation between the rooms of a household dashboard: a navigation landmark with its own name, a list of links, and the current room marked with bold text and a bar, and with aria-current for assistive technology, not by colour alone. Home Assistant draws its own sidebar and view tabs; this list is the plain-link version. The links move within this example."
    height: 460
    html: |
      <nav aria-label="Rooms" style="margin-bottom:16px"><ul style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px"><li><a href="#overview" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #CECECE;color:#1A65A6">Overview</a></li><li><a href="#kitchen" aria-current="page" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #0B0C0C;border-left:6px solid #0B0C0C;color:#0B0C0C;font-weight:700">Kitchen</a></li><li><a href="#living-room" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #CECECE;color:#1A65A6">Living room</a></li><li><a href="#bedrooms" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #CECECE;color:#1A65A6">Bedrooms</a></li><li><a href="#garden" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border:1px solid #CECECE;color:#1A65A6">Garden</a></li></ul></nav><h2 id="kitchen" style="font-size:1.5rem;line-height:1.3;font-weight:700;margin:0 0 8px">Kitchen</h2><p style="margin:0 0 16px">Temperature 20.5 °C. Oven off. Back door locked.</p><h2 id="overview" style="font-size:1.125rem;margin:0 0 4px">Overview</h2><p style="margin:0 0 12px">Heating on, 3 doors locked.</p><h2 id="living-room" style="font-size:1.125rem;margin:0 0 4px">Living room</h2><p style="margin:0 0 12px">Temperature 21 °C. Lamp on.</p><h2 id="bedrooms" style="font-size:1.125rem;margin:0 0 4px">Bedrooms</h2><p style="margin:0 0 12px">Temperature 18 °C. Windows closed.</p><h2 id="garden" style="font-size:1.125rem;margin:0 0 4px">Garden</h2><p style="margin:0">Sprinkler off.</p>
  spec-az-household-guides:
    title: Letters that link only where a guide exists
    description: "A short A to Z for a set of appliance guides. Letters that have a guide are links to that letter’s section; letters without one are plain text, so there are no dead links. Each letter link is at least 44 pixels square and the row wraps on a narrow screen. This is a Civica pattern for guide pages, not a Home Assistant control. The links move within this example."
    height: 520
    html: |
      <nav aria-label="Guide letters" style="margin-bottom:16px"><ul style="display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0"><li><a href="#guides-b" style="display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;font-weight:700;border:1px solid #505A5F;color:#1A65A6">B</a></li><li><span style="display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;color:#484949;border:1px solid #CECECE">C</span></li><li><a href="#guides-d" style="display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;font-weight:700;border:1px solid #505A5F;color:#1A65A6">D</a></li><li><span style="display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;color:#484949;border:1px solid #CECECE">E</span></li><li><a href="#guides-v" style="display:flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;font-weight:700;border:1px solid #505A5F;color:#1A65A6">V</a></li></ul></nav><section id="guides-b"><h2 style="font-size:1.25rem;font-weight:700;margin:0 0 8px">B</h2><ul style="margin:0 0 16px"><li>Boiler</li></ul></section><section id="guides-d"><h2 style="font-size:1.25rem;font-weight:700;margin:0 0 8px">D</h2><ul style="margin:0 0 16px"><li>Dishwasher</li></ul></section><section id="guides-v"><h2 style="font-size:1.25rem;font-weight:700;margin:0 0 8px">V</h2><ul style="margin:0"><li>Vacuum cleaner (also found under Hoover)</li></ul></section>
  spec-output-range-value:
    title: A slider with its chosen value written beside it
    description: "A labelled range field with an output element that writes the chosen value and its unit next to the slider. Moving the slider changes the written value in this example. It sends nothing to a home, and Home Assistant does not provide an output element of its own."
    height: 380
    html: |
      <form data-demo-form><h2 style="font-size:1.25rem;line-height:1.3;font-weight:700;margin:0 0 12px">Reading lamp</h2><p style="margin:0 0 4px"><label for="spec-output-brightness">Brightness</label></p><input class="civica-slider" id="spec-output-brightness" type="range" min="0" max="100" step="1" value="40" data-demo-range><p style="margin:12px 0 0">Chosen brightness: <output for="spec-output-brightness" aria-live="off" data-demo-range-output style="font-weight:700">40%</output></p></form>
