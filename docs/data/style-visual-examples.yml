      <path d="M340 290l18 32h-36z" fill="#106165"/>
      <path d="M520 410l18 18-18 18-18-18z" fill="#CA3535"/>
      <text x="610" y="70" font-size="20" font-weight="700" fill="#0B0C0C">Key</text>
