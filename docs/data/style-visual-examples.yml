  illustration-social:
    title: Illustrations in social posts
    description: Three original social posts, each with an illustration and a short headline, in the social palette.
    height: 640
    html: |
      <p class="govuk-body">These posts are drawings for invented guides. Repeat the headline in the text of the post, so that everyone gets it.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:30px 20px;max-width:960px">
      <figure style="margin:0" aria-labelledby="ill-social-solar-c">
      <svg viewBox="0 0 400 500" role="img" aria-labelledby="ill-social-solar-t ill-social-solar-d" style="display:block;width:100%;height:auto;font-family:Roboto,Helvetica Neue,Helvetica,Arial,sans-serif">
      <title id="ill-social-solar-t">Social post: Track your solar panels today</title>
      <desc id="ill-social-solar-d">A social media post on Primary blue. A blue house with a solar panel in Accent teal under a yellow sun. Under it, the headline: Track your solar panels today</desc>
      <rect width="400" height="500" fill="#1D70B8"/>
      <circle cx="300" cy="90" r="54" fill="#FFDD00"/>
      <path d="M60 300L180 200L300 300Z" fill="#0F385C"/>
      <rect x="80" y="290" width="200" height="40" fill="#0F385C"/>
      <path d="M140 228L196 228L236 268L180 268Z" fill="#00FFE0"/>
      <text x="32" y="380" font-size="32" font-weight="700" fill="#FFFFFF">Track your solar</text>
      <text x="32" y="420" font-size="32" font-weight="700" fill="#FFFFFF">panels today</text>
      </svg>
      <figcaption class="govuk-body-s" id="ill-social-solar-c" style="margin-top:10px">
      <strong>A guide to the energy dashboard</strong>
      <br>Primary blue is the base, and the solar panel is the one accent. Colours: Primary blue, Primary yellow, Blue shade 50%, Accent teal, White.</figcaption>
      </figure>
      <figure style="margin:0" aria-labelledby="ill-social-leak-c">
      <svg viewBox="0 0 400 500" role="img" aria-labelledby="ill-social-leak-t ill-social-leak-d" style="display:block;width:100%;height:auto;font-family:Roboto,Helvetica Neue,Helvetica,Arial,sans-serif">
      <title id="ill-social-leak-t">Social post: Get a warning before a leak</title>
      <desc id="ill-social-leak-d">A social media post on Teal shade 25%. A white sink with a water drop in Accent teal and a leak sensor on the floor beside it. Under it, the headline: Get a warning before a leak</desc>
      <rect width="400" height="500" fill="#106165"/>
      <rect x="70" y="250" width="260" height="80" rx="10" fill="#FFFFFF"/>
      <rect x="250" y="70" width="20" height="150" fill="#FFFFFF"/>
      <rect x="230" y="70" width="80" height="20" fill="#FFFFFF"/>
      <path d="M180 160S150 200 150 220a30 30 0 0 0 60 0c0-20-30-60-30-60z" fill="#00FFE0"/>
