      review_status: Source checks only; rendered review at desktop width and 320px is recorded by the illustrator handover.
      purpose: 'Show the 3 composition techniques: overlap, space and frame.'
  illustration-detail:
    title: Adding detail
    description: Three original scenes that show how to protect the action, make a scene familiar and add context quietly.
    height: 520
    html: |
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px 20px;max-width:960px">
      <figure style="margin:0;" aria-labelledby="ill-detail-action-c">
      <svg viewBox="0 0 800 500" role="img" aria-labelledby="ill-detail-action-t ill-detail-action-d" style="display:block;width:100%;height:auto;font-family:Roboto,Helvetica Neue,Helvetica,Arial,sans-serif">
      <title id="ill-detail-action-t">Protect the action: a hand pressing a smart plug</title>
      <desc id="ill-detail-action-d">A hand reaches in from the right to press the button on a smart plug in a wall socket. A sofa is in the background on the left, well away from the hand.</desc>
      <rect width="800" height="500" fill="#D2E2F1"/>
      <rect y="400" width="800" height="100" fill="#8EB8DC"/>
      <rect x="60" y="300" width="260" height="70" rx="22" fill="#8EB8DC"/>
      <rect x="80" y="330" width="220" height="50" rx="14" fill="#D2E2F1"/>
      <rect x="50" y="330" width="40" height="70" rx="18" fill="#8EB8DC"/>
      <rect x="290" y="330" width="40" height="70" rx="18" fill="#8EB8DC"/>
      <rect x="500" y="250" width="90" height="90" rx="10" fill="#FFFFFF"/>
      <rect x="522" y="272" width="46" height="46" rx="8" fill="#1D70B8"/>
      <circle cx="545" cy="295" r="9" fill="#00FFE0"/>
      <path d="M700 420L600 300" stroke="#0F7A52" stroke-width="34" stroke-linecap="round"/>
      <rect x="560" y="286" width="54" height="22" rx="11" fill="#99704A"/>
      <circle cx="604" cy="300" r="18" fill="#99704A"/>
      </svg>
      <figcaption class="govuk-body-s" id="ill-detail-action-c" style="margin-top:10px">
      <strong>Protect the action</strong>
      <br>The sofa sets the room, but nothing covers the hand or the plug button. Colours: Blue tint 80%, Blue tint 50%, White, Primary blue, Accent teal, Primary green, Primary brown.</figcaption>
      </figure>
      <figure style="margin:0;" aria-labelledby="ill-detail-familiar-c">
      <svg viewBox="0 0 800 500" role="img" aria-labelledby="ill-detail-familiar-t ill-detail-familiar-d" style="display:block;width:100%;height:auto;font-family:Roboto,Helvetica Neue,Helvetica,Arial,sans-serif">
      <title id="ill-detail-familiar-t">Make it familiar: a boiler in a kitchen cupboard</title>
      <desc id="ill-detail-familiar-d">An open kitchen cupboard with a blue boiler inside. The boiler has a display highlighted in Accent teal and 2 pipes running down from it.</desc>
      <rect width="800" height="500" fill="#D2E2F1"/>
      <rect y="400" width="800" height="100" fill="#8EB8DC"/>
      <rect x="250" y="40" width="300" height="360" fill="#FFFFFF"/>
      <rect x="250" y="40" width="20" height="360" fill="#8EB8DC"/>
      <path d="M550 40L610 20V420L550 400Z" fill="#FFFFFF"/>
      <path d="M550 40V400" stroke="#8EB8DC" stroke-width="4"/>
      <rect x="320" y="80" width="160" height="200" fill="#1D70B8"/>
      <rect x="350" y="110" width="100" height="40" fill="#00FFE0"/>
      <rect x="345" y="280" width="16" height="120" fill="#0F385C"/>
      <rect x="439" y="280" width="16" height="120" fill="#0F385C"/>
      <circle cx="400" cy="210" r="18" fill="#0F385C"/>
      </svg>
      <figcaption class="govuk-body-s" id="ill-detail-familiar-c" style="margin-top:10px">
      <strong>Make it familiar</strong>
      <br>A boiler in a cupboard says straight away that this is a kitchen in a home. Colours: Blue tint 80%, Blue tint 50%, White, Primary blue, Accent teal, Blue shade 50%.</figcaption>
      </figure>
      <figure style="margin:0;" aria-labelledby="ill-detail-context-c">
