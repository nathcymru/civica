      <strong>A floor plan with its sensors listed in text</strong>
      <br>Each sensor type has its own shape as well as its own colour, the room names are part of the drawing so they stay sharp, and the list under the plan gives the same facts as a Markdown card would. Colours: Black, White, Blue tint 95%, Primary blue, Primary purple, Teal shade 25%, Primary red.</figcaption>
