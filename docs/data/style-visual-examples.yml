      <circle cx="110" cy="300" r="6" fill="#00FFE0"/>
      <text x="32" y="380" font-size="32" font-weight="700" fill="#FFFFFF">Get a warning</text>
      <text x="32" y="420" font-size="32" font-weight="700" fill="#FFFFFF">before a leak</text>
      </svg>
      <figcaption class="govuk-body-s" id="ill-social-leak-c" style="margin-top:10px">
      <strong>A guide to leak sensors</strong>
      <br>Shades of one colour keep the post calm, and the accent marks the water. Colours: Teal shade 25%, White, Accent teal, Teal shade 50%.</figcaption>
      </figure>
      <figure style="margin:0" aria-labelledby="ill-social-night-c">
      <svg viewBox="0 0 400 500" role="img" aria-labelledby="ill-social-night-t ill-social-night-d" style="display:block;width:100%;height:auto;font-family:Roboto,Helvetica Neue,Helvetica,Arial,sans-serif">
