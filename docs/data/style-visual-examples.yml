  illustration-composition:
    title: Building a composition
    description: Three original scenes that show overlap, space and framing in a Home Assistant illustration.
    height: 520
    html: |
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px 20px;max-width:960px">
      <figure style="margin:0;" aria-labelledby="ill-comp-overlap-c">
      <svg viewBox="0 0 800 500" role="img" aria-labelledby="ill-comp-overlap-t ill-comp-overlap-d" style="display:block;width:100%;height:auto;font-family:Roboto,Helvetica Neue,Helvetica,Arial,sans-serif">
      <title id="ill-comp-overlap-t">Overlap: a thermostat in front of a door frame</title>
      <desc id="ill-comp-overlap-d">A hall. A round thermostat overlaps the edge of a door frame, so it sits in front of it. A small picture hangs on the wall to the left.</desc>
      <rect width="800" height="500" fill="#D2E2F1"/>
      <rect y="400" width="800" height="100" fill="#8EB8DC"/>
      <rect x="420" y="90" width="200" height="310" fill="#16548A"/>
      <rect x="436" y="106" width="168" height="294" fill="#8EB8DC"/>
      <circle cx="590" cy="260" r="9" fill="#0F385C"/>
      <circle cx="420" cy="230" r="62" fill="#1D70B8"/>
      <circle cx="420" cy="230" r="44.64" fill="#FFFFFF"/>
      <rect x="396.44" y="218.84" width="47.12" height="22.32" fill="#00FFE0"/>
      <rect x="150" y="160" width="140" height="100" fill="#FFFFFF"/>
      <rect x="164" y="174" width="112" height="72" fill="#8EB8DC"/>
      </svg>
      <figcaption class="govuk-body-s" id="ill-comp-overlap-c" style="margin-top:10px">
      <strong>Overlap</strong>
      <br>The thermostat overlaps the door frame, which brings it forward without an outline. Colours: Blue tint 80%, Blue tint 50%, Blue shade 25%, Blue shade 50%, Primary blue, White, Accent teal.</figcaption>
      </figure>
      <figure style="margin:0;" aria-labelledby="ill-comp-space-c">
      <svg viewBox="0 0 800 500" role="img" aria-labelledby="ill-comp-space-t ill-comp-space-d" style="display:block;width:100%;height:auto;font-family:Roboto,Helvetica Neue,Helvetica,Arial,sans-serif">
      <title id="ill-comp-space-t">Space: a motion sensor in the corner of a plain room</title>
      <desc id="ill-comp-space-d">A plain white room with a motion sensor high in the top right corner and one small plant on the floor. Most of the picture is empty wall.</desc>
      <rect width="800" height="500" fill="#FFFFFF"/>
      <rect y="430" width="800" height="70" fill="#D2E2F1"/>
      <rect x="663" y="53" width="54" height="54" rx="13.5" fill="#1D70B8"/>
      <circle cx="690" cy="80" r="9" fill="#00FFE0"/>
      <path d="M650 120A60 60 0 0 1 650 40" fill="none" stroke="#00FFE0" stroke-width="10" stroke-linecap="round" transform="rotate(-45 690 80)"/>
      <path d="M100 430h60l-8-60h-44z" fill="#16548A"/>
      <ellipse cx="130" cy="350" rx="18" ry="30" fill="#1D70B8"/>
      </svg>
      <figcaption class="govuk-body-s" id="ill-comp-space-c" style="margin-top:10px">
      <strong>Space</strong>
      <br>The plain wall around the sensor keeps the scene calm and leads the eye to it. Colours: White, Blue tint 80%, Primary blue, Accent teal, Blue shade 25%.</figcaption>
      </figure>
      <figure style="margin:0;" aria-labelledby="ill-comp-frame-c">
      <svg viewBox="0 0 800 500" role="img" aria-labelledby="ill-comp-frame-t ill-comp-frame-d" style="display:block;width:100%;height:auto;font-family:Roboto,Helvetica Neue,Helvetica,Arial,sans-serif">
      <title id="ill-comp-frame-t">Frame: a phone screen around a thermostat dial</title>
      <desc id="ill-comp-frame-d">A large phone fills the middle of the picture. On its screen is a round thermostat dial. A finger reaches in from the right and touches the edge of the screen.</desc>
      <rect width="800" height="500" fill="#F4F8FB"/>
      <rect x="270" y="30" width="260" height="440" rx="36" fill="#0F385C"/>
      <rect x="286" y="62" width="228" height="376" rx="10" fill="#FFFFFF"/>
      <circle cx="400" cy="230" r="80" fill="#1D70B8"/>
      <circle cx="400" cy="230" r="57.6" fill="#F4F8FB"/>
      <rect x="369.6" y="215.6" width="60.8" height="28.8" fill="#00FFE0"/>
      <rect x="320" y="350" width="160" height="40" fill="#D2E2F1"/>
      <path d="M650 317L760 360" stroke="#54319F" stroke-width="40" stroke-linecap="round"/>
      <rect x="490" y="300" width="160" height="34" rx="17" fill="#FABB9C"/>
      <circle cx="640" cy="317" r="30" fill="#FABB9C"/>
      </svg>
      <figcaption class="govuk-body-s" id="ill-comp-frame-c" style="margin-top:10px">
      <strong>Frame</strong>
      <br>The phone is the larger shape that frames the dial, so the eye goes to the action inside it. Colours: Blue tint 95%, Blue shade 50%, White, Primary blue, Accent teal, Blue tint 80%, Primary purple, Orange tint 50%.</figcaption>
      </figure>
      </div>
