# data and no live actions.
examples:
  spec-popover-reading-note:
    title: A sensor card with its extra explanation written out
    description: "A sensor card in the light theme. The reading is on the first line, and the longer explanation sits under a plain heading, \"More about this reading\", instead of in a popover, because a dashboard cannot add a popover. The text is always visible."
    height: 380
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-popover-title"><div class="civica-card-demo__body">
      <h2 id="spec-popover-title" style="margin:0 0 12px;font-size:22px;line-height:1.25">Living-room temperature</h2>
      <p style="margin:0 0 16px;font-size:1.75rem;font-weight:700;line-height:1.2">20.5°C</p>
      <h3 style="margin:0 0 4px;font-size:19px;line-height:1.25">More about this reading</h3>
      <p style="margin:0;color:#484949">The sensor sits on the bookshelf, away from the radiator. It reports every 5 minutes, so the figure can be up to 5 minutes old.</p>
      </div></article>
  spec-progress-update-card:
    title: An update card with a progress bar and the same progress in words
    description: "An update card in the light theme. A bar fills three fifths of its length, and the words beside it say \"Step 3 of 5\" and name what is happening. The bar here is the browser’s own, so Home Assistant’s bar looks different. Nothing here is interactive."
    height: 400
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-progress-title"><div class="civica-card-demo__body">
      <h2 id="spec-progress-title" style="margin:0 0 12px;font-size:22px;line-height:1.25">Hallway thermostat update</h2>
      <p style="margin:0 0 8px"><label for="spec-progress-bar"><strong>Installing the update</strong></label></p>
      <progress id="spec-progress-bar" value="3" max="5" style="display:block;width:100%;max-width:20rem;height:16px;accent-color:#19578D">Step 3 of 5</progress>
      <p style="margin:8px 0 0">Step 3 of 5: copying the new software to the thermostat. This usually takes a few minutes.</p>
      </div></article>
  spec-qr-guest-wifi:
    title: A guest wifi card with a QR code and the same details as text
    description: "A Markdown card in the light theme. A QR code made from the wifi details sits beside the network name and the password, which are written out as text, and a line says what scanning does. Home Assistant draws its own code, so the look differs. Nothing here is interactive."
    height: 420
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-qr-title"><div class="civica-card-demo__body">
      <h2 id="spec-qr-title" style="margin:0 0 12px;font-size:22px;line-height:1.25">Guest wifi</h2>
      <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">
      <svg role="img" aria-label="QR code for the guest wifi network. The same details are written in the text beside it." viewBox="0 0 41 41" width="164" height="164" shape-rendering="crispEdges" style="flex:none"><rect width="41" height="41" fill="#FFFFFF"></rect><path fill="#0B0C0C" d="M4 4h7v1h-7zM12 4h5v1h-5zM26 4h2v1h-2zM30 4h7v1h-7zM4 5h1v1h-1zM10 5h1v1h-1zM12 5h4v1h-4zM21 5h1v1h-1zM23 5h1v1h-1zM25 5h2v1h-2zM28 5h1v1h-1zM30 5h1v1h-1zM36 5h1v1h-1zM4 6h1v1h-1zM6 6h3v1h-3zM10 6h1v1h-1zM12 6h1v1h-1zM16 6h1v1h-1zM20 6h5v1h-5zM26 6h3v1h-3zM30 6h1v1h-1zM32 6h3v1h-3zM36 6h1v1h-1zM4 7h1v1h-1zM6 7h3v1h-3zM10 7h1v1h-1zM13 7h3v1h-3zM19 7h1v1h-1zM27 7h2v1h-2zM30 7h1v1h-1zM32 7h3v1h-3zM36 7h1v1h-1zM4 8h1v1h-1zM6 8h3v1h-3zM10 8h1v1h-1zM12 8h1v1h-1zM18 8h2v1h-2zM21 8h2v1h-2zM24 8h2v1h-2zM27 8h2v1h-2zM30 8h1v1h-1zM32 8h3v1h-3zM36 8h1v1h-1zM4 9h1v1h-1zM10 9h1v1h-1zM13 9h2v1h-2zM17 9h1v1h-1zM21 9h1v1h-1zM24 9h2v1h-2zM27 9h2v1h-2zM30 9h1v1h-1zM36 9h1v1h-1zM4 10h7v1h-7zM12 10h1v1h-1zM14 10h1v1h-1zM16 10h1v1h-1zM18 10h1v1h-1zM20 10h1v1h-1zM22 10h1v1h-1zM24 10h1v1h-1zM26 10h1v1h-1zM28 10h1v1h-1zM30 10h7v1h-7zM13 11h3v1h-3zM17 11h1v1h-1zM22 11h3v1h-3zM26 11h1v1h-1zM28 11h1v1h-1zM4 12h1v1h-1zM7 12h8v1h-8zM16 12h1v1h-1zM18 12h2v1h-2zM21 12h1v1h-1zM23 12h1v1h-1zM29 12h1v1h-1zM32 12h1v1h-1zM34 12h3v1h-3zM4 13h1v1h-1zM11 13h1v1h-1zM13 13h1v1h-1zM16 13h1v1h-1zM19 13h2v1h-2zM23 13h1v1h-1zM27 13h6v1h-6zM4 14h9v1h-9zM15 14h1v1h-1zM18 14h2v1h-2zM21 14h2v1h-2zM24 14h2v1h-2zM27 14h1v1h-1zM29 14h1v1h-1zM31 14h2v1h-2zM34 14h3v1h-3zM4 15h3v1h-3zM8 15h1v1h-1zM15 15h2v1h-2zM18 15h1v1h-1zM20 15h2v1h-2zM23 15h2v1h-2zM28 15h2v1h-2zM34 15h1v1h-1zM36 15h1v1h-1zM4 16h3v1h-3zM9 16h2v1h-2zM13 16h1v1h-1zM15 16h8v1h-8zM24 16h8v1h-8zM33 16h2v1h-2zM36 16h1v1h-1zM4 17h2v1h-2zM8 17h1v1h-1zM11 17h1v1h-1zM15 17h1v1h-1zM20 17h1v1h-1zM23 17h1v1h-1zM26 17h1v1h-1zM28 17h1v1h-1zM33 17h1v1h-1zM35 17h2v1h-2zM5 18h2v1h-2zM8 18h5v1h-5zM15 18h3v1h-3zM20 18h2v1h-2zM25 18h1v1h-1zM31 18h1v1h-1zM34 18h1v1h-1zM6 19h2v1h-2zM15 19h