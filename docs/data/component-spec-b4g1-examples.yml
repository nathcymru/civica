h7v1h-7zM12 36h4v1h-4zM17 36h2v1h-2zM20 36h2v1h-2zM24 36h1v1h-1zM28 36h4v1h-4z"></path></svg>
      <div style="flex:1 1 12rem;min-width:0">
      <p style="margin:0 0 8px">Scan the code with your phone camera to join the guest network.</p>
      <p style="margin:0">Network: <strong>Guest network</strong><br>Password: <strong>sunflower-42</strong></p>
      </div>
      </div>
      </div></article>
  spec-radio-units:
    title: Choose one unit
    description: "A form card with one group of two radios and no answer chosen. Both options are visible, and neither is assumed for a new answer. Nothing is saved."
    height: 340
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-radio-units-title"><div class="civica-card-demo__body">
      <h2 id="spec-radio-units-title" style="margin:0 0 15px;font-size:22px;line-height:1.25">Display settings</h2>
      <fieldset style="border:0;margin:0;padding:0">
      <legend style="font-weight:700;font-size:1.25rem;padding:0;margin:0 0 8px">Which temperature unit should be used?</legend>
      <p style="margin:0 0 8px;display:flex;align-items:center;gap:12px;min-height:44px"><input id="spec-radio-units-0" name="spec-radio-units" type="radio" value="0" style="width:24px;height:24px;margin:0"><label for="spec-radio-units-0">Degrees Celsius</label></p>
      <p style="margin:0 0 8px;display:flex;align-items:center;gap:12px;min-height:44px"><input id="spec-radio-units-1" name="spec-radio-units" type="radio" value="1" style="width:24px;height:24px;margin:0"><label for="spec-radio-units-1">Degrees Fahrenheit</label></p>
      </fieldset>
      </div></article>
  spec-radio-colour-mode:
    title: Edit a saved colour mode
    description: "A form card with one group of three radios. The saved choice, Use device setting, is already selected, because this card edits an existing setting. Nothing is saved."
    height: 380
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-radio-mode-title"><div class="civica-card-demo__body">
      <h2 id="spec-radio-mode-title" style="margin:0 0 15px;font-size:22px;line-height:1.25">Display settings</h2>
      <fieldset style="border:0;margin:0;padding:0">
      <legend style="font-weight:700;font-size:1.25rem;padding:0;margin:0 0 8px">Colour mode</legend>
      <p style="margin:0 0 8px;display:flex;align-items:center;gap:12px;min-height:44px"><input id="spec-radio-mode-0" name="spec-radio-mode" type="radio" value="0" style="width:24px;height:24px;margin:0"><label for="spec-radio-mode-0">Light</label></p>
      <p style="margin:0 0 8px;display:flex;align-items:center;gap:12px;min-height:44px"><input id="spec-radio-mode-1" name="spec-radio-mode" type="radio" value="1" style="width:24px;height:24px;margin:0"><label for="spec-radio-mode-1">Dark</label></p>
      <p style="margin:0 0 8px;display:flex;align-items:center;gap:12px;min-height:44px"><input id="spec-radio-mode-2" name="spec-radio-mode" type="radio" value="2" checked style="width:24px;height:24px;margin:0"><label for="spec-radio-mode-2">Use device setting</label></p>
      </fieldset>
      </div></article>
  spec-time-reading-card:
    title: A reading with its exact time and the relative wording
    description: "A sensor card in the light theme. The exact date and time are written out in full, and the relative wording sits beside them. Home Assistant draws and updates the relative wording itself; here it is fixed text. Nothing here is interactive."
    height: 340
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-time-title"><div class="civica-card-demo__body">
      <h2 id="spec-time-title" style="margin:0 0 12px;font-size:22px;line-height:1.25">Living-room temperature</h2>
      <p style="margin:0 0 8px;font-size:1.75rem;font-weight:700;line-height:1.2">20.5°C</p>
      <p style="margin:0;color:#484949">Last changed <time datetime="2026-11-11T14:05:00Z">14:05 GMT on 11 November 2026</time> (5 minutes ago)</p>
      </div></article>
  spec-search-devices:
    title: Search within devices
    description: "A search form with a visible label, a hint that names what is searched, one search field and a button. The button does nothing."
    height: 340
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-search-devices-title"><div class="civica-card-demo__body">
      <h2 id="spec-search-devices-title" style="margin:0 0 15px;font-size:22px;line-height:1.25">Devices</h2>
      <form role="search" aria-label="Devices" onsubmit="return false">
      <label for="spec-search-devices-field" style="display:block;font-weight:700;margin:0 0 4px">Find a device</label>
      <p id="spec-search-devices-hint" style="margin:0 0 8px;color:#484949">Search by its display name</p>
      <input id="spec-search-devices-field" name="spec-search-devices-field" type="search" value="" aria-describedby="spec-search-devices-hint" inputmode="search" style="width:100%;max-width:20rem;min-height:44px;padding:8px;border:2px solid #0B0C0C;font:inherit;border-radius:0">
      <p style="margin:16px 0 0"><button type="button" style="min-height:44px;padding:8px 16px;border:2px solid #0B0C0C;background:#1D70B8;color:#FFFFFF;font:inherit;font-weight:700;border-radius:0">Search devices</button></p>
      </form>
      </div></article>
  spec-search-no-results:
    title: A search with no matches
    description: "A search form after a search for \"Attic radiator\". The query stays in the field so it can be changed, and a heading and a sentence say that nothing matched and that the connection is working. The button does nothing."
    height: 460
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-search-none-title"><div class="civica-card-demo__body">
      <h2 id="spec-search-none-title" style="margin:0 0 15px;font-size:22px;line-height:1.25">Devices</h2>
      <form role="search" aria-label="Devices" onsubmit="return false">
      <label for="spec-search-none-field" style="display:block;font-weight:700;margin:0 0 4px">Find a device</label>
      <input id="spec-search-none-field" name="spec-search-none-field" type="search" value="Attic radiator" style="width:100%;max-width:20rem;min-height:44px;padding:8px;border:2px solid #0B0C0C;font:inherit;border-radius:0">
      <p style="margin:16px 0 0"><button type="button" style="min-height:44px;padding:8px 16px;border:2px solid #0B0C0C;background:#1D70B8;color:#FFFFFF;font:inherit;font-weight:700;border-radius:0">Search again</button></p>
      </form>
      <h3 style="margin:24px 0 4px;font-size:19px;line-height:1.25">No matching devices</h3>
      <p style="margin:0">Check the name or try a room name. The connection is working.</p>
      </div></article>
  spec-search-combobox-list:
    title: The component search with a list of matches
    description: "A picture of the Civica component search after \"radio\" has been typed. A visible label and a hint sit above the field, three matching items follow, each with a short description, and a line below says how many matched. Nothing searches and the list does not respond."
    height: 520
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-search-combo-title"><div class="civica-card-demo__body">
      <h2 id="spec-search-combo-title" style="margin:0 0 15px;font-size:22px;line-height:1.25">Components</h2>
      <label for="spec-search-combo-field" style="display:block;font-weight:700;margin:0 0 4px">Find a component</label>
      <p id="spec-search-combo-hint" style="margin:0 0 8px;color:#484949">Type part of a name, for example radio or search</p>
      <input id="spec-search-combo-field" name="spec-search-combo-field" type="text" value="radio" aria-describedby="spec-search-combo-hint" autocomplete="off" style="width:100%;max-width:20rem;min-height:44px;padding:8px;border:2px solid #0B0C0C;font:inherit;border-radius:0">
      <ul style="list-style:none;margin:8px 0 0;padding:0;max-width:20rem;border:1px solid #CECECE">
      <li style="padding:8px;background:#E8F1F8;border-bottom:1px solid #CECECE"><strong>Radio button</strong><br><span style="color:#484949">Component. Origin: HTML5, Home Assistant</span></li>
      <li style="padding:8px;border-bottom:1px solid #CECECE"><strong>&lt;input type="radio"&gt;</strong><br><span style="color:#484949">Element in Radio button. Origin: HTML5</span></li>
      <li style="padding:8px"><strong>ha-radio-group</strong><br><span style="color:#484949">Element in Radio button. Origin: Home Assistant</span></li>
      </ul>
      <p style="margin:8px 0 0">3 results</p>
      </div></article>
  spec-section-two-sections:
    title: A dashboard view with two sections, each opened by a heading
    description: "A dashboard view in the light theme with two sections side by side. Each section opens with a Heading card that names it, then holds one card. On a narrow screen the two sections stack into one column. Home Assistant draws its own spacing and card look, so the look differs. Nothing here is interactive."
    height: 420
    html: |
      <div style="display:flex;gap:24px;flex-wrap:wrap;max-width:44rem">
      <div style="flex:1 1 15rem;min-width:0">
      <h2 style="margin:0 0 8px;font-size:22px;font-weight:700;line-height:1.45;color:#0B0C0C">Heating</h2>
      <article class="civica-card-demo" aria-label="Hallway thermostat"><div class="civica-card-demo__body"><p style="margin:0 0 8px"><strong>Hallway thermostat</strong></p><p style="margin:0">Heating to 21°C. Now 19.5°C.</p></div></article>
      </div>
      <div style="flex:1 1 15rem;min-width:0">
      <h2 style="margin:0 0 8px;font-size:22px;font-weight:700;line-height:1.45;color:#0B0C0C">Lights</h2>
      <article class="civica-card-demo" aria-label="Living-room lights"><div class="civica-card-demo__body"><p style="margin:0 0 8px"><strong>Ceiling light</strong>: On</p><p style="margin:0"><strong>Reading lamp</strong>: Off</p></div></article>
      </div>
      </div>
