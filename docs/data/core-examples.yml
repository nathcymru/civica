{
  "examples": {
    "core-accordion-troubleshooting": {
      "title": "Troubleshooting topics",
      "html": "<div class=\"civica-accordion\"><details class=\"civica-accordion__section\"><summary class=\"civica-accordion__heading\">Check power</summary><div class=\"civica-accordion__content\"><p class=\"civica-body\">Check the device display or power indicator. Follow its manufacturer’s instructions before opening a cover.</p></div></details><details class=\"civica-accordion__section\"><summary class=\"civica-accordion__heading\">Check the connection</summary><div class=\"civica-accordion__content\"><p class=\"civica-body\">Check the integration’s status in Home Assistant. A missing reading does not prove the device is off.</p></div></details></div>",
      "height": 300
    },
    "core-accordion-measures": {
      "title": "Measurement explanations",
      "html": "<div class=\"civica-accordion\"><details class=\"civica-accordion__section\"><summary class=\"civica-accordion__heading\">Power</summary><div class=\"civica-accordion__content\"><p class=\"civica-body\">Power is the rate of electricity use at a point in time. This example uses watts.</p></div></details><details class=\"civica-accordion__section\"><summary class=\"civica-accordion__heading\">Energy</summary><div class=\"civica-accordion__content\"><p class=\"civica-body\">Energy is the amount used over a period. This example uses kilowatt-hours.</p></div></details></div>",
      "height": 300
    },
    "core-cookie-choice": {
      "title": "Optional measurement choice",
      "html": "<section class=\"civica-cookie-banner\" aria-label=\"Example cookie choice\"><h2 class=\"civica-heading-m\">Optional usage measurement</h2><p class=\"civica-body\">This example shows a service that offers optional usage measurement. No analytics run in this demonstration.</p><button type=\"button\" class=\"civica-button \" data-demo-message=\"Example choice: accepted. No tracking has been enabled.\">Accept optional measurement</button> <button type=\"button\" class=\"civica-button \" data-demo-message=\"Example choice: rejected. No tracking has been enabled.\">Reject optional measurement</button><p role=\"status\" data-demo-status></p></section>",
      "height": 300
    },
    "core-cookie-confirmation": {
      "title": "Choice confirmation",
      "html": "<h2 class=\"civica-heading-m\">Your choice has been saved</h2><p class=\"civica-body\">Optional measurement is off. In a real service, this message appears only after the preference has been recorded.</p><details class=\"civica-details\"><summary class=\"civica-details__summary\"><span class=\"civica-details__summary-text\">What this choice means</span></summary><div class=\"civica-details__text\">Essential sign-in storage would remain available. You would be able to change optional choices from the service’s privacy settings.</div></details>",
      "height": 300
    },
    "core-exit-visible": {
      "title": "Departure control — demonstration only",
      "html": "<a class=\"civica-button civica-button--warning\" href=\"#example-left\">Exit this example</a><h2 class=\"civica-heading-m\">Sensitive content example</h2><p class=\"civica-body\">The real page would provide the agreed support content.</p><div id=\"example-left\" tabindex=\"-1\">Example destination. No browser history or session data has been cleared.</div>",
      "height": 300
    },
    "core-exit-keyboard": {
      "title": "Keyboard departure route",
      "html": "<a class=\"civica-skip-link\" href=\"#keyboard-destination\">Exit this example</a><p class=\"civica-body\">Tab into this example to reveal the secondary departure link. It leads to the same local destination as the visible link.</p><a class=\"civica-button civica-button--warning\" href=\"#keyboard-destination\">Exit this example</a><div id=\"keyboard-destination\" tabindex=\"-1\">Example destination only.</div>",
      "height": 300
    },
    "core-feedback-invitation": {
      "title": "Feedback after guidance",
      "html": "<h2 class=\"civica-heading-m\">Help improve this guide</h2><p class=\"civica-body\">Tell us which instruction was unclear. Do not include passwords, access tokens or private sensor history.</p><a class=\"civica-link\" href=\"#feedback-form\">Give feedback about this guide</a><form id=\"feedback-form\" data-demo-form><div class=\"civica-form-group\"><label class=\"civica-label\" for=\"feedback-detail\">What could be clearer?</label><textarea class=\"civica-textarea\" id=\"feedback-detail\" rows=\"3\" required></textarea></div><button class=\"civica-button\" type=\"submit\">Preview sending feedback</button><p role=\"status\" data-demo-status></p></form>",
      "height": 520
    },
    "core-feedback-confirmation": {
      "title": "Feedback demonstration confirmation",
      "html": "<h2 class=\"civica-heading-m\">Your example feedback is ready</h2><p class=\"civica-body\">This demonstration has not sent a message. A connected service would show its receipt and explain what happens next.</p>",
      "height": 300
    },
    "core-generic-header": {
      "title": "A household name and home link",
      "html": "<header class=\"civica-demo-header\"><a href=\"#service-home\"><strong>Morgan household</strong></a></header><main id=\"service-home\"><h2 class=\"civica-heading-m\">Household guide</h2><p class=\"civica-body\">Find the instructions for this home.</p></main>",
      "height": 300
    },
    "core-generic-header-service": {
      "title": "Household header with a task name",
      "html": "<header class=\"civica-demo-header\"><a href=\"#energy-guide\"><strong>Morgan household</strong></a><p style=\"margin-bottom:0\">Energy guide</p></header><main id=\"energy-guide\"><h2 class=\"civica-heading-m\">Understand your readings</h2><p class=\"civica-body\">Use the meter’s units and the selected period.</p></main>",
      "height": 300
    },
    "core-language-en": {
      "title": "English page",
      "html": "<nav class=\"civica-language-navigation\" aria-label=\"Language\"><ul class=\"civica-language-navigation__list\"><li class=\"civica-language-navigation__list-item\"><span class=\"civica-language-navigation__text\" aria-current=\"true\" lang=\"en\">English</span></li><li class=\"civica-language-navigation__list-item\"><a class=\"civica-language-navigation__link\" href=\"./core-language-cy.html\" rel=\"alternate\" lang=\"cy\" hreflang=\"cy\">Cymraeg</a></li></ul></nav><section lang=\"en\"><h2 class=\"civica-heading-m\">Home</h2><p class=\"civica-body\">Example</p></section>",
      "height": 300
    },
    "core-language-cy": {
      "title": "Welsh page",
      "html": "<nav class=\"civica-language-navigation\" aria-label=\"Language\"><ul class=\"civica-language-navigation__list\"><li class=\"civica-language-navigation__list-item\"><a class=\"civica-language-navigation__link\" href=\"./core-language-en.html\" rel=\"alternate\" lang=\"en\" hreflang=\"en\">English</a></li><li class=\"civica-language-navigation__list-item\"><span class=\"civica-language-navigation__text\" aria-current=\"true\" lang=\"cy\">Cymraeg</span></li></ul></nav><section lang=\"cy\"><h2 class=\"civica-heading-m\">Cartref</h2><p class=\"civica-body\">Enghraifft</p></section>",
      "height": 300
    },
    "core-phase-demo": {
      "title": "Demonstration banner",
      "html": "<article class=\"civica-card-demo\"><div class=\"civica-card-demo__body\"><p style=\"margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid #cecece\"><strong style=\"display:inline-block;margin-right:12px;padding:2px 8px;background:#d2e2f1;color:#0b0c0c;font-size:1rem;text-transform:uppercase;letter-spacing:1px\">Demo</strong><span>Values are examples. Controls do not connect to a home.</span></p><h2 style=\"font-size:1.375rem;margin:0 0 8px\">Kitchen overview</h2><p style=\"margin:0\">Temperature: 20 °C — example reading.</p></div></article>",
      "height": 300
    },
    "core-phase-trial": {
      "title": "Feature trial banner",
      "html": "<article class=\"civica-card-demo\"><div class=\"civica-card-demo__body\"><p style=\"margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid #cecece\"><strong style=\"display:inline-block;margin-right:12px;padding:2px 8px;background:#d2e2f1;color:#0b0c0c;font-size:1rem;text-transform:uppercase;letter-spacing:1px\">Trial</strong><span>This layout is being tested. Use the current settings page to make changes.</span></p><h2 style=\"font-size:1.375rem;margin:0 0 8px\">New settings layout</h2><p style=\"margin:0\">The settings page you already use is unchanged.</p></div></article>",
      "height": 300
    },
    "core-service-navigation": {
      "title": "Main household sections",
      "html": "<div style=\"background:#f3f2f1;border-bottom:1px solid #cecece;padding:0 16px\"><nav aria-label=\"Household\"><ul id=\"household-nav\" style=\"display:flex;flex-wrap:wrap;margin:0;padding:0;list-style:none\"><li style=\"margin:0 24px 0 0\"><a href=\"#household-nav-0\" aria-current=\"page\" style=\"display:block;padding:12px 0 8px;border-bottom:4px solid #1d70b8;color:#0b0c0c;font-weight:700;text-decoration:none\">Overview</a></li><li style=\"margin:0 24px 0 0\"><a href=\"#household-nav-1\" style=\"display:block;padding:12px 0 8px;border-bottom:4px solid transparent;color:#1d70b8;font-weight:400\">Energy</a></li><li style=\"margin:0 24px 0 0\"><a href=\"#household-nav-2\" style=\"display:block;padding:12px 0 8px;border-bottom:4px solid transparent;color:#1d70b8;font-weight:400\">Settings</a></li></ul></nav></div><section id=\"household-nav-0\" style=\"padding:0 16px\"><h2 style=\"margin:24px 0 8px;font-size:1.5rem;line-height:1.25;font-weight:700\">Overview</h2><p style=\"margin:0 0 16px\">Example destination for overview.</p></section><section id=\"household-nav-1\" style=\"padding:0 16px\"><h2 style=\"margin:24px 0 8px;font-size:1.5rem;line-height:1.25;font-weight:700\">Energy</h2><p style=\"margin:0 0 16px\">Example destination for energy.</p></section><section id=\"household-nav-2\" style=\"padding:0 16px\"><h2 style=\"margin:24px 0 8px;font-size:1.5rem;line-height:1.25;font-weight:700\">Settings</h2><p style=\"margin:0 0 16px\">Example destination for settings.</p></section>",
      "height": 600
    },
    "core-service-navigation-compact": {
      "title": "Compact service navigation",
      "html": "<div style=\"background:#f3f2f1;border-bottom:1px solid #cecece;padding:0 16px\"><nav aria-label=\"Household\"><ul id=\"guide-nav\" style=\"display:flex;flex-wrap:wrap;margin:0;padding:0;list-style:none\"><li style=\"margin:0 24px 0 0\"><a href=\"#guide-nav-0\" aria-current=\"page\" style=\"display:block;padding:12px 0 8px;border-bottom:4px solid #1d70b8;color:#0b0c0c;font-weight:700;text-decoration:none\">Guide</a></li><li style=\"margin:0 24px 0 0\"><a href=\"#guide-nav-1\" style=\"display:block;padding:12px 0 8px;border-bottom:4px solid transparent;color:#1d70b8;font-weight:400\">Troubleshooting</a></li></ul></nav></div><section id=\"guide-nav-0\" style=\"padding:0 16px\"><h2 style=\"margin:24px 0 8px;font-size:1.5rem;line-height:1.25;font-weight:700\">Guide</h2><p style=\"margin:0 0 16px\">Example destination for guide.</p></section><section id=\"guide-nav-1\" style=\"padding:0 16px\"><h2 style=\"margin:24px 0 8px;font-size:1.5rem;line-height:1.25;font-weight:700\">Troubleshooting</h2><p style=\"margin:0 0 16px\">Example destination for troubleshooting.</p></section>",
      "height": 450
    },
    "core-warning-delete": {
      "title": "Warning before removal",
      "html": "<h2 class=\"civica-heading-m\">Remove the example dashboard?</h2><div class=\"civica-warning-text\"><span class=\"civica-warning-text__icon\" aria-hidden=\"true\">!</span><strong class=\"civica-warning-text__text\"><span class=\"civica-visually-hidden\">Warning</span> Removing this dashboard deletes its saved layout. It does not remove devices from Home Assistant.</strong></div><button type=\"button\" class=\"civica-button civica-button--warning\" data-demo-message=\"Example only. No dashboard has been removed.\">Preview removing dashboard</button><p role=\"status\" data-demo-status></p>",
      "height": 300
    },
    "core-warning-replace": {
      "title": "Warning before replacement",
      "html": "<h2 class=\"civica-heading-m\">Replace the example configuration?</h2><div class=\"civica-warning-text\"><span class=\"civica-warning-text__icon\" aria-hidden=\"true\">!</span><strong class=\"civica-warning-text__text\"><span class=\"civica-visually-hidden\">Warning</span> Replacing the configuration overwrites the current example settings. Review the changes and keep a recoverable copy first.</strong></div><p class=\"civica-body\">This is a reference screen. It cannot read or replace a configuration.</p>",
      "height": 300
    },
    "system-example-reading": {
      "title": "A labelled reading",
      "html": "<h2 class=\"civica-heading-m\">Living room temperature</h2><p class=\"civica-body\"><strong>20 °C</strong> — reported reading.</p><p class=\"civica-body\">Reported on <time datetime=\"2026-11-11T14:30:00+00:00\">11 November 2026 at 14:30 GMT</time> (Europe/London).</p>",
      "height": 300,
      "description": "A temperature with its source observation date and time, rather than an unspecified display update."
    },
    "system-example-interactive": {
      "title": "A local demonstration action",
      "html": "<h2 class=\"civica-heading-m\">Preview a saved preference</h2><button type=\"button\" class=\"civica-button \" data-demo-message=\"Example preference saved in this preview only. No household setting changed.\">Preview saving</button><p role=\"status\" data-demo-status></p>",
      "height": 300
    },
    "system-history-expanded": {
      "title": "A guide with an update",
      "html": "<article class=\"civica-card-demo\" aria-label=\"Example publication details\"><div class=\"civica-card-demo__body\"><h2 style=\"font-size:1.375rem;margin:0 0 8px\">Example heating guide</h2><p style=\"margin:0 0 12px\">Published <time datetime=\"2026-10-01\">1 October 2026</time><br>Last updated <time datetime=\"2026-11-01\">1 November 2026</time></p><details><summary style=\"min-height:44px;padding-block:10px;color:#1d70b8;cursor:pointer\">See all updates</summary><ol style=\"margin:8px 0 0;padding-left:20px\"><li style=\"margin-bottom:8px\"><time datetime=\"2026-11-01\">1 November 2026</time><p style=\"margin:0\">Clarified how to identify the active schedule.</p></li><li><time datetime=\"2026-10-01\">1 October 2026</time><p style=\"margin:0\">First published.</p></li></ol></details></div></article>",
      "height": 300
    },
    "system-history-correction": {
      "title": "A corrected guide",
      "html": "<article class=\"civica-card-demo\" aria-label=\"Example publication details\"><div class=\"civica-card-demo__body\"><h2 style=\"font-size:1.375rem;margin:0 0 8px\">Example meter guide</h2><p style=\"margin:0 0 12px\">Published <time datetime=\"2026-10-01\">1 October 2026</time><br>Last updated <time datetime=\"2026-11-01\">1 November 2026</time></p><details><summary style=\"min-height:44px;padding-block:10px;color:#1d70b8;cursor:pointer\">See all updates</summary><ol style=\"margin:8px 0 0;padding-left:20px\"><li style=\"margin-bottom:8px\"><time datetime=\"2026-11-01\">1 November 2026</time><p style=\"margin:0\">Corrected the unit in the example from W to kW.</p></li><li><time datetime=\"2026-10-01\">1 October 2026</time><p style=\"margin:0\">First published.</p></li></ol></details></div></article>",
      "height": 300,
      "description": "An update note identifies the correction instead of saying only “Updated”."
    },
    "core-cookie-essential": {
      "title": "An essential-only cookie notice",
      "description": "The documentation notice uses this markup. Hiding this isolated example does not save a cookie.",
      "html": "<section class=\"civica-cookie-banner c-site-notice\" data-site-notice=\"example\" data-docs-home=\"../index.html\" data-nosnippet role=\"region\" aria-labelledby=\"site-notice-heading\">\n  <div class=\"civica-cookie-banner__message c-container\">\n    <div class=\"civica-grid-row\">\n      <div class=\"civica-grid-column-two-thirds\">\n        <h2 id=\"site-notice-heading\" class=\"civica-cookie-banner__heading civica-heading-m\">Cookies on Civica</h2>\n        <div class=\"civica-cookie-banner__content\">\n          <p class=\"civica-body\">We respect your privacy and only use essential cookies to make this site work—never for tracking or advertising.</p>\n        </div>\n      </div>\n    </div>\n    <div class=\"civica-button-group\">\n      <button type=\"button\" class=\"civica-button\" data-site-notice-dismiss hidden>Hide this notice</button>\n      <a class=\"civica-link\" data-site-cookies href=\"../community/cookies.html\">Learn more about cookies</a>\n    </div>\n  </div>\n</section>\n<p class=\"civica-body c-container c-site-notice-status\" data-site-notice-status role=\"status\" tabindex=\"-1\" hidden></p>",
      "height": 490
    }
  }
}
