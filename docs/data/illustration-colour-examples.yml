      <title id="ill-pairing-overlap-t">Illustration: sun over a house</title>
      <desc id="ill-pairing-overlap-d">A Primary yellow sun overlaps a Primary blue house. Where they overlap, the house is Blue shade 25%.</desc>
      <defs>
      <clipPath id="ill-pairing-sun">
      <circle cx="560" cy="200" r="150"/>
      </clipPath>
      </defs>
      <rect width="800" height="500" fill="#FFFFFF"/>
      <circle cx="560" cy="200" r="150" fill="#FFDD00"/>
      <path d="M220 250 L400 110 L580 250 L580 430 L220 430 Z" fill="#1D70B8"/>
      <path d="M220 250 L400 110 L580 250 L580 430 L220 430 Z" fill="#16548A" clip-path="url(#ill-pairing-sun)"/>
      </svg>
      <figcaption class="govuk-body-s" id="ill-pairing-overlap-c" style="margin-top:10px">
      <strong>Complementary colours: where they overlap, the blue is darker</strong>
      <br>Colours: Primary yellow, Primary blue, Blue shade 25%, White.</figcaption>
      </figure>
      <figure style="margin:0" aria-labelledby="ill-pairing-shades-c">
