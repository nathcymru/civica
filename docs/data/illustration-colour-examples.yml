      <rect x="140" y="450" width="40" height="30" fill="#1D70B8" stroke="#0F385C" stroke-width="2"/>
      <rect x="190" y="450" width="40" height="30" fill="#16548A" stroke="#0F385C" stroke-width="2"/>
      <rect x="240" y="450" width="40" height="30" fill="#0F385C" stroke="#0F385C" stroke-width="2"/>
