examples:
  illustration-colour-applying:
    title: A connected home in Primary blue with accents
    description: An original Home Assistant illustration that uses Primary blue as its base and Accent teal and Accent blue to highlight a sensor and its signal.
    height: 640
    html: |
      <section aria-labelledby="ill-applying-h">
      <h2 class="govuk-heading-m" id="ill-applying-h">Applying colour</h2>
      <p class="govuk-body">Primary blue is the base of the illustration. Accent teal and Accent blue highlight the sensor, which is the key component.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:960px">
      <figure style="margin:0" aria-labelledby="ill-applying-c">
      <svg viewBox="0 0 800 500" role="img" aria-labelledby="ill-applying-t ill-applying-d" style="display:block;width:100%;height:auto">
      <title id="ill-applying-t">Illustration: a connected home</title>
      <desc id="ill-applying-d">A Primary blue house with Blue shade 50% windows and door. A sensor on the front of the house is highlighted in Accent teal, and Accent blue signal arcs come from an Accent teal hub beside it.</desc>
      <rect width="800" height="500" fill="#FFFFFF"/>
      <path d="M220 250 L400 110 L580 250 L580 430 L220 430 Z" fill="#1D70B8"/>
      <rect x="360" y="330" width="80" height="100" fill="#0F385C"/>
      <rect x="260" y="280" width="70" height="60" fill="#0F385C"/>
      <rect x="470" y="280" width="70" height="60" fill="#0F385C"/>
      <path d="M640 150a60 60 0 0 1 60 60M640 110a100 100 0 0 1 100 100" fill="none" stroke="#11E0F1" stroke-width="16" stroke-linecap="round"/>
      <circle cx="640" cy="210" r="22" fill="#00FFE0"/>
      <circle cx="400" cy="230" r="34" fill="#00FFE0"/>
      <circle cx="400" cy="230" r="14" fill="#0F385C"/>
      </svg>
      <figcaption class="govuk-body-s" id="ill-applying-c" style="margin-top:10px">
      <strong>Primary blue as the base, accents for the key component</strong>
      <br>Colours: Primary blue, Blue shade 50%, Accent teal, Accent blue, White.</figcaption>
      </figure>
      </div>
      </section>
