      <desc id="ill-pairing-shades-d">A house drawn in 5 shades of blue, from the lightest sky to the darkest door: Blue tint 80% sky, Blue tint 50% hill, Primary blue house, Blue shade 25% roof and Blue shade 50% door and windows. A key of the 5 shades sits in the corner.</desc>
