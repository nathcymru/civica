  illustration-colour-pairing:
    title: Colour pairing in a Home Assistant illustration
    description: 'Two original illustrations: a yellow sun overlapping a blue house, and a house drawn in 5 shades of blue.'
    height: 640
    html: |
      <section aria-labelledby="ill-pairing-h">
      <h2 class="govuk-heading-m" id="ill-pairing-h">Colour pairing</h2>
      <p class="govuk-body">Complementary colours keep key elements distinct. Shades of one colour separate the foreground from the background, so that the image does not look flat.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:960px">
      <figure style="margin:0" aria-labelledby="ill-pairing-overlap-c">
