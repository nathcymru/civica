# data. Simulated cards and forms; no live actions.
examples:
  spec-advice-dashboard:
    title: 'Maintain a shared dashboard'
    description: 'Advice for a household dashboard, written as a Do list and a Do not list. Each item makes sense read on its own, and the tick and cross are decorative.'
    height: 470
    html: '<section class="civica-do-list"><h2 class="civica-heading-m">Do</h2><ul class="civica-list"><li><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24"><path d="M4 12L9 17L20 6" fill="none" stroke="currentColor" stroke-width="3"></path></svg> Use room names the household recognises</li><li><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24"><path d="M4 12L9 17L20 6" fill="none" stroke="currentColor" stroke-width="3"></path></svg> Check the dashboard on a small screen</li></ul></section><section class="civica-dont-list"><h2 class="civica-heading-m">Do not</h2><ul class="civica-list"><li><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3"></path></svg> Do not remove the text that explains an unavailable device</li><li><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3"></path></svg> Do not use colour as the only status indicator</li></ul></section>'
  spec-advice-notes:
    title: 'Write useful household notes'
    description: 'A single Do not list on a help page about household notes. A single list is acceptable when there is no useful opposing set. Nothing here is connected to a home.'
    height: 340
    html: '<section class="civica-dont-list"><h2 class="civica-heading-m">Do not</h2><ul class="civica-list"><li><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3"></path></svg> Do not put account passwords in dashboard notes</li><li><svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24"><path d="M5 5L19 19M19 5L5 19" fill="none" stroke="currentColor" stroke-width="3"></path></svg> Do not describe a command request as a confirmed device state</li></ul></section>'
  spec-document-root-limits:
    title: 'What a dashboard author can and cannot change'
    description: 'A Markdown card on a help view that lists what a dashboard author can change and what Home Assistant controls.'
    height: 420
    html: '<article class="civica-card-demo" aria-labelledby="spec-dr-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-dr-title">Your page and the app around it</h2><h3 class="civica-heading-s">You can change</h3><ul class="civica-list civica-list--bullet"><li>The cards on a view and the words in them</li><li>The theme colours, through your theme</li><li>The look of one card, with the card-mod integration</li></ul><h3 class="civica-heading-s">Home Assistant controls</h3><ul class="civica-list civica-list--bullet"><li>The page title in the browser tab</li><li>The language and direction of the page</li><li>The page head, scripts and styles</li></ul></div></article>'
  spec-sidebar-expanded:
    title: 'The expanded sidebar'
    description: 'An expanded sidebar using the Civica light theme colours: a white panel, dark text, grey icons and a blue selected row with a pale tint. Overview is the current page. The Settings row shows a count for updates and repairs, and the Notifications row shows a count of notifications. The rows do nothing here.'
    height: 380
    html: '<nav aria-label="Sidebar example" style="max-width:256px;background:#FFFFFF;border:1px solid #CECECE"><div style="padding:12px;color:#0B0C0C;font-weight:700;border-bottom:1px solid #CECECE">Home Assistant</div><ul style="list-style:none;margin:0;padding:8px 0"><li style="margin:0;padding:8px 12px;display:flex;align-items:center;gap:12px;background:#f4f8fb;color:#19578D;font-weight:700;"><span aria-hidden="true" style="color:#19578D">&#9632;</span><span style="flex:1">Overview</span></li><li style="margin:0;padding:8px 12px;display:flex;align-items:center;gap:12px;color:#0B0C0C;"><span aria-hidden="true" style="color:#484949">&#9632;</span><span style="flex:1">Energy</span></li><li style="margin:0;padding:8px 12px;display:flex;align-items:center;gap:12px;color:#0B0C0C;"><span aria-hidden="true" style="color:#484949">&#9632;</span><span style="flex:1">Map</span></li><li style="margin:0;padding:8px 12px;display:flex;align-items:center;gap:12px;color:#0B0C0C;"><span aria-hidden="true" style="color:#484949">&#9632;</span><span style="flex:1">Logbook</span></li></ul><ul style="list-style:none;margin:0;padding:8px 0;border-top:1px solid #CECECE"><li style="margin:0;padding:8px 12px;display:flex;align-items:center;gap:12px;color:#0B0C0C;"><span aria-hidden="true" style="color:#484949">&#9632;</span><span style="flex:1">Settings</span><span style="background:#1D70B8;color:#fff;border-radius:12px;padding:0 8px;font-size:0.875rem">2</span></li><li style="margin:0;padding:8px 12px;display:flex;align-items:center;gap:12px;color:#0B0C0C;"><span aria-hidden="true" style="color:#484949">&#9632;</span><span style="flex:1">Notifications</span><span style="background:#1D70B8;color:#fff;border-radius:12px;padding:0 8px;font-size:0.875rem">1</span></li><li style="margin:0;padding:8px 12px;display:flex;align-items:center;gap:12px;color:#0B0C0C;"><span aria-hidden="true" style="color:#484949">&#9632;</span><span style="flex:1">Sam Okafor</span></li></ul></nav>'
  spec-select-theme:
    title: 'Choose a saved theme colour'
    description: 'A native select with a visible label and a hint, showing the saved choice. The seven theme colours are listed by name.'
    height: 340
    html: '<form data-demo-form><div class="civica-form-group"><label class="civica-label" for="palette-choice">Theme colour</label><div class="civica-hint" id="palette-choice-hint">Choose the colour used across your dashboards</div><select class="civica-select" id="palette-choice" name="palette-choice" aria-describedby="palette-choice-hint"><option selected>Blue</option><option>Green</option><option>Teal</option><option>Purple</option><option>Magenta</option><option>Red</option><option>Black</option></select></div></form>'
  spec-select-error:
    title: 'An unanswered required choice'
    description: 'A native select with an error. The first option is a placeholder that asks for a choice, so it cannot be mistaken for a saved dashboard. The error message is written in words above the field.'
    height: 340
    html: '<form data-demo-form><div class="civica-form-group civica-form-group--error"><label class="civica-label" for="default-dashboard">Default dashboard</label><p class="civica-error-message" id="default-dashboard-error"><span class="civica-visually-hidden">Error:</span> Choose a default dashboard</p><select class="civica-select civica-select--error" id="default-dashboard" name="default-dashboard" aria-invalid="true" aria-describedby="default-dashboard-error"><option value="" selected>Choose a dashboard</option><option>Overview</option><option>Energy</option><option>Housework</option></select></div></form>'
  spec-overflow-menu:
    title: 'An overflow menu on an automation row'
    description: 'An automation row with a three-dot button and its open menu. The button is named for what it opens, the risky item is last, and its words say it deletes.'
    height: 330
    html: '<article class="civica-card-demo" aria-labelledby="spec-om-title"><div class="civica-card-demo__body"><div class="civica-card-demo__heading-row"><h2 class="civica-heading-m" id="spec-om-title">Evening lights</h2><button type="button" class="civica-button civica-button--secondary" aria-label="More actions for Evening lights" aria-expanded="true">&#8942;</button></div><p class="civica-body">Turns on the living room lights at sunset.</p><ul style="list-style:none;margin:0;padding:4px 0;border:1px solid #CECECE;max-width:16rem"><li style="padding:8px 12px">Rename</li><li style="padding:8px 12px">Duplicate</li><li style="padding:8px 12px;border-top:1px solid #CECECE;color:#CA3535;font-weight:700">Delete automation</li></ul></div></article>'
  spec-duration-field:
    title: 'A duration field with a worked value'
    description: 'A duration field with one label, three number boxes marked hh, mm and ss, and helper text that spells the units out and gives a worked value.'
    height: 330
    html: '<article class="civica-card-demo" aria-labelledby="spec-du-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-du-title">Hot water boost</h2><div class="civica-form-group"><span class="civica-label" id="spec-du-label">Boost length</span><div class="civica-hint" id="spec-du-hint">Hours (hh), minutes (mm) and seconds (ss). For example, 1 hour 30 minutes is 01, 30, 00.</div><div role="group" aria-labelledby="spec-du-label" aria-describedby="spec-du-hint" style="display:flex;gap:12px"><label>hh <input class="civica-input civica-input--width-3" type="number" value="1" inputmode="numeric"></label><label>mm <input class="civica-input civica-input--width-3" type="number" value="30" inputmode="numeric"></label><label>ss <input class="civica-input civica-input--width-3" type="number" value="0" inputmode="numeric"></label></div></div></div></article>'
  spec-embed-fallback:
    title: 'A webpage that cannot be shown'
    description: 'A Webpage card whose page is blocked. It names the page, says what it shows and gives an ordinary link, so a blank frame is never the only message.'
    height: 330
    html: '<article class="civica-card-demo" aria-labelledby="spec-em-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-em-title">Water supplier outage map</h2><p class="civica-body">This page cannot be shown inside the dashboard. It shows planned and current water outages for your area.</p><p class="civica-body"><a class="civica-link" href="https://example.com/">Open the outage map in a new window (leaves Home Assistant)</a></p></div></article>'
  spec-empty-state-card:
    title: 'An empty state with a next step'
    description: 'An empty state card on a view with no lights: a lightbulb icon, a title, one sentence saying why the view is empty and a button for the next step.'
    height: 380
    html: '<article class="civica-card-demo" aria-labelledby="spec-es-title"><div class="civica-card-demo__body" style="text-align:center"><p aria-hidden="true" style="margin:0;color:#484949"><svg width="48" height="48" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path fill="currentColor" d="M12,2A7,7 0 0,0 5,9C5,11.38 6.19,13.47 8,14.74V17A1,1 0 0,0 9,18H15A1,1 0 0,0 16,17V14.74C17.81,13.47 19,11.38 19,9A7,7 0 0,0 12,2M9,21A1,1 0 0,0 10,22H14A1,1 0 0,0 15,21V20H9V21Z"/></svg></p><h2 class="civica-heading-m" id="spec-es-title">No lights on this view yet</h2><p class="civica-body" style="color:#484949">Nothing is wrong. Add a light to see it here.</p><p class="civica-card-demo__actions"><button type="button" class="civica-button">Add a light</button></p></div></article>'
  spec-starting-card:
    title: 'Home Assistant is starting'
    description: 'A stand-in for the starting screen that Home Assistant shows while it starts. It has a spinner and one sentence saying what is happening. You do not add this card yourself. The spinner is a still shape here.'
    height: 300
    html: '<article class="civica-card-demo" aria-labelledby="spec-st-title"><div class="civica-card-demo__body" style="text-align:center"><p aria-hidden="true" style="font-size:2.5rem;margin:0;color:#1D70B8">&#9684;</p><h2 class="civica-heading-s" id="spec-st-title">Home Assistant is starting, please wait…</h2></div></article>'
