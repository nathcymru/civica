# Synthetic data: invented rooms, readings and zones. Buttons and links do nothing.
examples:
  spec-list-room-order:
    title: A room order list with buttons instead of dragging
    description: "A simulated list of three rooms in the order they appear on the overview. Each row has the room name and Move up, Move down and Hide buttons, so the order can change without dragging. Home Assistant’s own editor draws a drag handle and an eye button, and it also lets you move a row with the keyboard. The buttons do nothing here."
    height: 470
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-list-title"><div class="civica-card-demo__body"><h2 id="spec-list-title" style="font-size:1.5rem;line-height:1.25;font-weight:700;margin:0 0 8px">Room order</h2><p style="margin:0 0 16px">Rooms appear on the overview in this order.</p><ol role="list" style="list-style:none;margin:0;padding:0;border-top:1px solid #CECECE"><li style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 0;border-bottom:1px solid #CECECE"><span><strong>1.</strong> Living room</span><span style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" disabled style="font:inherit;padding:6px 12px;border:2px solid #505A5F;background:#fff;color:#505A5F">Move up</button><button type="button" aria-label="Move Living room down" style="font:inherit;padding:6px 12px;border:2px solid #0B0C0C;background:#fff;color:#0B0C0C">Move down</button><button type="button" aria-label="Hide Living room" style="font:inherit;padding:6px 12px;border:2px solid #0B0C0C;background:#fff;color:#0B0C0C">Hide</button></span></li><li style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 0;border-bottom:1px solid #CECECE"><span><strong>2.</strong> Kitchen</span><span style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" aria-label="Move Kitchen up" style="font:inherit;padding:6px 12px;border:2px solid #0B0C0C;background:#fff;color:#0B0C0C">Move up</button><button type="button" aria-label="Move Kitchen down" style="font:inherit;padding:6px 12px;border:2px solid #0B0C0C;background:#fff;color:#0B0C0C">Move down</button><button type="button" aria-label="Hide Kitchen" style="font:inherit;padding:6px 12px;border:2px solid #0B0C0C;background:#fff;color:#0B0C0C">Hide</button></span></li><li style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 0;border-bottom:1px solid #CECECE"><span><strong>3.</strong> Bedroom</span><span style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" aria-label="Move Bedroom up" style="font:inherit;padding:6px 12px;border:2px solid #0B0C0C;background:#fff;color:#0B0C0C">Move up</button><button type="button" disabled style="font:inherit;padding:6px 12px;border:2px solid #505A5F;background:#fff;color:#505A5F">Move down</button><button type="button" aria-label="Hide Bedroom" style="font:inherit;padding:6px 12px;border:2px solid #0B0C0C;background:#fff;color:#0B0C0C">Hide</button></span></li></ol></div></article>
  spec-logbook-empty:
    title: An Activity card with nothing to show
    description: "A simulated Activity card (the Home Assistant card of type logbook) for the garage door. The title says the period, and the list area holds Home Assistant’s own words, “No activity found.”, because nothing happened in the last 24 hours. The “Show more” link goes nowhere here."
    height: 330
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-logbook-title"><div class="civica-card-demo__body"><div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px"><h2 id="spec-logbook-title" style="font-size:1.5rem;line-height:1.25;font-weight:700;margin:0">Garage door, last 24 hours</h2><a href="#spec-logbook-title" style="color:#1D70B8">Show more<span style="position:absolute;left:-9999px"> garage door activity</span></a></div><div style="margin-top:16px;border-top:1px solid #CECECE;min-height:96px;display:flex;align-items:center"><p style="margin:0">No activity found.</p></div></div></article>
  spec-main-guide-page:
    title: A household guide page with its regions labelled
    description: "A simulated standalone household guide page with its three regions outlined and named: the header with the page navigation, the main content with the page heading and two sections, and the footer. The labels are only annotations. Home Assistant dashboards do not give an author these regions."
    height: 640
    html: |
      <div style="max-width:40rem;font-family:inherit">
      <header style="border:2px dashed #505A5F;padding:12px 16px;margin-bottom:12px"><p style="margin:0 0 8px;font-weight:700">Header</p><nav aria-label="Guide sections"><a href="#spec-main-rooms" style="color:#1D70B8;margin-right:16px">Rooms</a><a href="#spec-main-energy" style="color:#1D70B8">Energy</a></nav></header>
      <main id="spec-main-content" tabindex="-1" style="border:2px solid #0B0C0C;padding:12px 16px;margin-bottom:12px"><p style="margin:0 0 8px;font-weight:700">Main content</p><h1 style="font-size:2rem;line-height:1.2;margin:0 0 16px">Home overview</h1><section aria-labelledby="spec-main-rooms"><h2 id="spec-main-rooms" style="font-size:1.5rem;margin:0 0 4px">Rooms</h2><p style="margin:0 0 16px">Living room, kitchen and bedroom.</p></section><section aria-labelledby="spec-main-energy"><h2 id="spec-main-energy" style="font-size:1.5rem;margin:0 0 4px">Energy</h2><p style="margin:0">Today so far: 6.4 kWh.</p></section></main>
      <footer style="border:2px dashed #505A5F;padding:12px 16px"><p style="margin:0"><strong>Footer</strong>: Morgan household guide, last updated 24 November 2026.</p></footer>
      </div>
  spec-map-zones-card:
    title: A map card showing three household zones
    description: "A simulated Map card: a drawn coastline stands in for the map, with three invented zones as circles with their names written beside them. A table under the drawing lists the same zones. The drawing cannot be moved or zoomed, and a zone does not show that anyone is there."
    height: 900
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-map-title"><div class="civica-card-demo__body"><h2 id="spec-map-title" style="font-size:1.5rem;line-height:1.25;font-weight:700;margin:0 0 12px">Household zones</h2><figure style="margin:0"><svg viewBox="0 0 640 400" role="img" aria-labelledby="spec-map-svg-title spec-map-svg-desc" style="display:block;width:100%;height:auto;font-family:Roboto,Helvetica Neue,Helvetica,Arial,sans-serif"><title id="spec-map-svg-title">Map of three household zones on a coastline</title><desc id="spec-map-svg-desc">Land fills the left and top of the map and the sea is at the bottom right. The Home zone is near the coast, the Work zone is inland to the north-west, and the School zone is between them. The table below lists every zone.</desc><rect width="640" height="400" fill="#F3F9F9"/><path d="M0 0H640V96C590 120 560 176 500 196C440 216 420 268 360 300C300 332 250 330 210 368C190 386 176 400 176 400H0Z" fill="none" stroke="#D0E6E7" stroke-width="16" stroke-linejoin="round"/><path d="M0 0H640V96C590 120 560 176 500 196C440 216 420 268 360 300C300 332 250 330 210 368C190 386 176 400 176 400H0Z" fill="#F3F3F3" stroke="#CECECE" stroke-width="1"/><circle cx="340" cy="250" r="24" fill="#66F39E" stroke="#0F7A52" stroke-width="2"/><circle cx="150" cy="110" r="36" fill="#66F39E" stroke="#0F7A52" stroke-width="2"/><circle cx="250" cy="196" r="19" fill="#66F39E" stroke="#0F7A52" stroke-width="2"/><text x="340" y="306" font-size="28" font-weight="700" fill="#0B0C0C" text-anchor="middle">Home</text><text x="150" y="178" font-size="28" font-weight="700" fill="#0B0C0C" text-anchor="middle">Work</text><text x="250" y="246" font-size="28" font-weight="700" fill="#0B0C0C" text-anchor="middle">School</text><text x="520" y="330" font-size="28" fill="#0B0C0C" text-anchor="middle">Sea</text></svg><figcaption style="margin-top:8px">3 invented zones on an invented coastline. Each circle is drawn in proportion to the zone’s radius.</figcaption></figure><div tabindex="0" role="region" aria-label="All 3 zones, scroll sideways if needed" style="overflow:auto;margin-top:16px"><table style="border-collapse:collapse;width:100%"><caption style="text-align:left;font-weight:700;padding-bottom:8px">All 3 zones</caption><thead><tr><th scope="col" style="text-align:left;padding:8px;border-bottom:2px solid #0B0C0C">Zone</th><th scope="col" style="text-align:left;padding:8px;border-bottom:2px solid #0B0C0C">Where it is</th><th scope="col" style="text-align:right;padding:8px;border-bottom:2px solid #0B0C0C">Radius (metres)</th></tr></thead><tbody><tr><th scope="row" style="text-align:left;padding:8px;border-bottom:1px solid #CECECE">Home</th><td style="padding:8px;border-bottom:1px solid #CECECE">Near the coast</td><td style="padding:8px;border-bottom:1px solid #CECECE;text-align:right">100</td></tr><tr><th scope="row" style="text-align:left;padding:8px;border-bottom:1px solid #CECECE">Work</th><td style="padding:8px;border-bottom:1px solid #CECECE">Inland, to the north-west</td><td style="padding:8px;border-bottom:1px solid #CECECE;text-align:right">150</td></tr><tr><th scope="row" style="text-align:left;padding:8px;border-bottom:1px solid #CECECE">School</th><td style="padding:8px;border-bottom:1px solid #CECECE">Between Home and Work</td><td style="padding:8px;border-bottom:1px solid #CECECE;text-align:right">80</td></tr></tbody></table></div></div></article>
  spec-mark-schedule-change:
    title: A help card that highlights the part that changed
    description: "A simulated help card about a heating schedule. One time is highlighted with the mark element, and the sentence after it says what the highlight means, so the meaning does not depend on the yellow ground."
    height: 330
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-mark-title"><div class="civica-card-demo__body"><h2 id="spec-mark-title" style="font-size:1.5rem;line-height:1.25;font-weight:700;margin:0 0 12px">Heating schedule changed</h2><p style="margin:0 0 12px">The evening heating now starts at <mark>5pm</mark> instead of 6pm.</p><p style="margin:0">The highlighted time is the part that changed. Everything else in the schedule is the same.</p></div></article>
  spec-markdown-card-away-guide:
    title: A Markdown card with a guide for going away
    description: "A simulated Markdown card with a heading, a short paragraph, a list and a table that is named in the line above it. It uses only what the card keeps: no ids, classes, labels or captions. The link text says what it opens."
    height: 700
    html: |
      <article class="civica-card-demo"><div class="civica-card-demo__body"><h2 style="font-size:1.5rem;line-height:1.25;font-weight:700;margin:0 0 12px">Before you go away</h2><p style="margin:0 0 12px">Check these things the evening before. <a href="#" style="color:#1D70B8">Read the away guide (opens in a new window)</a>.</p><ul style="margin:0 0 12px;padding-left:1.5rem"><li>Set the heating to Away.</li><li>Close the garage door.</li><li>Check that the back door is locked.</li></ul><p style="margin:0 0 8px"><strong>Heating while you are away</strong></p><div style="overflow:auto"><table style="border-collapse:collapse;width:100%"><thead><tr><th style="text-align:left;padding:4px 8px;border:1px solid #CECECE">Room</th><th style="text-align:right;padding:4px 8px;border:1px solid #CECECE">Temperature (°C)</th></tr></thead><tbody><tr><td style="padding:4px 8px;border:1px solid #CECECE">Living room</td><td style="padding:4px 8px;border:1px solid #CECECE;text-align:right">14</td></tr><tr><td style="padding:4px 8px;border:1px solid #CECECE">Bedroom</td><td style="padding:4px 8px;border:1px solid #CECECE;text-align:right">12</td></tr></tbody></table></div><p style="margin:12px 0 0">Ask Sam if anything looks wrong.</p></div></article>
  spec-math-energy-sum:
    title: A help card with a worked energy sum
    description: "A simulated help card. The sum is written in words first, then as a formula in MathML, then with the real figures. If the formula does not draw, the words and the last line still give the answer."
    height: 520
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-math-title"><div class="civica-card-demo__body"><h2 id="spec-math-title" style="font-size:1.5rem;line-height:1.25;font-weight:700;margin:0 0 12px">Working out energy used</h2><p style="margin:0 0 12px">Energy used is power multiplied by time. Power is in kilowatts (kW), time is in hours (h) and energy is in kilowatt-hours (kWh).</p><math display="block" style="margin:0 0 12px"><mrow><mi>E</mi><mo>=</mo><mi>P</mi><mo>×</mo><mi>t</mi></mrow></math><p style="margin:0 0 12px">A 2 kW heater that runs for 3 hours:</p><math display="block" style="margin:0 0 12px"><mrow><mn>2</mn><mtext> kW</mtext><mo>×</mo><mn>3</mn><mtext> h</mtext><mo>=</mo><mn>6</mn><mtext> kWh</mtext></mrow></math><p style="margin:0">The heater uses 6 kWh.</p></div></article>
