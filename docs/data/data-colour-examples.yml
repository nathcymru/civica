0C0C">Thu</text><text x="174" y="255" text-anchor="middle" font-size="12" fill="#0B0C0C">12</text><rect data-label="Fri 13" data-value="10.3" x="201" y="98.4" width="26" height="123.6" fill="#1D70B8"/><text x="214" y="93.4" text-anchor="middle" font-size="12" fill="#0B0C0C">10.3</text><text x="214" y="240" text-anchor="middle" font-size="12" fill="#0B0C0C">Fri</text><text x="214" y="255" text-anchor="middle" font-size="12" fill="#0B0C0C">13</text><rect data-label="Sat 14" data-value="12.7" x="241" y="69.6" width="26" height="152.4" fill="#1D70B8"/><text x="254" y="64.6" text-anchor="middle" font-size="12" fill="#0B0C0C">12.7</text><text x="254" y="240" text-anchor="middle" font-size="12" fill="#0B0C0C">Sat</text><text x="254" y="255" text-anchor="middle" font-size="12" fill="#0B0C0C">14</text><rect data-label="Sun 15" data-value="11.2" x="281" y="87.6" width="26" height="134.4" fill="#1D70B8"/><text x="294" y="82.6" text-anchor="middle" font-size="12" fill="#0B0C0C">11.2</text><text x="294" y="240" text-anchor="middle" font-size="12" fill="#0B0C0C">Sun</text><text x="294" y="255" text-anchor="middle" font-size="12" fill="#0B0C0C">15</text></g></svg>
      </figure>
      <p class="govuk-body">Energy is a quantity over a period (kWh), not power at a moment (W). Each bar is one complete day. The value is printed above each bar, so the reading does not depend on the bar colour.</p>
