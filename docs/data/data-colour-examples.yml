vuk-table__cell">18.7</td><td class="govuk-table__cell">17.0</td><td class="govuk-table__cell">20.6</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">18:00</th><td class="govuk-table__cell">21.8</td><td class="govuk-table__cell">21.0</td><td class="govuk-table__cell">17.6</td><td class="govuk-table__cell">18.1</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">21:00</th><td class="govuk-table__cell">21.4</td><td class="govuk-table__cell">19.8</td><td class="govuk-table__cell">18.2</td><td class="govuk-table__cell">16.6</td></tr></tbody></table></div>
      <p class="govuk-body">Source: invented values for this example. Entity IDs: <code>sensor.living_room_temperature</code>, <code>sensor.kitchen_temperature</code>, <code>sensor.bedroom_temperature</code>, <code>sensor.study_temperature</code>.</p>
