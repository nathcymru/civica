      <h2 class="govuk-heading-m" id="categorical-heading">Four rooms keep their colours in light and dark mode</h2>
      <p class="govuk-body">
      <strong>Synthetic data, not readings from a Home Assistant instance.</strong> Relative humidity reported by four room sensors every 3 hours on Thursday 12 November 2026, Europe/London. The rooms take <code>civica-chart-1</code> to <code>civica-chart-4</code> in the order they are listed, as a History graph card colours them. The colours are the same in light and dark mode.</p>
