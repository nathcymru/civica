      <text x="148" y="14" text-anchor="middle" font-size="12" fill="#0B0C0C">Fri</text>
      <text x="180" y="14" text-anchor="middle" font-size="12" fill="#0B0C0C">Sat</text>
      <text x="212" y="14" text-anchor="middle" font-size="12" fill="#0B0C0C">Sun</text>
      <text x="4" y="32" text-anchor="start" font-size="12" fill="#0B0C0C">Living room</text>
