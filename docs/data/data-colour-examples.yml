    description: Four synthetic room temperatures over a day, each with its own categorical chart colour, its own line style and an end label, with the legend on top and a matching table.
    height: 1650
    html: |-
      <section aria-labelledby="multiple-heading">
      <h2 class="govuk-heading-m" id="multiple-heading">Multiple categories: four rooms over one day</h2>
      <p class="govuk-body"><strong>Synthetic data, not readings from a Home Assistant instance.</strong> Temperature reported by four room sensors every 3 hours on Thursday 12 November 2026, Europe/London.</p>
      <figure style="margin:0 0 30px;">
      <figcaption class="govuk-heading-s">Room temperatures, 12 November 2026 (°C)</figcaption>
      <svg role="img" aria-labelledby="multiple-title multiple-desc" viewBox="0 0 320 262" style="display:block;width:100%;max-width:480px;height:auto;font-family:Arial,Helvetica,sans-serif;" data-chart="multiple"><title id="multiple-title">Line chart of four room temperatures in degrees Celsius over one day</title><desc id="multiple-desc">The living room is a solid line, the kitchen dashed, the bedroom dotted and the study dash-dot. The living room and study are coolest around 06:00 and the kitchen at 03:00; the bedroom is coolest at 15:00. At 21:00 the living room is warmest at 21.4 °C and the study coolest at 16.6 °C. The table below gives every reading.</desc>
      <g aria-hidden="true"><line x1="0" y1="10" x2="28" y2="10" stroke="#1D70B8" stroke-width="3"/><text x="34" y="14" font-size="12" fill="#0B0C0C">Living room</text><line x1="160" y1="10" x2="188" y2="10" stroke="#CA357C" stroke-width="3" stroke-dasharray="8 4"/><text x="194" y="14" font-size="12" fill="#0B0C0C">Kitchen</text><line x1="0" y1="30" x2="28" y2="30" stroke="#50A1A5" stroke-width="3" stroke-dasharray="2 3"/><text x="34" y="34" font-size="12" fill="#0B0C0C">Bedroom</text><line x1="160" y1="30" x2="188" y2="30" stroke="#0F385C" stroke-width="3" stroke-dasharray="10 3 2 3"/><text x="194" y="34" font-size="12" fill="#0B0C0C">Study</text><text x="0" y="62" font-size="12" fill="#0B0C0C">°C</text><line x1="34" y1="232" x2="236" y2="232" stroke="#CECECE" stroke-width="1"/><text x="28" y="236" text-anchor="end" font-size="12" fill="#0B0C0C">14</text><line x1="34" y1="200" x2="236" y2="200" stroke="#CECECE" stroke-width="1"/><text x="28" y="204" text-anchor="end" font-size="12" fill="#0B0C0C">16</text><line x1="34" y1="168" x2="236" y2="168" stroke="#CECECE" stroke-width="1"/><text x="28" y="172" text-anchor="end" font-size="12" fill="#0B0C0C">18</text><line x1="34" y1="136" x2="236" y2="136" stroke="#CECECE" stroke-width="1"/><text x="28" y="140" text-anchor="end" font-size="12" fill="#0B0C0C">20</text><line x1="34" y1="104" x2="236" y2="104" stroke="#CECECE" stroke-width="1"/><text x="28" y="108" text-anchor="end" font-size="12" fill="#0B0C0C">22</text><line x1="34" y1="72" x2="236" y2="72" stroke="#CECECE" stroke-width="1"/><text x="28" y="76" text-anchor="end" font-size="12" fill="#0B0C0C">24</text><text x="34" y="250" text-anchor="middle" font-size="12" fill="#0B0C0C">00:00</text><text x="91.71" y="250" text-anchor="middle" font-size="12" fill="#0B0C0C">06:00</text><text x="149.43" y="250" text-anchor="middle" font-size="12" fill="#0B0C0C">12:00</text><text x="207.14" y="250" text-anchor="middle" font-size="12" fill="#0B0C0C">18:00</text><path data-series="sensor.living_room_temperature" data-values="17.6,17.1,16.9,19.4,20.3,20.6,21.8,21.4" d="M34 174.4 L62.86 182.4 L91.71 185.6 L120.57 145.6 L149.43 131.2 L178.29 126.4 L207.14 107.2 L236 113.6" fill="none" stroke="#1D70B8" stroke-width="3"/><text x="242" y="117.6" font-size="12" fill="#0B0C0C">Living room</text><path data-series="sensor.kitchen_temperature" data-values="16.8,16.2,16.4,19.8,19.1,18.7,21,19.8" d="M34 187.2 L62.86 196.8 L91.71 193.6 L120.57 139.2 L149.43 150.4 L178.29 156.8 L207.14 120 L236 139.2" fill="none" stroke="#CA357C" stroke-width="3" stroke-dasharray="8 4"/><text x="242" y="143.2" font-size="12" fill="#0B0C0C">Kitchen</text><path data-series="sensor.bedroom_temperature" data-values="18.4,18,17.7,18.9,17.2,17,17.6,18.2" d="M34 161.6 L62.86 168 L91.71 172.8 L120.57 153.6 L149.43 180.8 L178.29 184 L207.14 174.4 L236 164.8" fill="none" stroke="#50A1A5" stroke-width="3" stroke-dasharray="2 3"/><text x="242" y="168.8" font-size="12" fill="#0B0C0C">Bedroom</text><path data-series="sensor.study_temperature" data-values="15.9,15.4,15.1,17.4,20.2,20.6,18.1,16.6" d="M34 201.6 L62.86 209.6 L91.71 214.4 L120.57 177.6 L149.43 132.8 L178.29 126.4 L207.14 166.4 L236 190.4" fill="none" stroke="#0F385C" stroke-width="3" stroke-dasharray="10 3 2 3"/><text x="242" y="194.4" font-size="12" fill="#0B0C0C">Study</text></g></svg>
      </figure>
      <p class="govuk-body">Each room has its own colour and its own line style, and each line is labelled at its end. The legend is on top. These are temperatures at a moment, not amounts over a period.</p>
      <div class="civica-table-scroll" role="region" tabindex="0" aria-label="Room temperature readings"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Room temperatures every 3 hours, 12 November 2026 (°C)</caption><thead class="govuk-table__head"><tr class="govuk-table__row"><th scope="col" class="govuk-table__header">Time</th><th scope="col" class="govuk-table__header">Living room</th><th scope="col" class="govuk-table__header">Kitchen</th><th scope="col" class="govuk-table__header">Bedroom</th><th scope="col" class="govuk-table__header">Study</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">00:00</th><td class="govuk-table__cell">17.6</td><td class="govuk-table__cell">16.8</td><td class="govuk-table__cell">18.4</td><td class="govuk-table__cell">15.9</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">03:00</th><td class="govuk-table__cell">17.1</td><td class="govuk-table__cell">16.2</td><td class="govuk-table__cell">18.0</td><td class="govuk-table__cell">15.4</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">06:00</th><td class="govuk-table__cell">16.9</td><td class="govuk-table__cell">16.4</td><td class="govuk-table__cell">17.7</td><td class="govuk-table__cell">15.1</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">09:00</th><td class="govuk-table__cell">19.4</td><td class="govuk-table__cell">19.8</td><td class="govuk-table__cell">18.9</td><td class="govuk-table__cell">17.4</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">12:00</th><td class="govuk-table__cell">20.3</td><td class="govuk-table__cell">19.1</td><td class="govuk-table__cell">17.2</td><td class="govuk-table__cell">20.2</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">15:00</th><td class="govuk-table__cell">20.6</td><td class="govuk-table__cell">18.7</td><td class="govuk-table__cell">17.0</td><td class="govuk-table__cell">20.6</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">18:00</th><td class="govuk-table__cell">21.8</td><td class="govuk-table__cell">21.0</td><td class="govuk-table__cell">17.6</td><td class="govuk-table__cell">18.1</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">21:00</th><td class="govuk-table__cell">21.4</td><td class="govuk-table__cell">19.8</td><td class="govuk-table__cell">18.2</td><td class="govuk-table__cell">16.6</td></tr></tbody></table></div>
      <p class="govuk-body">Entity IDs: <code>sensor.living_room_temperature</code>, <code>sensor.kitchen_temperature</code>, <code>sensor.bedroom_temperature</code>, <code>sensor.study_temperature</code>.</p>
      <h3 class="govuk-heading-s">Colours used</h3>
      <ul class="govuk-list" data-govuk-colours><li data-govuk-colour="blue" data-hex="#1D70B8"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#1D70B8;"></span>Primary blue <code>#1D70B8</code>: Living room line (solid line)</li><li data-govuk-colour="magenta" data-hex="#CA357C"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#CA357C;"></span>Primary magenta <code>#CA357C</code>: Kitchen line (dashed line)</li><li data-govuk-colour="teal-tint-25" data-hex="#50A1A5"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#50A1A5;"></span>Teal tint 25% <code>#50A1A5</code>: Bedroom line (dotted line)</li><li data-govuk-colour="blue-shade-50" data-hex="#0F385C"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#0F385C;"></span>Blue shade 50% <code>#0F385C</code>: Study line (dash-dot line)</li><li data-govuk-colour="black-tint-80" data-hex="#CECECE"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#CECECE;"></span>Black tint 80% <code>#CECECE</code>: grid lines</li><li data-govuk-colour="black" data-hex="#0B0C0C"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#0B0C0C;"></span>Black <code>#0B0C0C</code>: labels</li></ul>
      </section>
