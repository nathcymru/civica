      <h3 class="govuk-heading-m" id="divergent-heading">A difference: temperature against a 20 °C target</h3>
      <p class="govuk-body">Each cell is the room’s <strong>average temperature while the heating was scheduled on, minus the 20 °C target</strong>. Blues are below the target and reds above it, with Black tint 95% within half a degree. A value on a boundary goes in the step nearer the centre. Below and above are directions, not failure and success: red here means warmer, not an error. A difference of 0.0 °C means on target; it does not mean missing.</p>
