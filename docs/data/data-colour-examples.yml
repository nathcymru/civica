  data-colour-quantitative:
    title: Sequential and divergent colour scales with explicit missing data
    description: Each step is a named GOV.UK chart colour with a declared value, unit and a genuine zero centre; matching tables retain every synthetic value.
    height: 2100
    html: |-
      <section aria-labelledby="quantitative-heading">
      <h2 class="govuk-heading-m" id="quantitative-heading">Colour can represent an amount or a difference</h2>
      <p class="govuk-body">Synthetic reference scales on a light canvas. These worked examples are documentation only: they do not replace device identity colours, add a heatmap or restyle a native map. Every fill is opaque; text stays outside the coloured areas.</p>
      <section class="c-data-colour-reference" aria-labelledby="sequential-heading">
      <h3 class="govuk-heading-m" id="sequential-heading">An increasing amount: energy from 0 to 2 kWh</h3>
      <p class="govuk-body">Invented energy used in each room from 09:00 to 10:00 on 12 November 2026, Europe/London. Lighter to darker means a smaller to larger amount within this declared range. Zero is a supplied reading; missing data has no place on the numeric scale.</p>
      <ul class="c-data-colour-scale" aria-label="Sequential energy scale and missing value"><li data-scale="sequential" data-scale-value="0" data-scale-colour="#D2E2F1" data-govuk-colour="blue-tint-80"><span class="c-data-colour-fill" style="background:#D2E2F1;" aria-hidden="true"></span><strong>0.0 kWh</strong>Blue tint 80%<span class="c-data-colour-code">#D2E2F1</span></li><li data-scale="sequential" data-scale-value="0.5" data-scale-colour="#8EB8DC" data-govuk-colour="blue-tint-50"><span class="c-data-colour-fill" style="background:#8EB8DC;" aria-hidden="true"></span><strong>0.5 kWh</strong>Blue tint 50%<span class="c-data-colour-code">#8EB8DC</span></li><li data-scale="sequential" data-scale-value="1" data-scale-colour="#5694CA" data-govuk-colour="blue-tint-25"><span class="c-data-colour-fill" style="background:#5694CA;" aria-hidden="true"></span><strong>1.0 kWh</strong>Blue tint 25%<span class="c-data-colour-code">#5694CA</span></li><li data-scale="sequential" data-scale-value="1.5" data-scale-colour="#1D70B8" data-govuk-colour="blue"><span class="c-data-colour-fill" style="background:#1D70B8;" aria-hidden="true"></span><strong>1.5 kWh</strong>Primary blue<span class="c-data-colour-code">#1D70B8</span></li><li data-scale="sequential" data-scale-value="2" data-scale-colour="#0F385C" data-govuk-colour="blue-shade-50"><span class="c-data-colour-fill" style="background:#0F385C;" aria-hidden="true"></span><strong>2.0 kWh</strong>Blue shade 50%<span class="c-data-colour-code">#0F385C</span></li><li data-scale="sequential" data-scale-value="missing" data-scale-colour="none"><span class="c-data-colour-fill c-data-colour-fill--missing" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="m4 4 16 16M20 4 4 20" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><strong>Not supplied</strong><span class="c-data-colour-code">No numeric colour</span></li></ul>
      <div class="civica-table-scroll" role="region" tabindex="0" aria-label="Sequential energy values and colour mapping"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">The sequential colours and their underlying values</caption><thead class="govuk-table__head"><tr class="govuk-table__row"><th scope="col" class="govuk-table__header">Room</th><th scope="col" class="govuk-table__header">Energy (kWh)</th><th scope="col" class="govuk-table__header">GOV.UK colour</th><th scope="col" class="govuk-table__header">Displayed colour</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Kitchen</th><td class="govuk-table__cell">0.0</td><td class="govuk-table__cell">Blue tint 80%</td><td class="govuk-table__cell"><code>#D2E2F1</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Hall</th><td class="govuk-table__cell">0.5</td><td class="govuk-table__cell">Blue tint 50%</td><td class="govuk-table__cell"><code>#8EB8DC</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Study</th><td class="govuk-table__cell">1.0</td><td class="govuk-table__cell">Blue tint 25%</td><td class="govuk-table__cell"><code>#5694CA</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Utility room</th><td class="govuk-table__cell">1.5</td><td class="govuk-table__cell">Primary blue</td><td class="govuk-table__cell"><code>#1D70B8</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Living room</th><td class="govuk-table__cell">2.0</td><td class="govuk-table__cell">Blue shade 50%</td><td class="govuk-table__cell"><code>#0F385C</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Garage</th><td class="govuk-table__cell">Not supplied</td><td class="govuk-table__cell">Not supplied</td><td class="govuk-table__cell">Not supplied: crossed empty swatch</td></tr></tbody></table></div>
      <p class="govuk-body">Each step is a named GOV.UK colour from the Blues scale of the GOV.UK chart palette: Blue tint 80% at 0.0 kWh, Blue tint 50% at 0.5 kWh, Blue tint 25% at 1.0 kWh, Primary blue at 1.5 kWh, Blue shade 50% at 2.0 kWh. There are no calculated in-between colours. A real view must state the range of values each step covers, and its table must show the exact value.</p>
      </section>
      <section class="c-data-colour-reference" aria-labelledby="divergent-heading">
      <h3 class="govuk-heading-m" id="divergent-heading">A meaningful centre: difference from 20 °C</h3>
      <p class="govuk-body">Invented room readings at 10:00 on 12 November 2026, Europe/London. The difference is <strong>reported temperature minus the example target of 20 °C</strong>. Zero means equal to that target; it does not mean missing. Below and above target are directions, not automatic failure and success states: red here means warmer, not an error.</p>
      <ul class="c-data-colour-scale" aria-label="Divergent temperature difference scale and missing value"><li data-scale="divergent" data-scale-value="-2" data-scale-colour="#1D70B8" data-govuk-colour="blue"><span class="c-data-colour-fill" style="background:#1D70B8;" aria-hidden="true"></span><strong>−2 °C</strong>Primary blue<span class="c-data-colour-code">#1D70B8</span></li><li data-scale="divergent" data-scale-value="-1" data-scale-colour="#8EB8DC" data-govuk-colour="blue-tint-50"><span class="c-data-colour-fill" style="background:#8EB8DC;" aria-hidden="true"></span><strong>−1 °C</strong>Blue tint 50%<span class="c-data-colour-code">#8EB8DC</span></li><li data-scale="divergent" data-scale-value="0" data-scale-colour="#F3F3F3" data-govuk-colour="black-tint-95"><span class="c-data-colour-fill" style="background:#F3F3F3;" aria-hidden="true"></span><strong>0 °C</strong>Black tint 95%<span class="c-data-colour-code">#F3F3F3</span></li><li data-scale="divergent" data-scale-value="1" data-scale-colour="#E59A9A" data-govuk-colour="red-tint-50"><span class="c-data-colour-fill" style="background:#E59A9A;" aria-hidden="true"></span><strong>+1 °C</strong>Red tint 50%<span class="c-data-colour-code">#E59A9A</span></li><li data-scale="divergent" data-scale-value="2" data-scale-colour="#CA3535" data-govuk-colour="red"><span class="c-data-colour-fill" style="background:#CA3535;" aria-hidden="true"></span><strong>+2 °C</strong>Primary red<span class="c-data-colour-code">#CA3535</span></li><li data-scale="divergent" data-scale-value="missing" data-scale-colour="none"><span class="c-data-colour-fill c-data-colour-fill--missing" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="m4 4 16 16M20 4 4 20" fill="none" stroke="currentColor" stroke-width="2"/></svg></span><strong>Not supplied</strong><span class="c-data-colour-code">No numeric colour</span></li></ul>
      <div class="civica-table-scroll" role="region" tabindex="0" aria-label="Temperature readings, signed differences and colour mapping"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">The divergent colours and their underlying values</caption><thead class="govuk-table__head"><tr class="govuk-table__row"><th scope="col" class="govuk-table__header">Room</th><th scope="col" class="govuk-table__header">Reading (°C)</th><th scope="col" class="govuk-table__header">Difference (°C)</th><th scope="col" class="govuk-table__header">GOV.UK colour</th><th scope="col" class="govuk-table__header">Displayed colour</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Kitchen</th><td class="govuk-table__cell">18</td><td class="govuk-table__cell">−2</td><td class="govuk-table__cell">Primary blue</td><td class="govuk-table__cell"><code>#1D70B8</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Hall</th><td class="govuk-table__cell">19</td><td class="govuk-table__cell">−1</td><td class="govuk-table__cell">Blue tint 50%</td><td class="govuk-table__cell"><code>#8EB8DC</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Study</th><td class="govuk-table__cell">20</td><td class="govuk-table__cell">0</td><td class="govuk-table__cell">Black tint 95%</td><td class="govuk-table__cell"><code>#F3F3F3</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Utility room</th><td class="govuk-table__cell">21</td><td class="govuk-table__cell">+1</td><td class="govuk-table__cell">Red tint 50%</td><td class="govuk-table__cell"><code>#E59A9A</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Living room</th><td class="govuk-table__cell">22</td><td class="govuk-table__cell">+2</td><td class="govuk-table__cell">Primary red</td><td class="govuk-table__cell"><code>#CA3535</code></td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Garage</th><td class="govuk-table__cell">Not supplied</td><td class="govuk-table__cell">Not supplied</td><td class="govuk-table__cell">Not supplied</td><td class="govuk-table__cell">Not supplied: crossed empty swatch</td></tr></tbody></table></div>
      <p class="govuk-body">Each step is a named GOV.UK colour: Primary blue at −2 °C, Blue tint 50% at −1 °C, Black tint 95% at 0 °C, Red tint 50% at +1 °C, Primary red at +2 °C. The blues and reds match GOV.UK’s divergent chart example. The Black tint 95% centre is a civica choice from the GOV.UK Neutrals scale. There are no calculated in-between colours.</p>
      </section>
      <p class="govuk-body">Both reference mappings leave an out-of-range value unmapped and require the explanation <strong>outside this scale</strong>, rather than silently giving it an end colour. A real view must show the actual value and explain or revise its range. It must not turn missing data into zero, a centre or a reassuring colour.</p>
      <p class="govuk-body">These scales are not claimed to be perceptually uniform, interchangeable with categorical colours or universally distinguishable. Some pale fills, such as Blue tint 80% and Black tint 95%, have low contrast against white. Visible outlines, numeric labels and tables carry the information; inspect the actual chart or map marks and adjacent colours before using a scale.</p>
      <p class="govuk-body">Source: the values on this page are invented documentation data. The colours are from the GOV.UK chart palette, which recommends no more than two quantitative colour scales in one chart. Separate the view when more measures would make the meaning unclear.</p>
      </section>
