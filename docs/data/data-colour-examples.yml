  chart-govuk-divergent:
    title: Divergent stacked bar chart
    description: Synthetic hours under and over the heating target per room, in blues and reds either side of the target, with the legend on top and a matching table.
    height: 1700
    html: |-
      <section aria-labelledby="divergent-chart-heading">
      <h2 class="govuk-heading-m" id="divergent-chart-heading">Above and below a target: hours under and over the heating target</h2>
      <p class="govuk-body"><strong>Synthetic data, not readings from a Home Assistant instance.</strong> Hours each room spent under or over its heating target while the heating schedule was on, 9 to 15 November 2026, Europe/London. The schedule ran for 42 hours in each room.</p>
      <figure style="margin:0 0 30px;">
      <figcaption class="govuk-heading-s">Hours under and over the heating target, 9 to 15 November 2026</figcaption>
      <svg role="img" aria-labelledby="divergent-title divergent-desc" viewBox="0 0 320 264" style="display:block;width:100%;max-width:480px;height:auto;font-family:Arial,Helvetica,sans-serif;" data-chart="divergent"><title id="divergent-title">Divergent stacked bar chart of hours under and over the heating target for four rooms</title><desc id="divergent-desc">Hours under the target extend left of the centre line and hours over extend right. The darker outer part of each side is more than 1 °C away from the target. The bedroom spent the most time under target, 21 hours. The kitchen spent the most time over target, 16 hours. The table below gives every value, including hours on target.</desc>
      <g aria-hidden="true"><rect x="0" y="4" width="12" height="12" fill="#1D70B8"/><text x="18" y="14" font-size="12" fill="#0B0C0C">More than 1 °C under</text><rect x="160" y="4" width="12" height="12" fill="#8EB8DC"/><text x="178" y="14" font-size="12" fill="#0B0C0C">Up to 1 °C under</text><rect x="0" y="24" width="12" height="12" fill="#E59A9A"/><text x="18" y="34" font-size="12" fill="#0B0C0C">Up to 1 °C over</text><rect x="160" y="24" width="12" height="12" fill="#CA3535"/><text x="178" y="34" font-size="12" fill="#0B0C0C">More than 1 °C over</text><text x="190" y="62" text-anchor="end" font-size="12" fill="#0B0C0C">← Under</text><text x="202" y="62" font-size="12" fill="#0B0C0C">Over →</text><line x1="96" y1="68" x2="96" y2="224" stroke="#CECECE" stroke-width="1"/><text x="96" y="240" text-anchor="middle" font-size="12" fill="#0B0C0C">20</text><line x1="146" y1="68" x2="146" y2="224" stroke="#CECECE" stroke-width="1"/><text x="146" y="240" text-anchor="middle" font-size="12" fill="#0B0C0C">10</text><line x1="196" y1="68" x2="196" y2="224" stroke="#CECECE" stroke-width="2"/><text x="196" y="240" text-anchor="middle" font-size="12" fill="#0B0C0C">0</text><line x1="246" y1="68" x2="246" y2="224" stroke="#CECECE" stroke-width="1"/><text x="246" y="240" text-anchor="middle" font-size="12" fill="#0B0C0C">10</text><line x1="296" y1="68" x2="296" y2="224" stroke="#CECECE" stroke-width="1"/><text x="296" y="240" text-anchor="middle" font-size="12" fill="#0B0C0C">20</text><text x="0" y="90" font-size="12" fill="#0B0C0C">Living room</text><rect data-room="Living room" data-band="under" data-value="8" x="156" y="74" width="39" height="24" fill="#8EB8DC"/><rect data-room="Living room" data-band="far-under" data-value="2" x="146" y="74" width="9" height="24" fill="#1D70B8"/><rect data-room="Living room" data-band="over" data-value="7" x="197" y="74" width="34" height="24" fill="#E59A9A"/><rect data-room="Living room" data-band="far-over" data-value="3" x="232" y="74" width="14" height="24" fill="#CA3535"/><text x="0" y="130" font-size="12" fill="#0B0C0C">Kitchen</text><rect data-room="Kitchen" data-band="under" data-value="5" x="171" y="114" width="24" height="24" fill="#8EB8DC"/><rect data-room="Kitchen" data-band="far-under" data-value="1" x="166" y="114" width="4" height="24" fill="#1D70B8"/><rect data-room="Kitchen" data-band="over" data-value="10" x="197" y="114" width="49" height="24" fill="#E59A9A"/><rect data-room="Kitchen" data-band="far-over" data-value="6" x="247" y="114" width="29" height="24" fill="#CA3535"/><text x="0" y="170" font-size="12" fill="#0B0C0C">Bedroom</text><rect data-room="Bedroom" data-band="under" data-value="12" x="136" y="154" width="59" height="24" fill="#8EB8DC"/><rect data-room="Bedroom" data-band="far-under" data-value="9" x="91" y="154" width="44" height="24" fill="#1D70B8"/><rect data-room="Bedroom" data-band="over" data-value="5" x="197" y="154" width="24" height="24" fill="#E59A9A"/><rect data-room="Bedroom" data-band="far-over" data-value="1" x="222" y="154" width="4" height="24" fill="#CA3535"/><text x="0" y="210" font-size="12" fill="#0B0C0C">Study</text><rect data-room="Study" data-band="under" data-value="10" x="146" y="194" width="49" height="24" fill="#8EB8DC"/><rect data-room="Study" data-band="far-under" data-value="4" x="126" y="194" width="19" height="24" fill="#1D70B8"/><rect data-room="Study" data-band="over" data-value="7" x="197" y="194" width="34" height="24" fill="#E59A9A"/><rect data-room="Study" data-band="far-over" data-value="3" x="232" y="194" width="14" height="24" fill="#CA3535"/><text x="196" y="256" text-anchor="middle" font-size="12" fill="#0B0C0C">Hours</text></g></svg>
      </figure>
      <p class="govuk-body">Position carries the meaning as well as colour: under target is always left of the centre line and over target is always right. On each side, the outer part is more than 1 °C from the target. Hours within 0.25 °C of the target count as on target; they are in the table, not drawn. Under and over are directions, not failure and success.</p>
      <div class="civica-table-scroll" role="region" tabindex="0" aria-label="Hours under and over the heating target"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Hours under, on and over the heating target, 9 to 15 November 2026</caption><thead class="govuk-table__head"><tr class="govuk-table__row"><th scope="col" class="govuk-table__header">Room</th><th scope="col" class="govuk-table__header">More than 1 °C under (hours)</th><th scope="col" class="govuk-table__header">Up to 1 °C under (hours)</th><th scope="col" class="govuk-table__header">On target (hours)</th><th scope="col" class="govuk-table__header">Up to 1 °C over (hours)</th><th scope="col" class="govuk-table__header">More than 1 °C over (hours)</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Living room</th><td class="govuk-table__cell">2</td><td class="govuk-table__cell">8</td><td class="govuk-table__cell">22</td><td class="govuk-table__cell">7</td><td class="govuk-table__cell">3</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Kitchen</th><td class="govuk-table__cell">1</td><td class="govuk-table__cell">5</td><td class="govuk-table__cell">20</td><td class="govuk-table__cell">10</td><td class="govuk-table__cell">6</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Bedroom</th><td class="govuk-table__cell">9</td><td class="govuk-table__cell">12</td><td class="govuk-table__cell">15</td><td class="govuk-table__cell">5</td><td class="govuk-table__cell">1</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Study</th><td class="govuk-table__cell">4</td><td class="govuk-table__cell">10</td><td class="govuk-table__cell">18</td><td class="govuk-table__cell">7</td><td class="govuk-table__cell">3</td></tr></tbody></table></div>
      <p class="govuk-body">The target is the scheduled setpoint for each room.</p>
      <h3 class="govuk-heading-s">Colours used</h3>
      <ul class="govuk-list" data-govuk-colours><li data-govuk-colour="red" data-hex="#CA3535"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#CA3535;"></span>Primary red <code>#CA3535</code>: more than 1 °C over</li><li data-govuk-colour="red-tint-50" data-hex="#E59A9A"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#E59A9A;"></span>Red tint 50% <code>#E59A9A</code>: up to 1 °C over</li><li data-govuk-colour="black-tint-80" data-hex="#CECECE"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#CECECE;"></span>Black tint 80% <code>#CECECE</code>: grid lines and centre line</li><li data-govuk-colour="blue-tint-50" data-hex="#8EB8DC"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#8EB8DC;"></span>Blue tint 50% <code>#8EB8DC</code>: up to 1 °C under</li><li data-govuk-colour="blue" data-hex="#1D70B8"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#1D70B8;"></span>Primary blue <code>#1D70B8</code>: more than 1 °C under</li><li data-govuk-colour="black" data-hex="#0B0C0C"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#0B0C0C;"></span>Black <code>#0B0C0C</code>: labels</li></ul>
      </section>
    chart_data:
      classification: Synthetic documentation data; not readings from a Home Assistant instance
