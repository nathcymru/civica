  chart-govuk-social:
    title: Social media chart
    description: "A square social graphic of synthetic automation counts as sized circles on Blue shade 50%, using an accent colour, with a matching table."
    height: 1500
    html: |-
      <section aria-labelledby="social-heading">
      <h2 class="govuk-heading-m" id="social-heading">Social format: larger, bolder shapes on a shade background</h2>
      <p class="govuk-body"><strong>Synthetic data, not readings from a Home Assistant instance.</strong> A square social media graphic of the number of times each automation ran in the 30 days to 15 November 2026.</p>
      <figure style="margin:0 0 30px;">
      <figcaption class="govuk-heading-s">Most-used automations, 30 days to 15 November 2026</figcaption>
      <svg role="img" aria-labelledby="social-title social-desc" viewBox="0 0 320 320" style="display:block;width:100%;max-width:480px;height:auto;font-family:Arial,Helvetica,sans-serif;" data-chart="social"><title id="social-title">Social media graphic of the four most-used automations, shown as circles sized by number of runs</title><desc id="social-desc">Hall motion light ran most, 1,184 times, and has the largest, brightest circle. Bathroom fan ran 642 times, landing night light 455 times and back door alert 310 times. The table below gives the same values.</desc>
      <g aria-hidden="true"><rect x="0" y="0" width="320" height="320" fill="#0F385C"/><text x="16" y="40" font-size="21" font-weight="700" fill="#FFFFFF">Most-used automations</text><text x="16" y="62" font-size="13" fill="#FFFFFF">Runs in 30 days</text><circle data-automation="Hall motion light" data-value="1184" cx="90" cy="186" r="70" fill="#00FFE0"/><text x="90" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#0F385C">1,184</text><text x="90" y="196" text-anchor="middle" font-size="11" fill="#0F385C">Hall</text><text x="90" y="209" text-anchor="middle" font-size="11" fill="#0F385C">motion light</text><circle data-automation="Bathroom fan" data-value="642" cx="216" cy="158" r="51.55" fill="#F3F9F9"/><text x="216" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#0F385C">642</text><text x="216" y="168" text-anchor="middle" font-size="11" fill="#0F385C">Bathroom</text><text x="216" y="181" text-anchor="middle" font-size="11" fill="#0F385C">fan</text><circle data-automation="Landing night light" data-value="455" cx="194" cy="268" r="43.39" fill="#F3F9F9"/><text x="194" y="262" text-anchor="middle" font-size="17" font-weight="700" fill="#0F385C">455</text><text x="194" y="278" text-anchor="middle" font-size="11" fill="#0F385C">Landing</text><text x="194" y="291" text-anchor="middle" font-size="11" fill="#0F385C">night light</text><circle data-automation="Back door alert" data-value="310" cx="278" cy="246" r="35.82" fill="#F3F9F9"/><text x="278" y="240" text-anchor="middle" font-size="17" font-weight="700" fill="#0F385C">310</text><text x="278" y="256" text-anchor="middle" font-size="11" fill="#0F385C">Back door</text><text x="278" y="269" text-anchor="middle" font-size="11" fill="#0F385C">alert</text></g></svg>
      </figure>
      <p class="govuk-body">Circle area is proportional to the number of runs, and every circle shows its number and name, so the ranking does not depend on colour. The accent colour highlights the most-used automation. The background is Blue shade 50%.</p>
      <div class="civica-table-scroll" role="region" tabindex="0" aria-label="Most-used automations values"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">Automation runs in the 30 days to 15 November 2026</caption><thead class="govuk-table__head"><tr class="govuk-table__row"><th scope="col" class="govuk-table__header">Automation</th><th scope="col" class="govuk-table__header">Rank</th><th scope="col" class="govuk-table__header">Runs</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Hall motion light</th><td class="govuk-table__cell">1</td><td class="govuk-table__cell">1,184</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Bathroom fan</th><td class="govuk-table__cell">2</td><td class="govuk-table__cell">642</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Landing night light</th><td class="govuk-table__cell">3</td><td class="govuk-table__cell">455</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Back door alert</th><td class="govuk-table__cell">4</td><td class="govuk-table__cell">310</td></tr></tbody></table></div>
      <h3 class="govuk-heading-s">Colours used</h3>
      <ul class="govuk-list" data-govuk-colours><li data-govuk-colour="blue-shade-50" data-hex="#0F385C"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#0F385C;"></span>Blue shade 50% <code>#0F385C</code>: background and text on circles</li><li data-govuk-colour="teal-accent" data-hex="#00FFE0"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#00FFE0;"></span>Accent teal <code>#00FFE0</code>: most-used automation</li><li data-govuk-colour="teal-tint-95" data-hex="#F3F9F9"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#F3F9F9;"></span>Teal tint 95% <code>#F3F9F9</code>: other automations</li><li data-govuk-colour="white" data-hex="#FFFFFF"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#FFFFFF;"></span>White <code>#FFFFFF</code>: heading text on the background</li></ul>
      </section>
