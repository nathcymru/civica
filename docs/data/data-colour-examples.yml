  data-colour-quantitative:
    title: Sequential and divergent heatmaps with explicit missing data
    description: 'Two heatmaps of synthetic Home Assistant data for 5 rooms over a week: daily energy on a 5-step Blues scale, and the difference from a 20 °C target on a Blues and Reds scale with a neutral centre. Every cell shows its value, missing readings are crossed, and matching tables give every value.'
    height: 2300
    html: |-
      <section aria-labelledby="quantitative-heading">
      <h2 class="govuk-heading-m" id="quantitative-heading">A week of room readings as two heatmaps</h2>
      <p class="govuk-body">
      <strong>Synthetic data.</strong> Daily readings for 5 rooms, Monday 9 to Sunday 15 November 2026, Europe/London; each cell prints its value.</p>
      <section class="c-data-colour-reference" aria-labelledby="sequential-heading">
      <h3 class="govuk-heading-m" id="sequential-heading">An amount: energy used each day, 0 to 2 kWh</h3>
      <p class="govuk-body">Five steps of Blues, 0.4 kWh each. A value on a boundary goes in the higher step.</p>
      <figure style="margin:0 0 30px;">
      <figcaption class="govuk-heading-s">Energy used each day by room, 9 to 15 November 2026 (kWh)</figcaption>
      <svg role="img" aria-labelledby="heatmap-sequential-title heatmap-sequential-desc" viewBox="0 0 232 352" style="display:block;width:100%;max-width:360px;height:auto;font-family:Arial,Helvetica,sans-serif;" data-chart="heatmap-sequential">
      <title id="heatmap-sequential-title">Heatmap of energy used each day by room in kilowatt-hours</title>
      <desc id="heatmap-sequential-desc">A grid of 5 rooms by 7 days. Each cell is shaded from light blue for little energy to dark blue for more, and shows its value. The living room and the study use the most, up to 1.96 kWh; the hall uses the least. The garage used 0.00 kWh on 5 days and has no reading for Wednesday, shown as a crossed empty cell. The table below gives every value.</desc>
