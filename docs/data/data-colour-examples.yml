      <ul class="govuk-list" data-govuk-colours><li data-govuk-colour="blue" data-hex="#1D70B8"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#1D70B8;"></span>Primary blue <code>#1D70B8</code>: bars</li><li data-govuk-colour="black-tint-80" data-hex="#CECECE"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#CECECE;"></span>Black tint 80% <code>#CECECE</code>: grid lines and axis</li><li data-govuk-colour="black" data-hex="#0B0C0C"><span aria-hidden="true" style="display:inline-block;width:24px;height:24px;margin-right:8px;vertical-align:middle;border:1px solid #0B0C0C;background:#0B0C0C;"></span>Black <code>#0B0C0C</code>: labels</li></ul>
