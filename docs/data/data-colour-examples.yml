      <h2 class="govuk-heading-m" id="single-heading">Single category: one measure, one colour</h2>
      <p class="govuk-body"><strong>Synthetic data.</strong> Electricity used each day from Monday 9 to Sunday 15 November 2026, Europe/London, for an example home. The values are invented for this documentation example; they are not readings from a Home Assistant instance.</p>
