# Generated by a one-off script from design-system/chart-colours.mjs and docs/data/govuk-brand-colours.json.
# Regenerate rather than hand-editing a colour.
examples:
  data-colour-categorical:
    title: Stable device identities in light and dark mode
    description: Colours come unchanged from the GOV.UK chart palette and repeat, so the line dash, marker and name identify each device; a common table distinguishes a missing reading from zero.
    height: 1500
    html: |-
      <section aria-labelledby="categorical-heading">
      <h2 class="govuk-heading-m" id="categorical-heading">The same devices keep their identity</h2>
      <p class="govuk-body">Synthetic data: energy used from 09:00 to 10:00 on 12 November 2026, Europe/London. Each panel uses the same three fixed entity IDs. The colours come unchanged from the GOV.UK chart palette and are the same in light and dark mode.</p>
      <p class="govuk-body">The palette has six colours, so colours repeat. Here the tumble dryer and the dishwasher are both Primary blue. The line dash, the marker and the device name tell them apart. Never rely on the colour alone.</p>
      <p class="govuk-body">These are labelled reference views, not theme controls. In the maintained charts, light or dark follows the display mode and the chart colours do not change. Choosing another theme colour does not change a device’s chart colour.</p>
      <div class="c-data-colour-contexts"><section class="c-data-colour-context" aria-labelledby="categorical-light" style="--example-chart-surface:#FFFFFF;--example-chart-text:#0B0C0C">
      <h3 class="govuk-heading-s" id="categorical-light">Light mode</h3>
      <ul class="c-data-colour-keys"><li data-chart-key="sensor.washing_machine_energy" data-chart-mode="light" data-chart-colour="#F7996A" data-chart-pattern="diagonal" data-chart-symbol="circle" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#F7996A" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><circle cx="42" cy="12" r="6" fill="#F7996A" stroke="#F7996A" stroke-width="1.5"/></svg><span><strong>Washing machine</strong><br>Dash-dot line, filled circle marker, diagonal fill<br>Orange tint 25%<span class="c-data-colour-code">#F7996A</span></span></li>
      <li data-chart-key="sensor.tumble_dryer_energy" data-chart-mode="light" data-chart-colour="#1D70B8" data-chart-pattern="dots" data-chart-symbol="diamond" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#1D70B8" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><path d="m42 4 7 8-7 8-7-8Z" fill="#1D70B8" stroke="#1D70B8" stroke-width="1.5"/></svg><span><strong>Tumble dryer</strong><br>Dash-dot line, filled diamond marker, dots fill<br>Primary blue<span class="c-data-colour-code">#1D70B8</span></span></li>
      <li data-chart-key="sensor.dishwasher_energy" data-chart-mode="light" data-chart-colour="#1D70B8" data-chart-pattern="diagonal" data-chart-symbol="emptyCircle" data-chart-line-dash="6,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#1D70B8" stroke-width="1.5" stroke-dasharray="6 3"/><circle cx="42" cy="12" r="6" fill="none" stroke="#1D70B8" stroke-width="1.5"/></svg><span><strong>Dishwasher</strong><br>Dashed line, hollow circle marker, diagonal fill<br>Primary blue<span class="c-data-colour-code">#1D70B8</span></span></li></ul>
      </section>
      <section class="c-data-colour-context" aria-labelledby="categorical-dark" style="--example-chart-surface:#24282B;--example-chart-text:#FFFFFF">
      <h3 class="govuk-heading-s" id="categorical-dark">Dark mode</h3>
      <ul class="c-data-colour-keys"><li data-chart-key="sensor.washing_machine_energy" data-chart-mode="dark" data-chart-colour="#F7996A" data-chart-pattern="diagonal" data-chart-symbol="circle" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#F7996A" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><circle cx="42" cy="12" r="6" fill="#F7996A" stroke="#F7996A" stroke-width="1.5"/></svg><span><strong>Washing machine</strong><br>Dash-dot line, filled circle marker, diagonal fill<br>Orange tint 25%<span class="c-data-colour-code">#F7996A</span></span></li>
      <li data-chart-key="sensor.tumble_dryer_energy" data-chart-mode="dark" data-chart-colour="#1D70B8" data-chart-pattern="dots" data-chart-symbol="diamond" data-chart-line-dash="8,3,2,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#1D70B8" stroke-width="1.5" stroke-dasharray="8 3 2 3"/><path d="m42 4 7 8-7 8-7-8Z" fill="#1D70B8" stroke="#1D70B8" stroke-width="1.5"/></svg><span><strong>Tumble dryer</strong><br>Dash-dot line, filled diamond marker, dots fill<br>Primary blue<span class="c-data-colour-code">#1D70B8</span></span></li>
      <li data-chart-key="sensor.dishwasher_energy" data-chart-mode="dark" data-chart-colour="#1D70B8" data-chart-pattern="diagonal" data-chart-symbol="emptyCircle" data-chart-line-dash="6,3"><svg width="84" height="24" viewBox="0 0 84 24" aria-hidden="true" focusable="false"><line x1="2" y1="12" x2="82" y2="12" stroke="#1D70B8" stroke-width="1.5" stroke-dasharray="6 3"/><circle cx="42" cy="12" r="6" fill="none" stroke="#1D70B8" stroke-width="1.5"/></svg><span><strong>Dishwasher</strong><br>Dashed line, hollow circle marker, diagonal fill<br>Primary blue<span class="c-data-colour-code">#1D70B8</span></span></li></ul>
      </section></div>
      <div class="civica-table-scroll" role="region" tabindex="0" aria-label="Categorical example values and stable identities"><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--m">The values are the same in both display modes</caption><thead class="govuk-table__head"><tr class="govuk-table__row"><th scope="col" class="govuk-table__header">Device and stable identity</th><th scope="col" class="govuk-table__header">Energy (kWh)</th><th scope="col" class="govuk-table__header">Data status</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Washing machine<br><code class="c-data-colour-id">sensor.washing_machine_energy</code></th><td class="govuk-table__cell">0.8</td><td class="govuk-table__cell">Supplied in this invented example.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Tumble dryer<br><code class="c-data-colour-id">sensor.tumble_dryer_energy</code></th><td class="govuk-table__cell">1.2</td><td class="govuk-table__cell">Supplied in this invented example.</td></tr><tr class="govuk-table__row"><th scope="row" class="govuk-table__header">Dishwasher<br><code class="c-data-colour-id">sensor.dishwasher_energy</code></th><td class="govuk-table__cell">Not supplied</td><td class="govuk-table__cell">No reading for this period. It is not zero.</td></tr></tbody></table></div>
      <p class="govuk-body">The dishwasher keeps its identity even though its reading is missing. A colour key identifies the source; it does not say that a value was received.</p>
      <p class="govuk-body">Some colours have low contrast with the surface: Orange tint 25% on white, and Primary blue on the dark surface. GOV.UK colours are used unchanged, so there the name, line dash and marker carry the meaning, and the table gives every value.</p>
      <details class="govuk-details"><summary class="govuk-details__summary"><span class="govuk-details__summary-text">How these keys were produced</span></summary><div class="govuk-details__text"><p>Each row was calculated with <code>chartSeriesStyle(entityId, { mode })</code> from <code>design-system/chart-colours.mjs</code>, algorithm <code>govuk-categorical-v1</code>. The line specimens use the existing 1.5px width. The values above do not affect the colour.</p><p>The colours are the GOV.UK chart palette, not a civica palette. If the generator changes, regenerate these references and review the result. The quantitative example uses named GOV.UK scale colours instead, because there colour represents a measured value rather than an identity.</p></div></details>
      </section>
