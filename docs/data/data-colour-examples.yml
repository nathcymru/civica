    title: Single category bar chart
    description: A bar chart of synthetic daily electricity use in Primary blue, with Black tint 80% grid lines, Black labels and a matching table.
    height: 1350
    html: |-
      <section aria-labelledby="single-heading">
      <h2 class="govuk-heading-m" id="single-heading">Single category: one measure, one colour</h2>
      <p class="govuk-body"><strong>Synthetic data, not readings from a Home Assistant instance.</strong> Electricity used each day from Monday 9 to Sunday 15 November 2026, Europe/London.</p>
      <figure style="margin:0 0 30px;">
      <figcaption class="govuk-heading-s" id="single-caption">Daily electricity use, 9 to 15 November 2026 (kWh)</figcaption>
      <svg role="img" aria-labelledby="single-title single-desc" viewBox="0 0 320 270" style="display:block;width:100%;max-width:480px;height:auto;font-family:Arial,Helvetica,sans-serif;" data-chart="single"><title id="single-title">Bar chart of daily electricity use in kilowatt-hours</title><desc id="single-desc">Seven bars, one for each day. Use was lowest on Tuesday at 7.9 kWh and highest on Saturday at 12.7 kWh. The table below gives every value.</desc>
