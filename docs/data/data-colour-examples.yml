  chart-govuk-multiple:
    title: Multiple categories line chart
    description: Four synthetic room temperatures over a day, each with a GOV.UK categorical colour, its own line style and an end label, with the legend on top and a matching table.
    height: 1650
    html: |-
      <section aria-labelledby="multiple-heading">
      <h2 class="govuk-heading-m" id="multiple-heading">Multiple categories: four rooms over one day</h2>
      <p class="govuk-body"><strong>Synthetic data.</strong> Temperature reported by four room sensors every 3 hours on Thursday 12 November 2026, Europe/London. The values are invented for this documentation example; they are not readings from a Home Assistant instance.</p>
      <figure style="margin:0 0 30px;">
      <figcaption class="govuk-heading-s">Room temperatures, 12 November 2026 (°C)</figcaption>
      <svg role="img" aria-labelledby="multiple-title multiple-desc" viewBox="0 0 320 262" style="display:block;width:100%;max-width:480px;height:auto;font-family:Arial,Helvetica,sans-serif;" data-chart="multiple"><title id="multiple-title">Line chart of four room temperatures in degrees Celsius over one day</title><desc id="multiple-desc">The living room is a solid line, the kitchen dashed, the bedroom dotted and the study dash-dot. The living room and study are coolest around 06:00 and the kitchen at 03:00; the bedroom is coolest at 15:00. At 21:00 the living room is warmest at 21.4 °C and the study coolest at 16.6 °C. The table below gives every reading.</desc>
