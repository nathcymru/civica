    chart_data:
      classification: Synthetic documentation data; not readings from a Home Assistant instance
      card: 'History graph card as drawn with the civica theme: solid lines, legend under the plot, no dashes, markers or end labels'
      measure: Relative humidity
      unit: '%'
      time_zone: Europe/London
      date: '2026-11-12'
      times: ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00']
      colour_order: civica-chart-1 to civica-chart-4 from themes/civica.yaml, by entity position
      series:
        - key: sensor.kitchen_humidity
          label: Kitchen
          theme_colour: civica-chart-1
          colour_id: blue
          hex: '#1D70B8'
          values: [52, 51, 50, 58, 55, 53, 66, 59]
        - key: sensor.living_room_humidity
          label: Living room
          theme_colour: civica-chart-2
          colour_id: magenta
          hex: '#CA357C'
          values: [47, 46, null, null, 44, 45, 48, 46]
        - key: sensor.bedroom_humidity
          label: Bedroom
          theme_colour: civica-chart-3
          colour_id: teal-tint-25
          hex: '#50A1A5'
          values: [56, 59, 61, 54, 50, 49, 50, 53]
        - key: sensor.bathroom_humidity
          label: Bathroom
          theme_colour: civica-chart-4
          colour_id: blue-shade-50
          hex: '#0F385C'
          values: [63, 61, 60, 82, 68, 64, 62, 74]
      surfaces:
        light: '#FFFFFF'
        dark: '#24282B'
      contrast_on_dark_card:
        civica-chart-1: 2.9
        civica-chart-2: 3.1
        civica-chart-3: 4.9
        civica-chart-4: 1.2
      missing: 'No reading: a gap in the line, “No data” under the gap and “Not supplied” in the table.'
