      <p class="govuk-body">Each room also has its own line style and marker, and its name at the end of its line, so the chart can be read without colour. A History graph card draws plain solid lines, so there give each entity a clear name.</p>
      <p class="govuk-body">The living room sensor sent no reading at 06:00 or 09:00, so its line has a gap and the table says “Not supplied”. A gap is not a reading of zero.</p>
      <p class="govuk-body">On the dark background, Primary blue (2.9:1) and Blue shade 50% (1.2:1) are hard to see, so there the outlined markers and the room names carry the meaning. Humidity is a reading at a moment, not an amount over a period.</p>
