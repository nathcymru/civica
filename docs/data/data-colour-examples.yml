  data-colour-quantitative:
    title: Sequential and divergent heatmaps with explicit missing data
    description: 'Two heatmaps of synthetic Home Assistant data for 5 rooms over a week: daily energy on a 5-step Blues scale, and the difference from a 20 °C target on a Blues and Reds scale with a neutral centre. Every cell shows its value, missing readings are crossed, and matching tables give every value.'
    height: 2300
    html: |-
      <section aria-labelledby="quantitative-heading">
      <h2 class="govuk-heading-m" id="quantitative-heading">Colour can show an amount or a difference</h2>
      <p class="govuk-body">
      <strong>Synthetic data, not readings from a Home Assistant instance.</strong> A week of readings for 5 rooms, Monday 9 to Sunday 15 November 2026, Europe/London, as two heatmaps. Each cell prints its value, so the colour is never the only cue.</p>
      <section class="c-data-colour-reference" aria-labelledby="sequential-heading">
      <h3 class="govuk-heading-m" id="sequential-heading">An amount: energy used each day, 0 to 2 kWh</h3>
      <p class="govuk-body">Five steps of Blues, from light for less to dark for more. Each step covers 0.4 kWh, and a value on a boundary goes in the higher step. A reading of 0.00 kWh is a real zero and takes the lightest step. A missing reading is a crossed empty cell, not a colour from the scale.</p>
      <figure style="margin:0 0 30px;">
      <figcaption class="govuk-heading-s">Energy used each day by room, 9 to 15 November 2026 (kWh)</figcaption>
      <svg role="img" aria-labelledby="heatmap-sequential-title heatmap-sequential-desc" viewBox="0 0 320 244" style="display:block;width:100%;max-width:480px;height:auto;font-family:Arial,Helvetica,sans-serif;" data-chart="heatmap-sequential">
