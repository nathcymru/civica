# Synthetic data and no live actions.
examples:
  spec-card-navigation-room:
    title: A room navigation card
    description: A single heading link opens a useful local room overview. The card is navigation; it contains no nested device buttons.
    height: 680
    html: <article class="civica-card-demo" aria-labelledby="spec-nav-kitchen-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="spec-nav-kitchen-title"><a class="govuk-link" href="#spec-nav-kitchen">Kitchen overview</a></h2><p class="govuk-body">Find the example ceiling light, temperature reading and room notes.</p><p class="govuk-body">The heading link opens the information below. It does not operate a device.</p></div></article><section id="spec-nav-kitchen" tabindex="-1"><h2 class="govuk-heading-m">Kitchen overview</h2><p class="govuk-body">Synthetic observations reported on <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London).</p><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Ceiling light</dt><dd class="govuk-summary-list__value">Off</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Room temperature</dt><dd class="govuk-summary-list__value">19.8 °C</dd></div></dl><p class="govuk-body">These are independent example entities. No appliance capability or remote action is inferred from the room name.</p></section>
  spec-card-information-reading:
    title: An information card with a complete reading
    description: A non-clickable card shows the measured quantity, unit, source and observation time. It has no pretend preview or reset actions.
    height: 500
    html: <article class="civica-card-demo" aria-labelledby="spec-info-temperature-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="spec-info-temperature-title">Living room temperature</h2><p class="govuk-body"><strong>20.5 °C</strong></p><p class="govuk-body">Reported by the example room sensor on <time datetime="2026-11-11T18:42:00+00:00">11 November 2026 at 18:42 GMT</time> (Europe/London).</p><p class="govuk-body">This is a synthetic measured air temperature, not a heating target. The card displays information and has no interactive controls.</p></div></article>
  spec-card-features-tile:
    title: A light tile with a brightness feature
    description: "A simulated tile card with one card feature beneath it: a brightness slider that shows its value in words. Home Assistant draws its own tile and slider, so the look differs. The slider moves but changes nothing in a home, and the reported state does not follow it."
    height: 420
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-feature-title"><div class="civica-card-demo__body"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span aria-hidden="true" style="width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#E8F1F8;color:#0B0C0C">&#9728;</span><div><h2 class="govuk-heading-s" id="spec-feature-title" style="margin:0">Living room lamp</h2><p class="govuk-body" style="margin:0">On, brightness 60%</p></div></div><div class="govuk-form-group" style="margin-bottom:0"><label class="govuk-label" for="spec-feature-brightness">Brightness</label><input type="range" id="spec-feature-brightness" min="0" max="100" value="60" style="width:100%"><p class="govuk-hint" style="margin:4px 0 0">Reported by the lamp at 18:42. The slider shows what you ask for, not what the lamp has done.</p></div></div></article>
  spec-card-header-footer-garden:
    title: A garden card with a button header and a footer summary
    description: "A simulated entities card. The header holds two real actions, the rows show reported states and the footer gives the latest reading in words, because a graph alone would not carry it. The buttons do nothing here and no graph is drawn."
    height: 560
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-hf-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="spec-hf-title">Garden</h2><div role="group" aria-label="Quick actions" style="display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid #CECECE"><button type="button" class="govuk-button govuk-button--secondary" style="margin:0">Turn on porch light</button><button type="button" class="govuk-button govuk-button--secondary" style="margin:0">Lock gate</button></div><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Porch light</dt><dd class="govuk-summary-list__value">Off</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Gate</dt><dd class="govuk-summary-list__value">Unlocked</dd></div></dl><p class="govuk-body" style="border-top:1px solid #CECECE;padding-top:12px;margin-bottom:0"><strong>Garden temperature 14.2 °C</strong>, steady over the last 24 hours.</p></div></article>
  spec-card-heading-kitchen:
    title: A section heading card with a subtitle
    description: "A simulated heading card: a title, a smaller subtitle beneath a section, and the reading shown as words. A real heading card has no border or background of its own. Nothing here is interactive."
    height: 360
    html: |
      <section aria-labelledby="spec-hc-title"><h2 class="govuk-heading-m" id="spec-hc-title" style="margin-bottom:4px">Kitchen</h2><h3 class="govuk-heading-s" style="margin-bottom:12px;color:#484949;font-weight:400">Lights and temperature</h3><ul class="govuk-list" style="display:flex;gap:12px;flex-wrap:wrap"><li style="padding:4px 12px;border:1px solid #CECECE">Ceiling light: off</li><li style="padding:4px 12px;border:1px solid #CECECE">Temperature: 19.8 °C</li></ul><article class="civica-card-demo civica-card-demo--secondary" aria-labelledby="spec-hc-next"><div class="civica-card-demo__body"><h4 class="govuk-heading-s" id="spec-hc-next">Ceiling light</h4><p class="govuk-body">Off, reported at 18:42.</p></div></article></section>
  spec-card-activity-front-door:
    title: An Activity card for the front door
    description: "A simulated Activity card (the Home Assistant card of type logbook): a title, the period it covers, and entries with the time first and plain words after it. Home Assistant draws its own list and scrolls it inside the card. The 'Show more' link goes nowhere here."
    height: 520
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-activity-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="spec-activity-title">Front door activity</h2><p class="govuk-hint">Last 24 hours</p><ul class="govuk-list" style="max-height:200px;overflow:auto;border-top:1px solid #CECECE"><li style="padding:8px 0;border-bottom:1px solid #CECECE"><strong>17:52</strong> Door locked</li><li style="padding:8px 0;border-bottom:1px solid #CECECE"><strong>17:48</strong> Door closed</li><li style="padding:8px 0;border-bottom:1px solid #CECECE"><strong>17:47</strong> Door opened</li><li style="padding:8px 0;border-bottom:1px solid #CECECE"><strong>08:05</strong> Door unlocked</li></ul><p class="govuk-body"><a class="govuk-link" href="#spec-activity-title">Show more<span class="govuk-visually-hidden"> front door activity</span></a></p></div></article>
  spec-category-picker-automation:
    title: A form that asks which category an automation belongs to
    description: "A simulated stand-in for the closed category picker: the label asks in terms of the task, the helper text says that a category belongs to one list, and the chosen category shows beside a tag mark. Home Assistant draws its own field and list, so the look differs. Nothing here can be changed, and the open list is not shown."
    height: 460
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-cat-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="spec-cat-title">Save automation</h2><div class="govuk-form-group"><span class="govuk-label" id="spec-cat-label">Category</span><div class="govuk-hint" id="spec-cat-hint">A category groups automations in this list. An automation has one category.</div><div role="group" aria-labelledby="spec-cat-label" aria-describedby="spec-cat-hint" style="border-bottom:1px solid #0b0c0c;background:#fff;padding:8px 12px"><span aria-hidden="true">&#127991;&#65039; </span><strong>Heating</strong></div></div><p class="civica-card-demo__actions"><button type="button" class="govuk-button">Save</button></p></div></article>
