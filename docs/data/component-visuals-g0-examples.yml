# Original layout diagrams drawn in the illustration palette. No data.
examples:
  cv0-header-footer-slots:
    title: The slots of a card with a header and a footer
    description: "A card drawn as three stacked zones. The header sits above the content and the footer below it. The drawing is not interactive."
    height: 420
    html: |
      <figure style="margin:0;max-width:420px"><div style="border:2px solid #0B0C0C;background:#FFFFFF;padding:12px;margin:0;display:grid;gap:8px"><div style="display:flex;gap:12px;align-items:center;background:#BFD9ED;padding:12px;border:1px solid #103E65"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:#103E65;color:#FFFFFF;text-align:center;line-height:28px;font-weight:700">1</span><span><strong>Header</strong><br>Optional widget above the content</span></div><div style="display:flex;gap:12px;align-items:center;background:#F3F6F9;padding:12px;border:1px solid #103E65"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:#103E65;color:#FFFFFF;text-align:center;line-height:28px;font-weight:700">2</span><span><strong>Card content</strong><br>Rows, reading or heading of the card</span></div><div style="display:flex;gap:12px;align-items:center;background:#BFD9ED;padding:12px;border:1px solid #103E65"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:#103E65;color:#FFFFFF;text-align:center;line-height:28px;font-weight:700">3</span><span><strong>Footer</strong><br>Optional widget below the content</span></div></div><figcaption class="civica-body-s" style="margin-top:8px">The slots of a card: 1 the header, 2 the card content and 3 the footer. A widget in the header or footer is a row of buttons, a small graph or a picture.</figcaption></figure>
  cv0-card-feature-positions:
    title: Where card features sit
    description: "Two cards side by side. In the first the features row sits below the main content. In the second it sits beside the tile on the same row. The drawing is not interactive."
    height: 460
    html: |
      <figure style="margin:0"><div style="display:flex;gap:16px;flex-wrap:wrap"><div style="border:2px solid #0B0C0C;background:#FFFFFF;padding:12px;margin:0;flex:1 1 180px;display:grid;gap:8px"><strong>Bottom (default)</strong><div style="display:flex;gap:12px;align-items:center;background:#F3F6F9;padding:12px;border:1px solid #103E65"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:#103E65;color:#FFFFFF;text-align:center;line-height:28px;font-weight:700">1</span><span><strong>Tile</strong><br>Name and state</span></div><div style="display:flex;gap:12px;align-items:center;background:#BFD9ED;padding:12px;border:1px solid #103E65"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:#103E65;color:#FFFFFF;text-align:center;line-height:28px;font-weight:700">2</span><span><strong>Features</strong><br>Slider, buttons or dropdown</span></div></div><div style="border:2px solid #0B0C0C;background:#FFFFFF;padding:12px;margin:0;flex:1 1 180px;display:grid;gap:8px"><strong>Inline</strong><div style="display:flex;gap:8px;flex-wrap:wrap"><div style="flex:1 1 150px"><div style="display:flex;gap:12px;align-items:center;background:#F3F6F9;padding:12px;border:1px solid #103E65"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:#103E65;color:#FFFFFF;text-align:center;line-height:28px;font-weight:700">1</span><span><strong>Tile</strong><br>Name and state</span></div></div><div style="flex:1 1 150px"><div style="display:flex;gap:12px;align-items:center;background:#BFD9ED;padding:12px;border:1px solid #103E65"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:#103E65;color:#FFFFFF;text-align:center;line-height:28px;font-weight:700">2</span><span><strong>Features</strong><br>One control</span></div></div></div></div></div><figcaption class="civica-body-s" style="margin-top:8px">The two places for features: 1 the tile with the name and state, and 2 the features, either below the tile or beside it on the same row.</figcaption></figure>
  cv0-canvas-layers:
    title: What a canvas holds
    description: "A canvas drawn as two layers. The painted drawing cannot be read by assistive technology; the fallback text can. The drawing is not interactive."
    height: 380
    html: |
      <figure style="margin:0;max-width:420px"><div style="border:2px solid #0B0C0C;background:#FFFFFF;padding:12px;margin:0;display:grid;gap:8px"><div style="display:flex;gap:12px;align-items:center;background:#BFD9ED;padding:12px;border:1px solid #103E65"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:#103E65;color:#FFFFFF;text-align:center;line-height:28px;font-weight:700">1</span><span><strong>Painted drawing</strong><br>Pixels set by a script. Not readable by assistive technology.</span></div><div style="display:flex;gap:12px;align-items:center;background:#F3F6F9;padding:12px;border:1px solid #103E65"><span aria-hidden="true" style="flex:none;width:28px;height:28px;border-radius:50%;background:#103E65;color:#FFFFFF;text-align:center;line-height:28px;font-weight:700">2</span><span><strong>Fallback content</strong><br>Text between the tags. Readable, and should carry the same information.</span></div></div><figcaption class="civica-body-s" style="margin-top:8px">The two parts of a canvas: 1 the painted drawing and 2 the fallback content written between its tags.</figcaption></figure>
