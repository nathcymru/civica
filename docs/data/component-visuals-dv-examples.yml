# invented values only. Text tables, no chart colours.
examples:
  cvd-gauge-bands:
    title: "Boiler pressure bands and the reading each one gives"
    description: "Every value and reading here is example data."
    height: 260
    html: "<div class=\"civica-table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"Boiler pressure bands\"><table style=\"overflow-wrap:normal;border-collapse:collapse;width:100%;min-width:30rem;font-size:1rem\"><caption style=\"text-align:left;font-weight:700;padding:0 0 8px\">Boiler pressure gauge, scale 0 to 3 bar</caption><thead><tr><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Band</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">From (bar)</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Up to (bar)</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Segment colour</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Sample reading (bar)</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Text shown with a needle</th></tr></thead><tbody><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Low</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">0</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">1 (not included)</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Red</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">0.6</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Low</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Normal</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">1</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">2 (not included)</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Green</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">1.4</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Normal</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">High</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">2</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">3</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Amber</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">2.5</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">High</td></tr></tbody></table></div><p style=\"margin:8px 0 0\">Example values only. The band is also written in words, so colour is never the only cue. Without a needle the arc takes the colour of the band the reading is in, and the number is shown instead of the label.</p>"
  cvd-progress-states:
    title: "Progress indicators and the words that go with each"
    description: "Every value here is example data."
    height: 330
    html: "<div class=\"civica-table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"Progress indicator states\"><table style=\"overflow-wrap:normal;border-collapse:collapse;width:100%;min-width:30rem;font-size:1rem\"><caption style=\"text-align:left;font-weight:700;padding:0 0 8px\">Update, shown by each kind of indicator</caption><thead><tr><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Indicator</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">State</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Known end</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Value exposed to assistive technology</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Words to write beside it</th></tr></thead><tbody><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Progress bar</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Determinate</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Yes</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Value 3 of 5</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Installing the update: step 3 of 5</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Progress bar</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Indeterminate</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">No</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">No value</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Installing the update</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Progress ring</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Determinate</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Yes</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Set by the author</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Backup 60% complete</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Spinner</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Working</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">No</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">None</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Loading the update list</td></tr></tbody></table></div><p style=\"margin:8px 0 0\">Example values only. The indicator on its own says only that work is happening, so the words beside it carry the meaning.</p>"
  cvd-admin-counts:
    title: "Count wording for the three administration cards"
    description: "Every count here is example data."
    height: 380
    html: "<div class=\"civica-table-scroll\" role=\"region\" tabindex=\"0\" aria-label=\"Administration card wording\"><table style=\"overflow-wrap:normal;border-collapse:collapse;width:100%;min-width:30rem;font-size:1rem\"><caption style=\"text-align:left;font-weight:700;padding:0 0 8px\">Counts for the three administration cards</caption><thead><tr><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Card</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Count</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Text shown</th><th scope=\"col\" style=\"text-align:left;border-bottom:2px solid #0B0C0C;padding:8px\">Shown when hide_empty is on</th></tr></thead><tbody><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Devices discovered</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">0</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">No devices to add</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Hidden</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Devices discovered</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">2</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">2 devices to add</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Shown</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Repairs</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">0</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">No issues</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Hidden</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Repairs</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">3</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">3 issues</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Shown</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Updates</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">0</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Up to date</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Hidden</td></tr><tr><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Updates</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">1</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">1 update available</td><td style=\"border-bottom:1px solid #B1B4B6;padding:8px\">Shown</td></tr></tbody></table></div><p style=\"margin:8px 0 0\">Example values only. A count of zero is a real count, not missing data, so the card says so in words.</p>"
