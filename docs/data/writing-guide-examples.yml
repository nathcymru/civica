# Original Civica writing examples. All household data is synthetic.
examples:
  wg-state-action:
    title: "Reading lamp card"
    description: "A dashboard card for the reading lamp. It shows Off, reported at 18:42, with a Turn on button."
    height: 500
    html: |
      <article class="civica-card-demo" aria-labelledby="wg-state-action-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="wg-state-action-title">Reading lamp</h2><p class="govuk-body"><strong>Off</strong></p><p class="govuk-body">Reported at <time datetime="2026-11-11T18:42:00+00:00">18:42</time></p><div class="civica-card-demo__actions"><button type="button" class="govuk-button" data-demo-message="Request sent. Waiting for the reading lamp to report its state.">Turn on</button></div><p class="govuk-body" data-demo-status role="status" aria-live="polite"></p></div></article>
  wg-automation-status:
    title: "Hall lights automation card"
    description: "A dashboard card for the Hall lights after sunset automation. It is on, so it starts by itself. It is not running now. It last triggered today at 16:22. Changes were saved today at 18:30."
    height: 500
    html: |
      <article class="civica-card-demo" aria-labelledby="wg-automation-status-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="wg-automation-status-title">Hall lights after sunset</h2><p class="govuk-body"><strong>On</strong></p><dl class="govuk-summary-list"><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Running now</dt><dd class="govuk-summary-list__value">No</dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Last triggered</dt><dd class="govuk-summary-list__value"><time datetime="2026-11-11T16:22:00+00:00">Today at 16:22</time></dd></div><div class="govuk-summary-list__row"><dt class="govuk-summary-list__key">Changes saved</dt><dd class="govuk-summary-list__value"><time datetime="2026-11-11T18:30:00+00:00">Today at 18:30</time></dd></div></dl></div></article>
  wg-warning-context:
    title: "Boiler service reminder card"
    description: "A dashboard card reminds the household that the boiler is due its yearly service, and gives the date of the last one."
    height: 500
    html: |
      <article class="civica-card-demo" aria-labelledby="wg-warning-context-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="wg-warning-context-title">Boiler service</h2><p class="govuk-body"><strong>Service due</strong></p><p class="govuk-body">Last service: <time datetime="2025-11-02">2 November 2025</time>. Services are due once a year.</p><p class="govuk-body">Book a service. If the boiler has been serviced since then, update the date.</p></div></article>
  wg-data-meaning:
    title: "Power and energy cards"
    description: "Two dashboard cards for the home's electricity. Power now is 420W at 18:42. Energy used today is 4.62kWh, from midnight to 18:42."
    height: 500
    html: |
      <ul class="civica-card-demo-grid"><li><article class="civica-card-demo" aria-labelledby="wg-data-meaning-power-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="wg-data-meaning-power-title">Power now</h2><p class="govuk-body"><strong class="civica-card-demo__metric">420W</strong></p><p class="govuk-body">At <time datetime="2026-11-11T18:42:00+00:00">18:42</time></p></div></article></li><li><article class="civica-card-demo" aria-labelledby="wg-data-meaning-energy-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="wg-data-meaning-energy-title">Energy used today</h2><p class="govuk-body"><strong class="civica-card-demo__metric">4.62kWh</strong></p><p class="govuk-body">From <time datetime="2026-11-11T00:00:00+00:00">00:00</time> to <time datetime="2026-11-11T18:42:00+00:00">18:42</time></p></div></article></li></ul>
  wg-data-gaps:
    title: "Car charger hourly use card"
    description: "A dashboard card with a table of the car charger's electricity use each hour overnight. From 03:00 to 04:00 there is no reading. In each hour from 05:00 to 07:00 it used 0.00kWh."
    height: 600
    html: |
      <article class="civica-card-demo" aria-labelledby="wg-data-gaps-title"><div class="civica-card-demo__body"><h2 class="govuk-heading-m" id="wg-data-gaps-title">Car charger</h2><table class="govuk-table"><caption class="govuk-table__caption govuk-table__caption--s">Energy used each hour, <time datetime="2026-11-11">11 November 2026</time></caption><thead class="govuk-table__head"><tr class="govuk-table__row"><th class="govuk-table__header" scope="col">Hour</th><th class="govuk-table__header govuk-table__header--numeric" scope="col">Energy used (kWh)</th></tr></thead><tbody class="govuk-table__body"><tr class="govuk-table__row"><th class="govuk-table__header" scope="row">01:00 to 02:00</th><td class="govuk-table__cell govuk-table__cell--numeric">7.20</td></tr><tr class="govuk-table__row"><th class="govuk-table__header" scope="row">02:00 to 03:00</th><td class="govuk-table__cell govuk-table__cell--numeric">7.18</td></tr><tr class="govuk-table__row"><th class="govuk-table__header" scope="row">03:00 to 04:00</th><td class="govuk-table__cell govuk-table__cell--numeric">No reading</td></tr><tr class="govuk-table__row"><th class="govuk-table__header" scope="row">04:00 to 05:00</th><td class="govuk-table__cell govuk-table__cell--numeric">4.06</td></tr><tr class="govuk-table__row"><th class="govuk-table__header" scope="row">05:00 to 06:00</th><td class="govuk-table__cell govuk-table__cell--numeric">0.00</td></tr><tr class="govuk-table__row"><th class="govuk-table__header" scope="row">06:00 to 07:00</th><td class="govuk-table__cell govuk-table__cell--numeric">0.00</td></tr></tbody></table></div></article>
