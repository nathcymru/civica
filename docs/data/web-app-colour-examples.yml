      <section aria-labelledby="web-dashboard-h">
      <h2 class="govuk-heading-m" id="web-dashboard-h">Web palette example</h2>
      <p class="govuk-body">A Home Assistant dashboard with the Civica theme and companion in a desktop browser. Notice the White background and cards, the Primary blue toolbar with the view tabs in White, Black tint 80% card borders, Black text with secondary text and sidebar icons in Black tint 25%, and the link in Blue shade 10%. The switch that is on is Primary blue. The heating dial uses Home Assistant’s own orange for heating, drawn in the nearest palette colour, Primary orange. The theme colours for the selected sidebar row, #E8EEF3 and #19578D, are not palette colours either, so the row is drawn as Black tint 95% with Blue shade 25% text.</p>
      <div style="max-width:720px">
      <figure style="margin:0 0 30px" aria-labelledby="web-dashboard-c">
      <div role="region" aria-label="Dashboard drawing, which scrolls sideways on a narrow screen" tabindex="0" style="overflow-x:auto">
