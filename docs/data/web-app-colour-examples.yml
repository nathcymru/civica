      <title id="web-dashboard-t">Web palette example: a Home Assistant dashboard in a desktop browser</title>
      <desc id="web-dashboard-d">A desktop browser shows a Home Assistant dashboard with the Civica theme and companion on a White background. On the left is Home Assistant’s sidebar: a Primary blue row with the menu icon and the Civica logo in White, which the Civica companion adds, then Overview, which is selected, on a Black tint 95% row with its icon and name in Blue shade 25%, Energy, Map, Logbook and History, and at the bottom Settings, Notifications and the user Alex Morgan. The Primary blue toolbar has the view tabs Home, Upstairs and Garden in White, with Home underlined, and Search, Assist and menu icons. The Home view has 2 badges, 9.5 °C and 1.2 kW, and 2 sections. Living room has an entities card where Main light is on, with a Primary blue switch, and Lamp is off, and a thermostat card heating to 21 °C with a current temperature of 19.5 °C on a Primary orange dial. Kitchen has tiles for Temperature 20.5 °C, Humidity 48 % and Window Closed, and a card that says bins go out on Thursday with a link to the bin calendar in Blue shade 10%. Cards are White with Black tint 80% borders, text is Black and secondary text Black tint 25%.</desc>
