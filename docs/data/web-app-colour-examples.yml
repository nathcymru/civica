      <figure style="margin:0 0 30px" aria-labelledby="app-examples-c">
      <div style="display:flex;flex-wrap:wrap;gap:20px;justify-content:center">
      <div style="flex:1 1 250px;max-width:340px">
      <svg viewBox="0 0 380 760" role="img" aria-labelledby="app-examples-t app-examples-d" style="display:block;width:100%;height:auto;font-family:Arial,Helvetica,sans-serif">
      <title id="app-examples-t">App examples: tiles with tinted icons</title>
      <desc id="app-examples-d">The Companion app shows the Upstairs view under the Primary blue toolbar. A guide annotation, which is not part of the app, points at the menu icon: an Accent yellow label with a Black border that says Tap to open the menu in Black. Each tile has its icon in a tinted circle: Bedside lamp and Desk lamp are on, with yellow icons on Yellow tint 80%; Heating is heating, with an orange icon on Orange tint 80%; Ceiling light, Spotlights and the sensors have Black tint 25% icons on Black tint 80%. The tiles themselves stay White with Black tint 80% borders.</desc>
