      <p class="govuk-body">Two Companion app screens with tinted tiles and menus. Notice the Accent teal label and the Blue tint 95% tiles and menus, which add structure without clutter. They are drawings, not screenshots of the Companion app. The household, person, areas and app version are invented.</p>
