# Component specification examples; data and no live actions.
examples:
  spec-abbreviation-help:
    title: A help card that expands an abbreviation on first use
    description: "The full term comes first with the abbreviation in brackets, so no one needs to hover. Later uses show the short form, marked up with abbr."
    height: 420
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-abbr-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-abbr-title">Charging at home</h2><p class="civica-body">Your electric vehicle (<abbr title="electric vehicle">EV</abbr>) charger is on the driveway wall.</p><p class="civica-body">The <abbr title="electric vehicle">EV</abbr> charger starts when electricity is cheapest. Change the time on the Energy dashboard.</p></div></article>
  spec-address-contact:
    title: A help card with a contact block
    description: "The address element holds the contact details for this help page, one line for each part. The household's own address is written as ordinary lines, not as an address element."
    height: 520
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-address-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-address-title">Need help with this dashboard?</h2><p class="civica-body">Ask the person who looks after it.</p><address class="civica-body">Sam Okafor<br>Household dashboard<br>sam@example.com</address><h3 class="civica-heading-s">Home address for deliveries</h3><p class="civica-body">14 Mill Lane<br>Exampletown<br>EX1 2MP</p></div></article>
  spec-alarm-panel-disarmed:
    title: An alarm panel card, disarmed
    description: "The heading names the alarm and the state is written in words beside it. The arm buttons, the Code field and the keypad follow."
    height: 760
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-alarm-title"><div class="civica-card-demo__body"><div class="civica-card-demo__heading-row"><h2 class="civica-heading-m" id="spec-alarm-title">House alarm</h2><strong class="civica-tag civica-tag--grey">Disarmed</strong></div><p class="civica-card-demo__actions"><button type="button" class="civica-button civica-button--secondary">Arm home</button><button type="button" class="civica-button civica-button--secondary">Arm away</button></p><div class="civica-form-group"><label class="civica-label" for="spec-alarm-code">Code</label><input class="civica-input civica-input--width-5" id="spec-alarm-code" type="password" inputmode="numeric" autocomplete="one-time-code"></div><p class="civica-card-demo__actions"><button type="button" class="civica-button civica-button--secondary">1</button><button type="button" class="civica-button civica-button--secondary">2</button><button type="button" class="civica-button civica-button--secondary">3</button></p><p class="civica-card-demo__actions"><button type="button" class="civica-button civica-button--secondary">4</button><button type="button" class="civica-button civica-button--secondary">5</button><button type="button" class="civica-button civica-button--secondary">6</button></p><p class="civica-card-demo__actions"><button type="button" class="civica-button civica-button--secondary">7</button><button type="button" class="civica-button civica-button--secondary">8</button><button type="button" class="civica-button civica-button--secondary">9</button></p><p class="civica-card-demo__actions"><button type="button" class="civica-button civica-button--secondary">Clear</button><button type="button" class="civica-button civica-button--secondary">0</button></p></div></article>
  spec-alert-types:
    title: The four alert types and a tip on one card
    description: "A Civica rendering of the four alert types. Each alert has a word label and a message, so colour never carries the meaning alone. The tip is ordinary text with a visible label."
    height: 1050
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-alert-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-alert-title">Heating and hot water</h2><div class="civica-notification-banner" role="region" aria-labelledby="spec-alert-info"><div class="civica-notification-banner__header"><h3 class="civica-notification-banner__title" id="spec-alert-info">Information</h3></div><div class="civica-notification-banner__content"><p class="civica-notification-banner__heading">Hot water runs from 6am to 8am.</p></div></div><div class="civica-warning-callout"><h3 class="civica-heading-s civica-warning-callout__heading">Warning</h3><p class="civica-body">The thermostat has not reported for 2 hours.</p></div><div class="civica-error-summary" data-module="" role="group" aria-labelledby="spec-alert-error"><h3 class="civica-error-summary__title" id="spec-alert-error">Error</h3><div class="civica-error-summary__body"><p class="civica-body">The boiler did not accept the new schedule. Check that it is turned on, then try again.</p></div></div><div class="civica-notification-banner civica-notification-banner--success" role="region" aria-labelledby="spec-alert-success"><div class="civica-notification-banner__header"><h3 class="civica-notification-banner__title" id="spec-alert-success">Success</h3></div><div class="civica-notification-banner__content"><p class="civica-notification-banner__heading">The new schedule is saved.</p></div></div><div class="civica-inset-text"><strong>Tip:</strong> Set the schedule one hour before you need hot water.</div></div></article>
  spec-bottom-sheet-date-range:
    title: A date range sheet
    description: "The title says what to choose, the body says what it changes, and the footer puts Close first and Apply last."
    height: 420
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-sheet-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-sheet-title">Choose a date range</h2><p class="civica-body">Pick the days you want the chart to show.</p><p class="civica-card-demo__actions"><button type="button" class="civica-button civica-button--secondary">Close</button><button type="button" class="civica-button">Apply</button></p></div></article>
  spec-area-card-kitchen:
    title: A compact area card for the kitchen
    description: "A compact area card: a round icon, the area name, readings with units and an alert written in words, so nothing depends on an icon or colour. It does nothing when tapped."
    height: 300
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-area-title"><div class="civica-card-demo__body"><div style="display:flex;align-items:center;gap:16px"><svg aria-hidden="true" focusable="false" width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#d2e2f1"></circle><path d="M12 28V18l8-6 8 6v10z" fill="none" stroke="#0b0c0c" stroke-width="2"></path></svg><div><h2 class="civica-heading-s" id="spec-area-title" style="margin:0">Kitchen</h2><p class="civica-body" style="margin:0">20.5°C · 48%</p><p class="civica-body" style="margin:0"><strong>Motion detected</strong></p></div></div></div></article>
  spec-area-picker-schedule:
    title: A form that asks which area a schedule is for
    description: "A stand-in for the closed area picker: the label asks in terms of the task, the helper text says what the choice changes, and the chosen area shows its floor beneath its name. Home Assistant draws its own field and list, so the look differs. Nothing here can be changed, and the open list is not shown."
    height: 460
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-picker-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-picker-title">Add a lighting schedule</h2><div class="civica-form-group"><span class="civica-label" id="spec-picker-label">Which area is this for?</span><div class="civica-hint" id="spec-picker-hint">The schedule will apply to every light in this area.</div><div role="group" aria-labelledby="spec-picker-label" aria-describedby="spec-picker-hint" style="border-bottom:1px solid #0b0c0c;background:#fff;padding:8px 12px"><strong>Living room</strong><br><span class="civica-hint" style="margin:0">Ground floor</span></div></div><p class="civica-card-demo__actions"><button type="button" class="civica-button">Save schedule</button></p></div></article>
  spec-article-note:
    title: A self-contained help note
    description: "The heading comes first, then the date, then a short body. The note makes sense if it is read on its own."
    height: 380
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-article-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-article-title">Heating schedule changed</h2><p class="civica-body"><time datetime="2026-11-24">24 November 2026</time></p><p class="civica-body">The evening schedule now starts at 5pm. Change it on the Heating dashboard.</p></div></article>
  spec-aside-schedule:
    title: A hot water schedule with a note that can be skipped
    description: "The schedule and the way to change it are in the main text. The note under About this setting is background, so someone who skips it still knows what to do."
    height: 520
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-aside-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-aside-title">Hot water schedule</h2><p class="civica-body">Hot water runs from 6am to 8am. Choose Edit schedule to change the times.</p><aside aria-labelledby="spec-aside-note"><h3 class="civica-heading-s" id="spec-aside-note">About this setting</h3><p class="civica-body">The schedule only changes when the boiler is turned on.</p></aside></div></article>
  spec-assist-dialog-typed:
    title: An Assist conversation
    description: "A conversation drawn as message bubbles: a typed request with a written answer, then a request Assist did not understand, with the problem and the next step in words. There is no microphone. The field and the Send button do nothing."
    height: 560
    html: |
      <article class="civica-card-demo" aria-labelledby="spec-assist-title"><div class="civica-card-demo__body"><h2 class="civica-heading-m" id="spec-assist-title">Assist</h2><div style="display:flex;flex-direction:column;gap:8px"><p class="civica-body" style="align-self:flex-end;margin:0;padding:8px 12px;background:#1d70b8;color:#fff;border-radius:16px 16px 0 16px">Turn on the kitchen light</p><p class="civica-body" style="align-self:flex-start;margin:0;padding:8px 12px;background:#f3f2f1;border-radius:16px 16px 16px 0">Turned on the kitchen light.</p><p class="civica-body" style="align-self:flex-end;margin:0;padding:8px 12px;background:#1d70b8;color:#fff;border-radius:16px 16px 0 16px">Make it cosy</p><p class="civica-body" style="align-self:flex-start;margin:0;padding:8px 12px;background:#ca3535;color:#fff;border-radius:16px 16px 16px 0">Sorry, I did not understand that. Try naming a light and what to do, for example “Dim the kitchen light to 40%”.</p></div><div class="civica-form-group"><label class="civica-label" for="spec-assist-input">Type a request</label><input class="civica-input" id="spec-assist-input" type="text"></div><p class="civica-card-demo__actions"><button type="button" class="civica-button">Send</button></p></div></article>
  spec-action-links-start:
    title: Start a dashboard setup journey
    description: An action link with a clear label and an arrow signals the start of a task. It opens a view on the same dashboard and does not operate a device.
    height: 340
    html: |
      <div class="civica-action-link">
      <a class="civica-link" href="#start-view">
      <svg aria-hidden="true" focusable="false" width="40" height="40" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="20" fill="#d2e2f1">
      </circle>
      <path d="M12 20H28M22 14L28 20L22 26" fill="none" stroke="#0b0c0c" stroke-width="2">
      </path>
      </svg>
      <span>Set up a shared view</span>
      </a>
      </div>
      <section id="start-view" tabindex="-1">
      <h2 class="civica-heading-m">Set up a shared view</h2>
      <p class="civica-body">Choose rooms and review their labels.</p>
      </section>
  spec-action-links-help:
    title: Open display-colour help
    description: A real local help destination explains the theme colour and display mode without changing a preference.
    height: 340
    html: |
      <div class="civica-action-link">
      <a class="civica-link" href="#review-preferences">
      <svg aria-hidden="true" focusable="false" width="40" height="40" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="20" fill="#d2e2f1">
      </circle>
      <path d="M12 20H28M22 14L28 20L22 26" fill="none" stroke="#0b0c0c" stroke-width="2">
      </path>
      </svg>
      <span>Understand display colours</span>
      </a>
      </div>
      <section id="review-preferences" tabindex="-1">
      <h2 class="civica-heading-m">Understand display colours</h2>
      <p class="civica-body">Choose a Theme colour for the interface’s header, buttons and highlights. Home Assistant’s Light, Dark or Auto display mode stays separate. Selecting a colour applies through the native theme flow. Reading this help changes no preference.</p>
      </section>
