name: Report a problem
description: Tell us about a problem with a page, an example or the theme.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not include credentials, private household information or personal contact details.
  - type: input
    id: page
    attributes:
      label: Page address
      description: The address of the page with the problem. It is filled in for you when you use Report a problem on a page.
    validations:
      required: false
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or Home Assistant version
      description: Optional. Include it if the problem may depend on it.
    validations:
      required: false
